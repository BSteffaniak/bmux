entry = "libbmux_example_native_plugin.dylib"
id = "example.native"
name = "Example Native Plugin"
provided_features = ["example.native"]
required_capabilities = [
    "bmux.commands",
    "bmux.config.read",
    "bmux.events.subscribe",
    "bmux.storage",
    "bmux.permissions.read",
    "bmux.permissions.write",
    "bmux.tabs.read",
    "bmux.tabs.write",
    "bmux.tab_bar.notify",
    "bmux.tab_bar.status.write",
]
runtime = "native"
version = "0.0.1-alpha.0"

[[commands]]
expose_in_cli = true
name          = "hello"
summary       = "Print a hello message"

[[commands.arguments]]
allow_hyphen_values = true
kind                = "string"
multiple            = true
name                = "message"
position            = 0
summary             = "Optional greeting target"
trailing_var_arg    = true
value_name          = "MESSAGE"

[[commands]]
expose_in_cli = true
name          = "prompt-showcase"
summary       = "Queue plugin-provided attach prompts (requires active attach host)"

[[commands]]
expose_in_cli = true
name          = "permissions-list"
summary       = "List session permissions through bmux provider service"

[[commands.arguments]]
kind       = "string"
name       = "session"
position   = 0
required   = true
summary    = "Session name or UUID"
value_name = "SESSION"

[[commands]]
expose_in_cli = true
name          = "permissions-grant"
summary       = "Grant a role through bmux provider service"

[[commands.arguments]]
kind       = "string"
name       = "session"
position   = 0
required   = true
summary    = "Session name or UUID"
value_name = "SESSION"

[[commands.arguments]]
kind       = "string"
long       = "client"
name       = "client"
required   = true
short      = "c"
summary    = "Client UUID"
value_name = "CLIENT"

[[commands.arguments]]
kind       = "choice"
long       = "role"
name       = "role"
required   = true
short      = "r"
summary    = "Role to grant"
value_name = "ROLE"
values     = ["owner", "writer", "observer"]

[[commands]]
expose_in_cli = true
name          = "permissions-revoke"
summary       = "Revoke a role through bmux provider service"

[[commands.arguments]]
kind       = "string"
name       = "session"
position   = 0
required   = true
summary    = "Session name or UUID"
value_name = "SESSION"

[[commands.arguments]]
kind       = "string"
long       = "client"
name       = "client"
required   = true
short      = "c"
summary    = "Client UUID"
value_name = "CLIENT"

[[commands]]
expose_in_cli = true
name          = "tabs-list"
summary       = "List session windows through bmux provider service"

[[commands.arguments]]
kind       = "string"
name       = "session"
position   = 0
required   = true
summary    = "Session name or UUID"
value_name = "SESSION"

[[commands]]
expose_in_cli = true
name          = "windows-new"
summary       = "Create a session window through bmux provider service"

[[commands.arguments]]
kind       = "string"
name       = "session"
position   = 0
required   = true
summary    = "Session name or UUID"
value_name = "SESSION"

[[commands.arguments]]
kind       = "string"
long       = "name"
name       = "name"
short      = "n"
summary    = "Optional window name"
value_name = "NAME"

[[commands]]
expose_in_cli = true
name          = "settings-show"
summary       = "Show plugin settings through bmux config service"

[[commands]]
expose_in_cli = true
name          = "storage-put"
summary       = "Store a key/value through bmux storage service"

[[commands.arguments]]
kind       = "string"
name       = "key"
position   = 0
required   = true
summary    = "Storage key"
value_name = "KEY"

[[commands.arguments]]
allow_hyphen_values = true
kind                = "string"
multiple            = true
name                = "value"
position            = 1
required            = true
summary             = "Storage value"
trailing_var_arg    = true
value_name          = "VALUE"

[[commands]]
expose_in_cli = true
name          = "storage-get"
summary       = "Read a key through bmux storage service"

[[commands.arguments]]
kind       = "string"
name       = "key"
position   = 0
required   = true
summary    = "Storage key"
value_name = "KEY"

[[commands]]
expose_in_cli = true
name          = "status-set"
summary       = "Show a status item in the tab bar through the bmux.tab_bar service"

[[commands.arguments]]
kind       = "string"
name       = "id"
position   = 0
required   = true
summary    = "Item id (namespaced to this plugin)"
value_name = "ID"

[[commands.arguments]]
allow_hyphen_values = true
kind                = "string"
multiple            = true
name                = "text"
position            = 1
required            = true
summary             = "Item text plus optional --severity/--priority flags"
trailing_var_arg    = true
value_name          = "TEXT"

[[commands]]
expose_in_cli = true
name          = "status-clear"
summary       = "Clear one (or every) status item this plugin owns"

[[commands.arguments]]
kind       = "string"
name       = "id"
position   = 0
summary    = "Item id; omit to clear all of this plugin's items"
value_name = "ID"

[[commands]]
expose_in_cli = true
name          = "notify"
summary       = "Raise an attach toast through the bmux.tab_bar service"

[[commands.arguments]]
allow_hyphen_values = true
kind                = "string"
multiple            = true
name                = "title"
position            = 0
required            = true
summary             = "Toast title plus optional --body/--severity/--ttl-ms flags"
trailing_var_arg    = true
value_name          = "TITLE"

[[event_subscriptions]]
kinds = ["bmux.core/server-started", "bmux.tabs/pane-event"]

[[dependencies]]
plugin_id   = "bmux.permissions"
version_req = "=0.0.1-alpha.0"

[[dependencies]]
plugin_id   = "bmux.tabs"
version_req = "=0.0.1-alpha.0"

[[dependencies]]
plugin_id   = "bmux.tab_bar"
version_req = "=0.0.1-alpha.0"
