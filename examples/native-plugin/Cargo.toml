[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Example native bmux plugin"
edition     = { workspace = true }
keywords    = ["bmux", "example", "native", "plugin"]
license     = { workspace = true }
name        = "bmux_example_native_plugin"
publish     = false
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bmux_cli                    = { workspace = true }
bmux_cli_output             = { workspace = true }
bmux_permissions_plugin_api = { workspace = true }
bmux_plugin                 = { workspace = true }
bmux_plugin_schema_macros   = { workspace = true }
bmux_plugin_sdk             = { workspace = true }
bmux_tab_bar_plugin_api     = { workspace = true }
bmux_tabs_plugin_api        = { workspace = true }
serde                       = { workspace = true, features = ["derive", "std"] }
serde_json                  = { workspace = true }
uuid                        = { workspace = true, features = ["std"] }

[features]
# Package this crate as a dynamic library for one component. Only the
# plugin packager enables these, together with `--cfg bmux_plugin_dylib`.
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = [
    "bmux_cli/fail-on-warnings",
    "bmux_cli_output/fail-on-warnings",
    "bmux_permissions_plugin_api/fail-on-warnings",
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_tab_bar_plugin_api/fail-on-warnings",
    "bmux_tabs_plugin_api/fail-on-warnings",
]

[dev-dependencies]
bmux_plugin = { workspace = true }
