[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Minimal hello-world bmux plugin example"
edition     = { workspace = true }
keywords    = ["bmux", "example", "plugin"]
license     = { workspace = true }
name        = "bmux_hello_plugin"
publish     = false
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk           = { workspace = true }

[dev-dependencies]
bmux_plugin_test = { workspace = true }
tokio            = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
# Package this crate as a dynamic library for one component. Only the
# plugin packager enables these, together with `--cfg bmux_plugin_dylib`.
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = [
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
