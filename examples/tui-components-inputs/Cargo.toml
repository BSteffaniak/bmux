[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "gui"]
description = "Input and form examples for bmux_tui_components"
edition     = { workspace = true }
keywords    = ["bmux", "example", "tui", "forms"]
license     = { workspace = true }
name        = "bmux_tui_components_inputs"
publish     = false
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
anyhow              = { workspace = true, features = ["std"] }
bmux_keyboard       = { workspace = true }
bmux_text_edit      = { workspace = true }
bmux_tui            = { workspace = true }
bmux_tui_components = { workspace = true, features = ["text-input"] }

[features]
fail-on-warnings = ["bmux_tui_components/fail-on-warnings"]
