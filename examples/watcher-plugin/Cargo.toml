[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Reference consumer for the generated plugin author API"
edition     = { workspace = true }
keywords    = ["bmux", "example", "plugin"]
license     = { workspace = true }
name        = "bmux_example_watcher_plugin"
publish     = false
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib"]

[dependencies]
bmux_example_counter_plugin_api = { workspace = true }
bmux_ipc                        = { workspace = true }
bmux_plugin_schema_macros       = { workspace = true }
bmux_plugin_sdk                 = { workspace = true }

[package.metadata.cargo-machete]
# Referenced by the BPDL-generated provider bindings, not handwritten source.
ignored = ["bmux_ipc"]

[dev-dependencies]
bmux_example_counter_plugin = { workspace = true }
bmux_plugin_test            = { workspace = true }
tokio                       = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
# Package this crate as a dynamic library for one component. Only the
# plugin packager enables these, together with `--cfg bmux_plugin_dylib`.
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = [
    "bmux_example_counter_plugin_api/fail-on-warnings",
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
