[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Typed lifecycle contract for managed headless playbooks"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "api", "playbook"]
license     = { workspace = true }
name        = "bmux_playbook_plugin_api"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_ipc                  = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk           = { workspace = true }
serde                     = { workspace = true, features = ["derive", "std"] }
serde_json                = { workspace = true }

[package.metadata.cargo-machete]
# Generated BPDL endpoint implementations reference SDK/IPC/JSON transport.
# codegen_rust::emit_with_imports emits serde imports and derives for wire models;
# cargo-machete cannot trace those proc-macro-generated serde references.
ignored = ["bmux_ipc", "bmux_plugin_sdk", "serde_json", "serde"]

[features]
fail-on-warnings = []
