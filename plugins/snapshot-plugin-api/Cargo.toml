[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Typed public API of the bmux snapshot plugin (config + wire enums + offline_snapshot utility)"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "api", "snapshot"]
license     = { workspace = true }
name        = "bmux_snapshot_plugin_api"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
anyhow                    = { workspace = true, features = ["std"] }
bmux_client_state         = { workspace = true }
bmux_config               = { workspace = true }
bmux_context_state        = { workspace = true }
bmux_ipc                  = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk           = { workspace = true }
bmux_session_models       = { workspace = true, features = ["serde"] }
bmux_session_state        = { workspace = true }
bmux_snapshot_runtime     = { workspace = true }
serde                     = { workspace = true, features = ["derive", "std"] }
serde_json                = { workspace = true }
thiserror                 = { workspace = true }
uuid                      = { workspace = true, features = ["serde", "std"] }

[package.metadata.cargo-machete]
# `bmux_plugin_schema_macros::schema!` generates references to SDK transport
# types that cargo-machete cannot see in proc-macro-generated source.
ignored = ["bmux_plugin_sdk"]

[dev-dependencies]
tempfile = { workspace = true }

[features]
default          = []
fail-on-warnings = []
