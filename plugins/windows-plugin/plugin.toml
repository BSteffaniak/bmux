execution_class = "native_fast"
id = "bmux.windows"
name = "bmux Windows"
owns_namespaces = [
    "window",
    "new-window",
    "rename-window",
    "list-windows",
    "kill-window",
    "kill-all-windows",
    "switch-window",
    "move-window",
    "next-window",
    "prev-window",
    "last-window",
    "goto-window",
    "close-current-window",
    "reset-order",
    "focus-pane-in-direction",
    "split-pane",
    "resize-pane",
    "zoom-pane",
    "list-floating-panes",
    "create-floating-pane",
    "focus-floating-pane",
    "raise-floating-pane",
    "lower-floating-pane",
    "move-floating-pane",
    "resize-floating-pane",
    "set-floating-pane-z",
    "set-floating-pane-layer",
    "close-floating-pane",
    "close-active-pane",
    "restart-pane",
]
provided_capabilities = ["bmux.windows.read", "bmux.windows.write"]
provided_features = ["bmux.windows"]
required_capabilities = [
    "bmux.commands",
    "bmux.contexts.read",
    "bmux.contexts.write",
    "bmux.clients.read",
    "bmux.pane_runtime.read",
    "bmux.pane_runtime.write",
    "bmux.panes.read",
    "bmux.panes.write",
    "bmux.sessions.read",
    "bmux.sessions.write",
    "bmux.storage",
]
version = "0.0.1-alpha.0"

[[services]]
capability   = "bmux.windows.read"
interface_id = "windows-state"
kind         = "query"

[[services]]
capability   = "bmux.windows.write"
interface_id = "windows-commands"
kind         = "command"

[[services]]
capability   = "bmux.windows.read"
interface_id = "windows-events"
kind         = "event"

# Reactive state channel carrying the ordered window list. The server
# forwards every retained-value replacement as a
# `ServerEvent::PluginBusEvent` so the attach tab bar sees the exact
# order the plugin maintains — no polling, no round-trip per frame.
[[event_publications]]
delivery                     = "state"
forward_to_streaming_clients = true
kind                         = "bmux.windows/windows-list"

[[commands]]
aliases       = [["window", "new"]]
expose_in_cli = true
name          = "new-window"
path          = ["new-window"]
summary       = "Create a workspace window"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands.arguments]]
kind       = "string"
long       = "name"
name       = "name"
short      = "n"
value_name = "NAME"

[[commands]]
aliases       = [["window", "rename"]]
execution     = "caller_process"
expose_in_cli = true
name          = "rename-window"
path          = ["rename-window"]
summary       = "Rename the current workspace window"

[[commands.arguments]]
kind       = "string"
long       = "name"
name       = "name"
short      = "n"
value_name = "NAME"

[[commands]]
aliases       = [["window", "list"]]
expose_in_cli = true
name          = "list-windows"
path          = ["list-windows"]
summary       = "List workspace windows"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands.arguments]]
kind  = "boolean"
long  = "json"
name  = "json"
short = "j"

[[commands]]
aliases       = [["window", "kill"]]
expose_in_cli = true
name          = "kill-window"
path          = ["kill-window"]
summary       = "Kill a workspace window"

[[commands.arguments]]
kind       = "string"
name       = "target"
position   = 0
required   = true
value_name = "TARGET"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands.arguments]]
kind = "boolean"
long = "force-local"
name = "force-local"

[[commands]]
aliases       = [["window", "kill-all"]]
expose_in_cli = true
name          = "kill-all-windows"
path          = ["kill-all-windows"]
summary       = "Kill all workspace windows"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands.arguments]]
kind = "boolean"
long = "force-local"
name = "force-local"

[[commands]]
aliases       = [["window", "switch"]]
expose_in_cli = true
name          = "switch-window"
path          = ["switch-window"]
summary       = "Switch active workspace window"

[[commands.arguments]]
kind       = "string"
name       = "target"
position   = 0
required   = true
value_name = "TARGET"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands]]
aliases       = [["window", "move"]]
expose_in_cli = true
name          = "move-window"
path          = ["move-window"]
summary       = "Move a workspace window before or after another window"

[[commands.arguments]]
kind       = "string"
name       = "source"
position   = 0
required   = true
value_name = "SOURCE_CONTEXT_ID"

[[commands.arguments]]
kind       = "string"
name       = "target"
position   = 1
required   = true
value_name = "TARGET_CONTEXT_ID"

[[commands.arguments]]
kind       = "choice"
long       = "placement"
name       = "placement"
required   = true
value_name = "PLACEMENT"
values     = ["before", "after"]

[[commands]]
accepts_repeat = true
aliases        = [["window", "next"]]
expose_in_cli  = true
name           = "next-window"
path           = ["next-window"]
summary        = "Switch to the next workspace window"

[[commands]]
accepts_repeat = true
aliases        = [["window", "prev"]]
expose_in_cli  = true
name           = "prev-window"
path           = ["prev-window"]
summary        = "Switch to the previous workspace window"

[[commands]]
aliases       = [["window", "last"]]
expose_in_cli = true
name          = "last-window"
path          = ["last-window"]
summary       = "Switch to the previously active workspace window"

[[commands]]
aliases       = [["window", "goto"]]
expose_in_cli = true
name          = "goto-window"
path          = ["goto-window"]
summary       = "Switch to a workspace window by 1-based index"

[[commands.arguments]]
kind       = "string"
name       = "index"
position   = 0
required   = true
value_name = "INDEX"

[[commands]]
aliases       = [["window", "close-current"]]
expose_in_cli = true
name          = "close-current-window"
path          = ["close-current-window"]
summary       = "Close the current workspace window"

[[commands]]
aliases       = [["window", "reset-order"]]
expose_in_cli = true
name          = "reset-order"
path          = ["reset-order"]
summary       = "Reset the persisted window order and rebuild deterministically from current contexts"

# ── Pane-level commands ──────────────────────────────────────────────
# These commands were previously exposed only as typed-service
# handlers (not reachable by keybinding) and as hardcoded
# `RuntimeAction::*` variants in core. Exposing them as
# `[[commands]]` lets keybindings invoke them via
# `plugin:bmux.windows:<cmd>` and removes the need for core to carry
# domain-specific variants.

[[commands]]
accepts_repeat = true
expose_in_cli  = true
name           = "focus-pane-in-direction"
path           = ["focus-pane-in-direction"]
summary        = "Focus a pane in the given direction"

[[commands.arguments]]
kind       = "choice"
long       = "direction"
name       = "direction"
required   = true
value_name = "DIRECTION"
values     = ["next", "prev", "left", "right", "up", "down"]

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands]]
expose_in_cli = true
name          = "split-pane"
path          = ["split-pane"]
summary       = "Split the active pane"

[[commands.arguments]]
kind       = "choice"
long       = "direction"
name       = "direction"
required   = true
value_name = "DIRECTION"
values     = ["horizontal", "vertical"]

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands]]
accepts_repeat = true
expose_in_cli  = true
name           = "resize-pane"
path           = ["resize-pane"]
summary        = "Resize the active pane"

[[commands.arguments]]
kind       = "choice"
long       = "direction"
name       = "direction"
value_name = "DIRECTION"
values     = ["left", "right", "up", "down", "increase", "decrease"]

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands]]
expose_in_cli = true
name          = "zoom-pane"
path          = ["zoom-pane"]
summary       = "Toggle fullscreen zoom on the active pane"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands]]
expose_in_cli = true
name          = "list-floating-panes"
path          = ["list-floating-panes"]
summary       = "List floating panes"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands]]
expose_in_cli = true
name          = "create-floating-pane"
path          = ["create-floating-pane"]
summary       = "Create a new floating pane"

[[commands.arguments]]
kind       = "string"
long       = "program"
name       = "program"
value_name = "PROGRAM"

[[commands.arguments]]
kind       = "string"
long       = "scope"
name       = "scope"
value_name = "SCOPE"

[[commands.arguments]]
kind       = "string"
long       = "layer"
name       = "layer"
value_name = "LAYER"

[[commands.arguments]]
kind       = "string"
long       = "z"
name       = "z"
value_name = "Z"

[[commands.arguments]]
kind       = "string"
long       = "x"
name       = "x"
value_name = "X"

[[commands.arguments]]
kind       = "string"
long       = "y"
name       = "y"
