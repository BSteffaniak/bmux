[package]
authors     = { workspace = true }
categories  = ["command-line-utilities"]
description = "Plugin-owned native presentation CLI and managed hosting"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "presentation", "terminal"]
license     = { workspace = true }
name        = "bmux_presentation_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
bmux_client = { workspace = true }
bmux_config = { workspace = true }
bmux_image = { workspace = true }
bmux_keyboard = { workspace = true }
bmux_mermaid_render = { path = "../../packages/mermaid-render" }
bmux_plugin_sdk = { workspace = true }
bmux_presentation = { path = "../../packages/presentation" }
bmux_presentation_plugin_api = { path = "../presentation-plugin-api" }
bmux_presentation_runtime = { path = "../../packages/presentation-runtime" }
bmux_syntax_render = { path = "../../packages/syntax-render" }
bmux_tui = { workspace = true }
bmux_tui_runtime = { workspace = true, features = [
    "crossterm",
    "images",
    "all-protocols",
] }
crossterm = { workspace = true }
image = { workspace = true }
resvg = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "signal", "net"] }
uuid = { workspace = true, features = ["v4"] }

#[dev-dependencies]
bmux_cli_schema = { workspace = true }
bmux_plugin     = { workspace = true }
clap            = { workspace = true }

[features]
default          = []
fail-on-warnings = []
static-bundled   = []
