bundled_only      = "uses Tokio tasks and timers directly instead of plug-rt"
component_roles   = ["backend", "frontend"]
execution_class   = "native_fast"
id                = "bmux.theme"
name              = "bmux Theme"
owns_namespaces   = ["theme"]
provided_features = ["bmux.theme"]
version           = "0.0.1-alpha.0"

[[dependencies]]
plugin_id   = "bmux.decoration"
version_req = ">=0.0.1-alpha.0"

[[event_publications]]
delivery                     = "state"
forward_to_streaming_clients = false
kind                         = "bmux.runtime/appearance"

[[commands]]
accepts_repeat = false
execution      = "caller_process"
expose_in_cli  = false
name           = "pick-theme"
path           = ["theme", "pick"]
summary        = "Open the runtime theme picker"

[[commands]]
accepts_repeat = false
execution      = "caller_process"
expose_in_cli  = true
name           = "show-theme"
path           = ["theme", "show"]
summary        = "Show the theme in effect"

[[commands.arguments]]
kind       = "string"
long       = "note"
name       = "note"
value_name = "TEXT"

[[commands]]
accepts_repeat = false
execution      = "caller_process"
expose_in_cli  = true
name           = "refresh-theme"
path           = ["theme", "refresh"]
summary        = "Refresh the selected theme from configuration and files"
