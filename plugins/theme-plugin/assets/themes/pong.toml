# Pong theme - focused pane plays a tiny Pong match with the ball behind content.

background           = "#050510"
cursor               = "#ffffff"
foreground           = "#d8e8ff"
name                 = "pong"
selection_background = "#26324a"

[border]
active   = "#ffffff"
inactive = "#384052"

[status]
active_window  = "#ff5fd7"
background     = "#090a14"
foreground     = "#d8e8ff"
mode_indicator = "#5fffff"

[plugins."bmux.decoration"]

[plugins."bmux.decoration".unfocused]
bg            = ""
fg            = "#384052"
glyphs_custom = []
gradient_from = ""
gradient_to   = ""
style         = "rounded"

[plugins."bmux.decoration".focused]
bg            = ""
fg            = "#ffffff"
glyphs_custom = []
gradient_from = "#ff5fd7"
gradient_to   = "#5fffff"
style         = "thick"

[plugins."bmux.decoration".zoomed]
bg            = ""
fg            = "#ffd75f"
glyphs_custom = []
gradient_from = "#ffd75f"
gradient_to   = "#ff5f5f"
style         = "double"

[plugins."bmux.decoration".badges]
exited  = "◇"
running = "◆"

[plugins."bmux.decoration".animation]
hz   = 16
kind = "pong"

[settings.component_settings.pong]
components = ["pong.ball", "pong.paddles", "pong.score"]

[settings.providers.pong]
modal_id         = "pong-advanced-settings"
prompt_on_select = true
storage_key      = "theme_settings.pong"

[settings.forms.pong]
section_label = "Pong"
title         = "Pong Settings"
width_max     = 72
width_min     = 42

[[settings.forms.pong.fields]]
default = 5500
key     = "rally_ms"
label   = "Rally duration ms"
max     = 20000
min     = 1000
type    = "integer"

[[settings.forms.pong.fields]]
default = 3500
key     = "win_hold_ms"
label   = "Win screen hold ms"
max     = 15000
min     = 500
type    = "integer"

[[settings.forms.pong.fields]]
default = false
key     = "content_bounce"
label   = "Bounce off terminal content"
type    = "bool"

[plugins."bmux.decoration".components."pong.ball"]
below           = ["pane.content"]
entrypoint      = "ball"
script          = "pong"
script_instance = "pong"

[plugins."bmux.decoration".components."pong.ball".animation]
hz   = 16
kind = "pong"

[plugins."bmux.decoration".components."pong.ball".target]
kind = "focused-pane"

[plugins."bmux.decoration".components."pong.ball".settings]
content_bounce = "false"
rally_ms       = "5500"
win_hold_ms    = "3500"

[[plugins."bmux.decoration".components."pong.ball".visual_adapters]]
adapter    = "bmux.visual.presence-bitset"
area       = "content"
dirty_only = true
id         = "pong.content-presence"
max_bytes  = 16384
max_hz     = 30
scope      = "focused-pane"

[plugins."bmux.decoration".components."pong.ball".input]
keys            = ["up", "down", "esc"]
min_interval_ms = 16
mouse           = ["down", "drag", "up"]
scope           = "focused-pane"

[plugins."bmux.decoration".components."pong.paddles"]
above           = ["pane.content"]
entrypoint      = "paddles"
script          = "pong"
script_instance = "pong"

[plugins."bmux.decoration".components."pong.paddles".animation]
hz   = 16
kind = "pong"

[plugins."bmux.decoration".components."pong.paddles".target]
kind = "focused-pane"

[plugins."bmux.decoration".components."pong.paddles".settings]
content_bounce = "false"
rally_ms       = "5500"
win_hold_ms    = "3500"

[plugins."bmux.decoration".components."pong.paddles".input]
keys            = ["up", "down", "esc"]
min_interval_ms = 16
mouse           = ["down", "drag", "up"]
scope           = "focused-pane"

[plugins."bmux.decoration".components."pong.score"]
above           = ["pong.paddles"]
entrypoint      = "score"
script          = "pong"
script_instance = "pong"

[plugins."bmux.decoration".components."pong.score".animation]
hz   = 16
kind = "pong"

[plugins."bmux.decoration".components."pong.score".target]
kind = "focused-pane"

[plugins."bmux.decoration".components."pong.score".settings]
content_bounce = "false"
rally_ms       = "5500"
win_hold_ms    = "3500"

[plugins."bmux.decoration".components."pong.score".input]
keys            = ["up", "down", "esc"]
min_interval_ms = 16
mouse           = ["down", "drag", "up"]
scope           = "focused-pane"
