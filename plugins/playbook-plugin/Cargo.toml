[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Managed headless playbook execution plugin"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "playbook", "automation"]
license     = { workspace = true }
name        = "bmux_playbook_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
anyhow                    = { workspace = true, features = ["std"] }
bmux_playbook             = { workspace = true, features = ["runtime"] }
bmux_playbook_plugin_api  = { workspace = true }
bmux_plugin               = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk           = { workspace = true }
clap                      = { workspace = true, features = ["derive", "help", "std", "usage"] }
serde                     = { workspace = true, features = ["derive", "std"] }
serde_json                = { workspace = true }
tempfile                  = { workspace = true }
uuid                      = { workspace = true, features = ["v4", "std", "serde"] }

[features]
# Package this crate as a dynamic library for one component. Only the
# plugin packager enables these, together with `--cfg bmux_plugin_dylib`.
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = [
    "bmux_plugin/fail-on-warnings",
    "bmux_playbook/fail-on-warnings",
    "bmux_playbook_plugin_api/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
