component_roles = ["backend", "frontend"]
execution_class = "native_fast"
id = "bmux.playbook"
name = "bmux Playbook"
owns_namespaces = ["drive"]
owns_paths = [
    [
        "playbook",
        "cleanup",
    ],
    [
        "playbook",
        "run",
    ],
    [
        "playbook",
        "interactive",
    ],
    [
        "playbook",
        "validate",
    ],
    [
        "playbook",
        "dry-run",
    ],
    [
        "playbook",
        "diff",
    ],
]
provided_features = ["bmux.playbook"]
version = "0.0.1-alpha.0"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "validate"
path          = ["playbook", "validate"]
summary       = "Validate a playbook without executing it"

[[commands.arguments]]
kind       = "string"
name       = "source"
position   = 0
required   = true
summary    = "Path to playbook file, or `-` for stdin"
value_name = "SOURCE"

[[commands.arguments]]
kind    = "boolean"
long    = "json"
name    = "json"
summary = "Output results as JSON"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "dry-run"
path          = ["playbook", "dry-run"]
summary       = "Dry-run: parse, validate, and print the execution plan without running"

[[commands.arguments]]
kind       = "string"
name       = "source"
position   = 0
required   = true
summary    = "Path to playbook file, or `-` for stdin"
value_name = "SOURCE"

[[commands.arguments]]
kind    = "boolean"
long    = "json"
name    = "json"
summary = "Output as JSON"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "diff"
path          = ["playbook", "diff"]
summary       = "Compare results from two playbook runs"

[[commands.arguments]]
kind       = "string"
name       = "left"
position   = 0
required   = true
summary    = "Path to first (baseline/left) playbook result JSON"
value_name = "LEFT"

[[commands.arguments]]
kind       = "string"
name       = "right"
position   = 1
required   = true
summary    = "Path to second (new/right) playbook result JSON"
value_name = "RIGHT"

[[commands.arguments]]
kind    = "boolean"
long    = "json"
name    = "json"
summary = "Output diff as JSON"

[[commands.arguments]]
default_value = "50"
kind          = "string"
long          = "timing-threshold"
name          = "timing-threshold"
summary       = "Timing regression threshold in percent (default: 50)"
value_name    = "TIMING_THRESHOLD"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "interactive"
path          = ["playbook", "interactive"]
summary       = "Start an interactive playbook session with a socket for agent control"

[[commands.arguments]]
kind       = "string"
long       = "socket"
name       = "socket"
summary    = "Socket path override (default: auto-generated in sandbox temp dir)"
value_name = "SOCKET"

[[commands.arguments]]
kind    = "boolean"
long    = "record"
name    = "record"
summary = "Record the session"

[[commands.arguments]]
default_value = "80x24"
kind          = "string"
long          = "viewport"
name          = "viewport"
summary       = "Viewport dimensions as COLSxROWS (default: 80x24)"
value_name    = "VIEWPORT"

[[commands.arguments]]
kind       = "string"
long       = "shell"
name       = "shell"
summary    = "Shell override"
value_name = "SHELL"

[[commands.arguments]]
kind       = "string"
long       = "timeout"
name       = "timeout"
summary    = "Max session lifetime in seconds (default: no limit)"
value_name = "TIMEOUT"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "run"
path          = ["playbook", "run"]
summary       = "Run a playbook from a file or stdin"

[[commands.arguments]]
kind       = "string"
name       = "source"
position   = 0
required   = true
summary    = "Path to playbook file, or `-` for stdin"
value_name = "SOURCE"

[[commands.arguments]]
kind    = "boolean"
long    = "json"
name    = "json"
summary = "Output results as JSON"

[[commands.arguments]]
kind    = "boolean"
long    = "interactive"
name    = "interactive"
summary = "Run visual interactive live tour (TTY; non-TTY falls back to prompt controls)"

[[commands.arguments]]
choice_values = ["instant", "half", "normal", "double"]
default_value = "instant"
kind          = "choice"
long          = "playback-speed"
name          = "playback-speed"
summary       = "Deterministic presentation pacing; automation defaults to instant"
value_name    = "PLAYBACK_SPEED"

[[commands.arguments]]
kind    = "boolean"
long    = "target-server"
name    = "target-server"
summary = "Run against the live server instead of an ephemeral sandbox"

[[commands.arguments]]
kind    = "boolean"
long    = "record"
name    = "record"
summary = "Record the playbook execution (overrides playbook config)"

[[commands.arguments]]
kind       = "string"
long       = "export-gif"
name       = "export-gif"
summary    = "Export the recording as a GIF to the given path (implies --record)"
value_name = "EXPORT_GIF"

[[commands.arguments]]
kind       = "string"
long       = "viewport"
name       = "viewport"
summary    = "Override viewport dimensions as COLSxROWS (e.g. 120x40)"
value_name = "VIEWPORT"

[[commands.arguments]]
kind       = "string"
long       = "timeout"
name       = "timeout"
summary    = "Override max playbook timeout in seconds"
value_name = "TIMEOUT"

[[commands.arguments]]
kind       = "string"
long       = "shell"
name       = "shell"
summary    = "Override shell"
value_name = "SHELL"

[[commands.arguments]]
kind       = "string"
long       = "var"
multiple   = true
name       = "var"
summary    = "Define a variable (repeatable). Format: KEY=VALUE"
value_name = "VARS"

[[commands.arguments]]
kind    = "boolean"
long    = "verbose"
name    = "verbose"
short   = "v"
summary = "Print step-by-step progress to stderr"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "cleanup"
path          = ["playbook", "cleanup"]
summary       = "Clean up sandbox temp directories from previous playbook runs"
[[commands.arguments]]
kind    = "boolean"
long    = "dry-run"
name    = "dry-run"
summary = "Only list orphaned dirs without deleting"
[[commands.arguments]]
kind    = "boolean"
long    = "json"
name    = "json"
summary = "Output as JSON"

[[commands]]
description   = "Run a terminal program (TUI or CLI) in a private terminal and drive it with keys, text, mouse and resizes; every action waits until the program settles and reports the screen, styled cells, modes, exit status and terminal protocol problems. Run `bmux drive --help` or `bmux drive guide`."
execution     = "caller_process"
expose_in_cli = true
forward_help  = true
name          = "drive"
path          = ["drive"]
summary       = "Drive a terminal program with feedback after every action (for agents)"
[[commands.arguments]]
allow_hyphen_values = true
kind                = "string"
multiple            = true
name                = "args"
position            = 0
trailing_var_arg    = true

[cli_help]
"drive"                = { summary = "Drive a terminal program with feedback after every action (for agents)", order = 29 }
"playbook"             = { summary = "Headless playbook execution and testing", order = 28 }
"playbook cleanup"     = { order = 1 }
"playbook diff"        = { order = 2 }
"playbook dry-run"     = { order = 3 }
"playbook interactive" = { order = 1000 }
"playbook run"         = { order = 1001 }
"playbook validate"    = { order = 1002 }
