execution_class = "native_fast"
id = "bmux.clients"
name = "bmux Clients"
optional_capabilities = ["bmux.sessions.policy"]
owns_namespaces = []
provided_capabilities = ["bmux.clients.read", "bmux.clients.write"]
provided_features = ["bmux.clients"]
required_capabilities = [
    "bmux.contexts.read",
    "bmux.contexts.write",
    "bmux.sessions.write",
]
version = "0.0.1-alpha.0"

# clients-plugin's set-following handler dispatches to
# `contexts-commands::select-context` and
# `sessions-commands::reconcile-client-membership`, so those plugins
# must activate first.
[[dependencies]]
plugin_id   = "bmux.sessions"
version_req = ">=0.0.1-alpha.0"

[[dependencies]]
plugin_id   = "bmux.contexts"
version_req = ">=0.0.1-alpha.0"

[[services]]
capability   = "bmux.clients.read"
interface_id = "clients-identity/v1"
kind         = "query"

[[services]]
capability   = "bmux.clients.read"
interface_id = "clients-state"
kind         = "query"

[[services]]
capability   = "bmux.clients.write"
interface_id = "clients-commands"
kind         = "command"

[[services]]
capability   = "bmux.clients.read"
interface_id = "clients-events"
kind         = "event"

[[services]]
capability   = "bmux.clients.write"
interface_id = "clients-selection-commands-v1"
kind         = "command"

[[services]]
capability   = "bmux.clients.read"
interface_id = "clients-selection-state-v1"
kind         = "query"

[[event_publications]]
delivery                     = "broadcast"
forward_to_streaming_clients = true
kind                         = "bmux.clients/clients-events"
