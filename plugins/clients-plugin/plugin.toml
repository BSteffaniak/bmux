component_roles = ["backend"]
execution_class = "native_fast"
id = "bmux.clients"
name = "bmux Clients"
owns_namespaces = ["list-clients", "follow", "unfollow"]
owns_paths = [
    [
        "session",
        "clients",
    ],
    [
        "session",
        "follow",
    ],
    [
        "session",
        "unfollow",
    ],
]
provided_features = ["bmux.clients"]
version = "0.0.1-alpha.0"

# clients-plugin's set-following handler dispatches to
# `contexts-commands::select-context` and
# `sessions-commands::reconcile-client-membership`, so those plugins
# must activate first.
[[dependencies]]
plugin_id   = "bmux.sessions"
version_req = ">=0.0.1-alpha.0"

[[dependencies]]
plugin_id   = "bmux.contexts"
version_req = ">=0.0.1-alpha.0"

[[event_publications]]
delivery                     = "broadcast"
forward_to_streaming_clients = true
kind                         = "bmux.clients/clients-events"

# Explicit immutable v1 contracts. Route IDs are wire identities, not version
# syntax: retain legacy names and negotiate their major separately.

[[commands]]
aliases       = [["session", "clients"]]
expose_in_cli = true
name          = "list-clients"
path          = ["list-clients"]
summary       = "List connected clients"

[[commands.arguments]]
kind    = "boolean"
long    = "json"
name    = "json"
summary = "Print clients as JSON"

[[commands]]
aliases       = [["session", "follow"]]
expose_in_cli = true
name          = "follow"
path          = ["follow"]
summary       = "Follow another client's active target"

[[commands.arguments]]
kind       = "string"
name       = "target_client_id"
position   = 0
required   = true
summary    = "Target client UUID to follow"
value_name = "TARGET_CLIENT_ID"

[[commands.arguments]]
kind    = "boolean"
long    = "global"
name    = "global"
summary = "Keep following as the target switches tabs and sessions"

[[commands.arguments]]
kind       = "string"
long       = "client"
name       = "client"
summary    = "Attached client of yours that follows (default: your only attachment)"
value_name = "CLIENT_ID"

[[commands]]
aliases       = [["session", "unfollow"]]
expose_in_cli = true
name          = "unfollow"
path          = ["unfollow"]
summary       = "Stop following a client"

[[commands.arguments]]
kind       = "string"
long       = "client"
name       = "client"
summary    = "Attached client of yours that stops following (default: your only attachment)"
value_name = "CLIENT_ID"

[cli_help]
"follow"           = { order = 16 }
"list-clients"     = { order = 11 }
"session clients"  = { order = 2 }
"session follow"   = { order = 7 }
"session unfollow" = { order = 8 }
"unfollow"         = { order = 17 }
