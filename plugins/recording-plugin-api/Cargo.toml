[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Typed public API of the bmux recording plugin (BPDL-generated bindings + config)"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "api", "recording"]
license     = { workspace = true }
name        = "bmux_recording_plugin_api"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
anyhow                    = { workspace = true, features = ["std"] }
bmux_codec                = { workspace = true }
bmux_ipc                  = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk           = { workspace = true }
bmux_recording_protocol   = { workspace = true }
bmux_recording_runtime    = { workspace = true }
serde                     = { workspace = true, features = ["derive", "std"] }
serde_json                = { workspace = true, features = ["std"] }
tracing                   = { workspace = true, features = ["std"] }
uuid                      = { workspace = true, features = ["serde", "std", "v4"] }

[package.metadata.cargo-machete]
# These deps are consumed by code generated from the BPDL schema via the
# `bmux_plugin_schema_macros::schema!` proc macro; cargo-machete cannot see
# into proc-macro-generated source.
ignored = ["bmux_codec", "bmux_ipc", "bmux_plugin_sdk", "serde", "uuid"]

[features]
default          = []
fail-on-warnings = []
