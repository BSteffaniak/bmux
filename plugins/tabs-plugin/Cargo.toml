[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shipped tabs plugin for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "tabs"]
license     = { workspace = true }
name        = "bmux_tabs_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bmux_clients_plugin_api      = { workspace = true }
bmux_contexts_plugin_api     = { workspace = true }
bmux_ipc                     = { workspace = true }
bmux_pane_runtime_plugin_api = { workspace = true }
bmux_plugin                  = { workspace = true }
bmux_plugin_sdk              = { workspace = true }
bmux_sessions_plugin_api     = { workspace = true }
bmux_snapshot_runtime        = { workspace = true }
bmux_tabs_plugin_api         = { workspace = true }
bmux_workspaces_plugin_api   = { workspace = true }
serde                        = { workspace = true, features = ["derive", "std"] }
serde_json                   = { workspace = true }
tokio                        = { workspace = true, features = ["rt", "sync"] }
toml                         = { workspace = true }
uuid                         = { workspace = true, features = ["std"] }

[dev-dependencies]
bmux_attach_view_protocol = { workspace = true }
bmux_client               = { workspace = true }
bmux_contexts_plugin      = { workspace = true, features = ["static-bundled"] }
bmux_session_models       = { workspace = true }
bmux_tab_bar_plugin       = { workspace = true, features = ["static-bundled"] }

[features]
fail-on-warnings = [
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
static-bundled = []
