[keybindings.runtime]
# Tab lifecycle
',' = "plugin:bmux.tabs:rename-tab"
c   = "plugin:bmux.tabs:new-tab"
n   = "plugin:bmux.tabs:next-tab"
p   = "plugin:bmux.tabs:prev-tab"
w   = "plugin:bmux.tabs:last-tab"
# Pane focus (hjkl + arrows) — repeat-safe via accepts_repeat on focus-pane-in-direction
arrow_down  = "plugin:bmux.tabs:focus-pane-in-direction --direction down"
arrow_left  = "plugin:bmux.tabs:focus-pane-in-direction --direction left"
arrow_right = "plugin:bmux.tabs:focus-pane-in-direction --direction right"
arrow_up    = "plugin:bmux.tabs:focus-pane-in-direction --direction up"
h           = "plugin:bmux.tabs:focus-pane-in-direction --direction left"
j           = "plugin:bmux.tabs:focus-pane-in-direction --direction down"
k           = "plugin:bmux.tabs:focus-pane-in-direction --direction up"
l           = "plugin:bmux.tabs:focus-pane-in-direction --direction right"
o           = "plugin:bmux.tabs:focus-pane-in-direction --direction next"
# Pane split
'"' = "plugin:bmux.tabs:split-pane --direction horizontal"
"%" = "plugin:bmux.tabs:split-pane --direction vertical"
# Pane resize (repeat-safe)
"minus"             = "plugin:bmux.tabs:resize-pane --direction decrease"
"plus"              = "plugin:bmux.tabs:resize-pane --direction increase"
"shift+arrow_down"  = "plugin:bmux.tabs:resize-pane --direction down"
"shift+arrow_left"  = "plugin:bmux.tabs:resize-pane --direction left"
"shift+arrow_right" = "plugin:bmux.tabs:resize-pane --direction right"
"shift+arrow_up"    = "plugin:bmux.tabs:resize-pane --direction up"
"shift+h"           = "plugin:bmux.tabs:resize-pane --direction left"
"shift+j"           = "plugin:bmux.tabs:resize-pane --direction down"
"shift+k"           = "plugin:bmux.tabs:resize-pane --direction up"
"shift+l"           = "plugin:bmux.tabs:resize-pane --direction right"
# Pane zoom / close / restart
f         = "plugin:bmux.tabs:create-floating-pane"
r         = "plugin:bmux.tabs:restart-pane"
"shift+f" = "plugin:bmux.tabs:focus-next-floating-pane"
x         = "plugin:bmux.tabs:close-active-pane"
z         = "plugin:bmux.tabs:zoom-pane"
# Floating pane move/resize (repeat-safe while a floating pane is active)
"alt+h"       = "plugin:bmux.tabs:move-active-floating-pane --direction left"
"alt+j"       = "plugin:bmux.tabs:move-active-floating-pane --direction down"
"alt+k"       = "plugin:bmux.tabs:move-active-floating-pane --direction up"
"alt+l"       = "plugin:bmux.tabs:move-active-floating-pane --direction right"
"alt+shift+h" = "plugin:bmux.tabs:resize-active-floating-pane --direction left"
"alt+shift+j" = "plugin:bmux.tabs:resize-active-floating-pane --direction down"
"alt+shift+k" = "plugin:bmux.tabs:resize-active-floating-pane --direction up"
"alt+shift+l" = "plugin:bmux.tabs:resize-active-floating-pane --direction right"
