execution_class = "native_fast"
id = "bmux.tabs"
name = "bmux Tabs"
owns_namespaces = [
    "tab",
    "new-tab",
    "rename-tab",
    "rename-tab-by-id",
    "list-tabs",
    "kill-tab",
    "kill-all-tabs",
    "switch-tab",
    "move-tab",
    "next-tab",
    "prev-tab",
    "last-tab",
    "goto-tab",
    "close-current-tab",
    "reset-order",
    "focus-pane-in-direction",
    "split-pane",
    "resize-pane",
    "zoom-pane",
    "list-floating-panes",
    "create-floating-pane",
    "focus-floating-pane",
    "focus-next-floating-pane",
    "raise-floating-pane",
    "raise-active-floating-pane",
    "lower-floating-pane",
    "lower-active-floating-pane",
    "move-floating-pane",
    "resize-floating-pane",
    "move-active-floating-pane",
    "resize-active-floating-pane",
    "set-floating-pane-z",
    "set-floating-pane-layer",
    "close-floating-pane",
    "close-active-floating-pane",
    "close-active-pane",
    "restart-pane",
]
provided_capabilities = ["bmux.tabs.read", "bmux.tabs.write"]
provided_features = ["bmux.tabs"]
required_capabilities = [
    "bmux.commands",
    "bmux.contexts.read",
    "bmux.contexts.write",
    "bmux.clients.read",
    "bmux.pane_runtime.read",
    "bmux.pane_runtime.write",
    "bmux.panes.read",
    "bmux.panes.write",
    "bmux.sessions.read",
    "bmux.sessions.write",
    "bmux.workspaces.read",
    "bmux.workspaces.write",
    "bmux.storage",
]
version = "0.0.1-alpha.0"

[[services]]
capability   = "bmux.tabs.read"
interface_id = "tabs-catalog-v1"
kind         = "query"

[[services]]
capability   = "bmux.tabs.read"
interface_id = "tabs-state"
kind         = "query"

[[services]]
capability   = "bmux.tabs.write"
interface_id = "tabs-commands"
kind         = "command"

[[services]]
capability   = "bmux.tabs.read"
interface_id = "tabs-events"
kind         = "event"

# Reactive state channel carrying the ordered tab list. The server
# forwards every retained-value replacement as a
# `ServerEvent::PluginBusEvent` so the attach tab bar sees the exact
# order the plugin maintains — no polling, no round-trip per frame.
[[event_publications]]
delivery                     = "state"
forward_to_streaming_clients = true
kind                         = "bmux.tabs/tabs-list"

[[commands]]
aliases       = [["tab", "new"]]
expose_in_cli = true
name          = "new-tab"
path          = ["new-tab"]
summary       = "Create a workspace tab"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands.arguments]]
kind       = "string"
long       = "name"
name       = "name"
short      = "n"
value_name = "NAME"

[[commands]]
aliases       = [["tab", "rename"]]
execution     = "caller_process"
expose_in_cli = true
name          = "rename-tab"
path          = ["rename-tab"]
summary       = "Rename the current workspace tab"

[[commands.arguments]]
kind       = "string"
long       = "name"
name       = "name"
short      = "n"
value_name = "NAME"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "rename-tab-by-id"
path          = ["rename-tab-by-id"]
summary       = "Rename a specific workspace tab by id"

[[commands.arguments]]
kind       = "string"
long       = "id"
name       = "id"
value_name = "ID"

[[commands.arguments]]
kind       = "string"
long       = "name"
name       = "name"
short      = "n"
value_name = "NAME"

[[commands]]
aliases       = [["tab", "list"]]
expose_in_cli = true
name          = "list-tabs"
path          = ["list-tabs"]
summary       = "List workspace tabs"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands.arguments]]
kind  = "boolean"
long  = "json"
name  = "json"
short = "j"

[[commands]]
aliases       = [["tab", "kill"]]
expose_in_cli = true
name          = "kill-tab"
path          = ["kill-tab"]
summary       = "Kill a workspace tab"

[[commands.arguments]]
kind       = "string"
name       = "target"
position   = 0
required   = true
value_name = "TARGET"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands.arguments]]
kind = "boolean"
long = "force-local"
name = "force-local"

[[commands]]
aliases       = [["tab", "kill-all"]]
expose_in_cli = true
name          = "kill-all-tabs"
path          = ["kill-all-tabs"]
summary       = "Kill all workspace tabs"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands.arguments]]
kind = "boolean"
long = "force-local"
name = "force-local"

[[commands]]
aliases       = [["tab", "switch"]]
expose_in_cli = true
name          = "switch-tab"
path          = ["switch-tab"]
summary       = "Switch active workspace tab"

[[commands.arguments]]
kind       = "string"
name       = "target"
position   = 0
required   = true
value_name = "TARGET"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands]]
aliases       = [["tab", "move"]]
expose_in_cli = true
name          = "move-tab"
path          = ["move-tab"]
summary       = "Move a workspace tab before or after another tab"

[[commands.arguments]]
kind       = "string"
name       = "source"
position   = 0
required   = true
value_name = "SOURCE_CONTEXT_ID"

[[commands.arguments]]
kind       = "string"
name       = "target"
position   = 1
required   = true
value_name = "TARGET_CONTEXT_ID"

[[commands.arguments]]
kind       = "choice"
long       = "placement"
name       = "placement"
required   = true
value_name = "PLACEMENT"
