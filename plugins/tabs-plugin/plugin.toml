[[commands]]
accepts_repeat = true
aliases        = [["tab", "next"]]
expose_in_cli  = true
name           = "next-tab"
path           = ["next-tab"]
summary        = "Switch to the next workspace tab"

[[commands]]
accepts_repeat = true
aliases        = [["tab", "prev"]]
expose_in_cli  = true
name           = "prev-tab"
path           = ["prev-tab"]
summary        = "Switch to the previous workspace tab"

[[commands]]
aliases       = [["tab", "last"]]
expose_in_cli = true
name          = "last-tab"
path          = ["last-tab"]
summary       = "Switch to the previously active workspace tab"

[[commands]]
aliases       = [["tab", "goto"]]
expose_in_cli = true
name          = "goto-tab"
path          = ["goto-tab"]
summary       = "Switch to a workspace tab by 1-based index"

[[commands.arguments]]
kind       = "string"
name       = "index"
position   = 0
required   = true
value_name = "INDEX"

[[commands]]
aliases       = [["tab", "close-current"]]
expose_in_cli = true
name          = "close-current-tab"
path          = ["close-current-tab"]
summary       = "Close the current workspace tab"

[[commands]]
aliases       = [["tab", "reset-order"]]
expose_in_cli = true
name          = "reset-order"
path          = ["reset-order"]
summary       = "Reset the persisted tab order and rebuild deterministically from current contexts"

# ── Pane-level commands ──────────────────────────────────────────────
# These commands were previously exposed only as typed-service
# handlers (not reachable by keybinding) and as hardcoded
# `RuntimeAction::*` variants in core. Exposing them as
# `[[commands]]` lets keybindings invoke them via
# `plugin:bmux.tabs:<cmd>` and removes the need for core to carry
# domain-specific variants.

[[commands]]
accepts_repeat = true
expose_in_cli  = true
name           = "focus-pane-in-direction"
path           = ["focus-pane-in-direction"]
summary        = "Focus a pane in the given direction"

[[commands.arguments]]
kind       = "choice"
long       = "direction"
name       = "direction"
required   = true
value_name = "DIRECTION"
values     = ["next", "prev", "left", "right", "up", "down"]

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands]]
expose_in_cli = true
name          = "split-pane"
path          = ["split-pane"]
summary       = "Split the active pane"

[[commands.arguments]]
kind       = "choice"
long       = "direction"
name       = "direction"
required   = true
value_name = "DIRECTION"
values     = ["horizontal", "vertical"]

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands]]
