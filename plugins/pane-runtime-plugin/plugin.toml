bundled_only    = "uses block_in_place, Tokio tasks and timers directly instead of plug-rt"
component_roles = ["backend"]
execution_class = "native_fast"
id              = "bmux.pane_runtime"
name            = "bmux Pane Runtime"
# Policy is enforced when permissions is selected; absence preserves local
# single-user operation and must not prevent this provider from loading.
owns_namespaces   = ["pane-padding"]
provided_features = ["bmux.pane_runtime"]
version           = "0.0.1-alpha.0"

[native_abi]
minimum = "1.1"

[[dependencies]]
plugin_id   = "bmux.application_resurrection"
required    = false
version_req = ">=0.0.1-alpha.1"

[[dependencies]]
plugin_id   = "bmux.tabs"
required    = false
version_req = ">=0.0.1-alpha.0"

[[dependencies]]
plugin_id   = "bmux.sessions"
version_req = ">=0.0.1-alpha.0"

[[event_publications]]
delivery                     = "broadcast"
forward_to_streaming_clients = true
kind                         = "bmux.pane_runtime/pane-runtime-events"

[[commands]]
expose_in_cli = true
name          = "pane-padding-show"
path          = ["pane-padding", "show"]
summary       = "Show effective padding for a pane"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands.arguments]]
kind       = "string"
long       = "pane-id"
name       = "pane-id"
value_name = "UUID"

[[commands]]
expose_in_cli = true
name          = "pane-padding-set"
path          = ["pane-padding", "set"]
summary       = "Set a runtime padding override for a pane"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands.arguments]]
kind       = "string"
long       = "pane-id"
name       = "pane-id"
value_name = "UUID"

[[commands.arguments]]
kind = "integer"
long = "left"
name = "left"

[[commands.arguments]]
kind = "integer"
long = "right"
name = "right"

[[commands.arguments]]
kind = "integer"
long = "top"
name = "top"

[[commands.arguments]]
kind = "integer"
long = "bottom"
name = "bottom"

[[commands.arguments]]
kind = "integer"
long = "horizontal"
name = "horizontal"

[[commands.arguments]]
kind = "integer"
long = "vertical"
name = "vertical"

[[commands.arguments]]
kind = "integer"
long = "all"
name = "all"

[[commands.arguments]]
kind       = "string"
long       = "max-content-width"
name       = "max-content-width"
value_name = "CELLS|none"

[[commands.arguments]]
kind       = "string"
long       = "max-content-height"
name       = "max-content-height"
value_name = "CELLS|none"

[[commands.arguments]]
choice_values = ["left", "center", "right"]
kind          = "choice"
long          = "horizontal-alignment"
name          = "horizontal-alignment"

[[commands.arguments]]
choice_values = ["top", "center", "bottom"]
kind          = "choice"
long          = "vertical-alignment"
name          = "vertical-alignment"

[[commands]]
accepts_repeat = false
execution      = "caller_process"
expose_in_cli  = true
name           = "pane-padding-configure"
path           = ["pane-padding", "configure"]
summary        = "Open the live pane padding configurator"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands.arguments]]
kind       = "string"
long       = "pane-id"
name       = "pane-id"
value_name = "UUID"

[[commands]]
expose_in_cli = true
name          = "pane-padding-reset"
path          = ["pane-padding", "reset"]
summary       = "Reset a pane to declarative padding"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
short      = "s"
value_name = "SESSION"

[[commands.arguments]]
kind       = "string"
long       = "pane-id"
name       = "pane-id"
value_name = "UUID"

# pane-runtime-spawn-commands-v1 is modeled but deliberately not advertised:
# directory-aware creation must fail explicitly until the runtime declares
# safe spawn support (see PaneRuntimePlugin::declared_services).

# Explicit immutable v1 contracts. Route IDs are wire identities, not version
# syntax: retain legacy names and negotiate their major separately.
