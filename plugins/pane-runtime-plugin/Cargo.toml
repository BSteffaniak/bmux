[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shipped pane-runtime plugin for bmux (declares capabilities + typed services)"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "pane", "runtime"]
license     = { workspace = true }
name        = "bmux_pane_runtime_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true, features = ["std"] }
bmux_attach_image_protocol = { workspace = true }
bmux_attach_layout_protocol = { workspace = true }
bmux_attach_token_state = { workspace = true }
bmux_client_state = { workspace = true }
bmux_config = { workspace = true }
bmux_context_state = { workspace = true }
bmux_image = { workspace = true, optional = true }
bmux_ipc = { workspace = true }
bmux_pane_runtime_plugin_api = { workspace = true }
bmux_pane_runtime_state = { workspace = true }
bmux_permissions_plugin_api = { workspace = true }
bmux_plugin = { workspace = true }
bmux_plugin_sdk = { workspace = true }
bmux_recording_protocol = { workspace = true }
bmux_recording_runtime = { workspace = true }
bmux_session_models = { workspace = true }
bmux_session_state = { workspace = true }
bmux_sessions_plugin_api = { workspace = true }
bmux_snapshot_runtime = { workspace = true }
bmux_terminal_grid = { workspace = true }
bmux_terminal_protocol = { workspace = true }
portable-pty = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["serde", "std"] }

[features]
default = []
fail-on-warnings = [
    "bmux_attach_layout_protocol/fail-on-warnings",
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_permissions_plugin_api/fail-on-warnings",
    "bmux_sessions_plugin_api/fail-on-warnings",
]
image-registry = [
    "dep:bmux_image",
    "bmux_image/sixel",
    "bmux_image/kitty",
    "bmux_image/iterm2",
]
static-bundled = []

[dev-dependencies]
tempfile = { workspace = true }
