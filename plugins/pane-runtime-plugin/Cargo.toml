[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shipped pane-runtime plugin for bmux (declares capabilities + typed services)"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "pane", "runtime"]
license     = { workspace = true }
name        = "bmux_pane_runtime_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
anyhow = { workspace = true, features = ["std"] }
bmux_application_resurrection_plugin_api = { workspace = true }
bmux_attach_image_protocol = { workspace = true }
bmux_attach_layout_protocol = { workspace = true }
bmux_attach_token_state = { workspace = true }
bmux_bench = { workspace = true }
bmux_client = { workspace = true }
bmux_client_state = { workspace = true }
bmux_clients_plugin_api = { workspace = true }
bmux_config = { workspace = true }
bmux_context_state = { workspace = true }
bmux_image = { workspace = true, optional = true }
bmux_ipc = { workspace = true }
bmux_pane_runtime_plugin_api = { workspace = true }
bmux_pane_runtime_state = { workspace = true }
bmux_permissions_plugin_api = { workspace = true }
bmux_plugin = { workspace = true }
bmux_plugin_runtime = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk = { workspace = true }
bmux_presentation_state = { workspace = true }
bmux_pty = { workspace = true, features = ["native"] }
bmux_recording_protocol = { workspace = true }
bmux_recording_runtime = { workspace = true }
bmux_session_models = { workspace = true }
bmux_session_state = { workspace = true }
bmux_sessions_plugin_api = { workspace = true }
bmux_snapshot_runtime = { workspace = true }
bmux_tabs_plugin_api = { workspace = true }
bmux_terminal_grid = { workspace = true }
bmux_terminal_protocol = { workspace = true }
memchr = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["serde", "std"] }

[dev-dependencies]

[features]
# Package this crate as a dynamic library for one component. Only the
# plugin packager enables these, together with `--cfg bmux_plugin_dylib`.
default = []
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = [
    "bmux_attach_layout_protocol/fail-on-warnings",
    "bmux_clients_plugin_api/fail-on-warnings",
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_presentation_state/fail-on-warnings",
    "bmux_permissions_plugin_api/fail-on-warnings",
    "bmux_sessions_plugin_api/fail-on-warnings",
    "bmux_application_resurrection_plugin_api/fail-on-warnings",
    "bmux_attach_image_protocol/fail-on-warnings",
    "bmux_attach_token_state/fail-on-warnings",
    "bmux_client_state/fail-on-warnings",
    "bmux_config/fail-on-warnings",
    "bmux_context_state/fail-on-warnings",
    "bmux_image?/fail-on-warnings",
    "bmux_pane_runtime_plugin_api/fail-on-warnings",
    "bmux_pane_runtime_state/fail-on-warnings",
    "bmux_pty/fail-on-warnings",
    "bmux_recording_protocol/fail-on-warnings",
    "bmux_recording_runtime/fail-on-warnings",
    "bmux_session_models/fail-on-warnings",
    "bmux_session_state/fail-on-warnings",
    "bmux_snapshot_runtime/fail-on-warnings",
    "bmux_tabs_plugin_api/fail-on-warnings",
    "bmux_terminal_grid/fail-on-warnings",
    "bmux_terminal_protocol/fail-on-warnings",
]
image-registry = [
    "dep:bmux_image",
    "bmux_image/sixel",
    "bmux_image/kitty",
    "bmux_image/iterm2",
]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
