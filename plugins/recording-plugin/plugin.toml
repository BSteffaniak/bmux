execution_class = "native_fast"
id = "bmux.recording"
name = "bmux Recording"
owns_namespaces = ["recording"]
owns_paths = [["server", "recording"], ["playbook", "from-recording"]]
provided_capabilities = [
    "bmux.recording.read",
    "bmux.recording.write",
    "bmux.recording.process.v4",
]
provided_features = ["bmux.recording", "bmux.recording.process.v4"]
required_capabilities = ["bmux.pane_runtime.execution.v4"]
version = "0.0.1-alpha.0"

[[services]]
capability   = "bmux.recording.read"
interface_id = "recording-state"
kind         = "query"

[[services]]
capability   = "bmux.recording.write"
interface_id = "recording-commands"
kind         = "command"

[[services]]
capability   = "bmux.recording.process.v4"
interface_id = "recording-process-v4"
kind         = "command"

[[event_publications]]
delivery                     = "broadcast"
forward_to_streaming_clients = true
kind                         = "bmux.recording/recording-events"

# User-facing recording CLI commands. The recording plugin owns this namespace;
# command bodies can continue migrating behind this stable plugin-owned surface.

[[commands]]
