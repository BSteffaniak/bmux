[[commands]]
description = """Isolated recorded program start.

Flags and direct argv syntax:
  bmux recording process start [--profile functional|full|visual] [--viewport WxH] [--cwd DIR] [--env KEY=VALUE]... [--idempotency-key UUID] [--json] -- PROGRAM ARGS

Agent example:
  bmux recording process start --json --profile functional --viewport 80x24 -- /bin/echo hello

Security: the plugin creates a private dedicated server; never targets live BMUX. Input, environment and artifacts may contain secrets. Direct argv after -- is preserved literally; no implicit shell evaluation. Disconnect does not terminate work. Finish refuses running work without --terminate. --cleanup-server requires finalized capture; offline evidence remains readable. Reuse the same --idempotency-key to retry start/send; ambiguous outcomes refuse duplicate effects.

JSON: structured stdout only; diagnostics stderr. Exit 0 success, 1 failure, 124 wait timeout; run returns the child exit code (capped at 255). Durations accept milliseconds, 100ms or 10s. Read cursor is a raw-output byte offset; complete requires process output drain and capture queue visibility. Artifacts require a fresh output directory. GIF is canonical raw-event terminal-parser reconstruction, not polling or exact image protocol fidelity.
"""
expose_in_cli = true
name = "recording-process-start"
path = ["recording", "process", "start"]
summary = "Isolated recorded program start; use --help for flags, examples and security"

[[commands.arguments]]
allow_hyphen_values = true
kind                = "string"
multiple            = true
name                = "args"
position            = 0
trailing_var_arg    = true
value_name          = "ARGS"

