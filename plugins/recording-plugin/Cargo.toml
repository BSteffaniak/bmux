[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shipped recording plugin for bmux (typed recording lifecycle handlers)"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "recording"]
license     = { workspace = true }
name        = "bmux_recording_plugin"
publish     = false
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow                    = { workspace = true, features = ["std"] }
bmux_codec                = { workspace = true }
bmux_ipc                  = { workspace = true }
bmux_plugin               = { workspace = true }
bmux_plugin_sdk           = { workspace = true }
bmux_recording_plugin_api = { workspace = true }
bmux_recording_protocol   = { workspace = true }
bmux_recording_runtime    = { workspace = true }
serde                     = { workspace = true, features = ["derive", "std"] }
serde_json                = { workspace = true, features = ["std"] }
thiserror                 = { workspace = true }
tracing                   = { workspace = true, features = ["std"] }
uuid                      = { workspace = true, features = ["serde", "std", "v4"] }
vt100                     = { workspace = true }

[features]
fail-on-warnings = [
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
static-bundled = []
