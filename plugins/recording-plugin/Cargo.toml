[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shipped recording plugin for bmux (typed recording lifecycle handlers)"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "recording"]
license     = { workspace = true }
name        = "bmux_recording_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ab_glyph                     = { workspace = true }
anyhow                       = { workspace = true, features = ["std"] }
bmux_attach_pipeline         = { workspace = true }
bmux_client                  = { workspace = true }
bmux_codec                   = { workspace = true }
bmux_config                  = { workspace = true }
bmux_fonts                   = { workspace = true }
bmux_ipc                     = { workspace = true }
bmux_keyboard                = { workspace = true, features = ["crossterm"] }
bmux_pane_runtime_plugin_api = { workspace = true }
bmux_plugin                  = { workspace = true }
bmux_plugin_sdk              = { workspace = true }
bmux_recording_plugin_api    = { workspace = true }
bmux_recording_protocol      = { workspace = true }
bmux_recording_runtime       = { workspace = true }
bmux_terminal_grid           = { workspace = true }
crossterm                    = { workspace = true, features = ["events", "bracketed-paste"] }
font8x8                      = { workspace = true }
fontdb                       = { workspace = true }
gif                          = { workspace = true }
libc                         = { workspace = true }
resvg                        = { workspace = true }
serde                        = { workspace = true, features = ["derive", "std"] }
serde_json                   = { workspace = true, features = ["std"] }
sha2                         = { workspace = true }
thiserror                    = { workspace = true }
tokio                        = { workspace = true, features = ["rt", "time", "signal"] }
tracing                      = { workspace = true, features = ["std"] }
ttf-parser                   = { workspace = true }
uuid                         = { workspace = true, features = ["serde", "std", "v4"] }

[features]
bundled-fonts = ["bmux_fonts/bundled-fonts", "bmux_fonts/bundled-nerd-fonts"]
fail-on-warnings = [
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_attach_pipeline/fail-on-warnings",
    "bmux_client/fail-on-warnings",
    "bmux_codec/fail-on-warnings",
    "bmux_config/fail-on-warnings",
    "bmux_ipc/fail-on-warnings",
    "bmux_keyboard/fail-on-warnings",
    "bmux_pane_runtime_plugin_api/fail-on-warnings",
    "bmux_recording_plugin_api/fail-on-warnings",
    "bmux_recording_protocol/fail-on-warnings",
    "bmux_recording_runtime/fail-on-warnings",
    "bmux_terminal_grid/fail-on-warnings",
]
static-bundled = []
