[package]
authors     = { workspace = true }
categories  = ["command-line-utilities"]
description = "Plugin-owned native presentation CLI and managed hosting"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "presentation", "terminal"]
license     = { workspace = true }
name        = "bmux_presenter_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
bmux_client = { workspace = true }
bmux_config = { workspace = true }
bmux_image = { workspace = true }
bmux_keyboard = { workspace = true }
bmux_mermaid_render = { path = "../../packages/mermaid-render" }
bmux_playbook = { path = "../../packages/playbook" }
bmux_playbook_plugin_api = { path = "../playbook-plugin-api" }
bmux_plugin_sdk = { workspace = true }
bmux_presenter = { path = "../../packages/presenter" }
bmux_presenter_plugin_api = { path = "../presenter-plugin-api" }
bmux_presenter_runtime = { path = "../../packages/presenter-runtime" }
bmux_syntax_render = { path = "../../packages/syntax-render" }
bmux_tui = { workspace = true }
bmux_tui_runtime = { workspace = true, features = [
    "crossterm",
    "images",
    "all-protocols",
] }
bmux_web_host = { path = "../../packages/web-host", features = [
    "presentation",
] }
bmux_web_renderer = { path = "../../packages/web-renderer" }
crossterm = { workspace = true }
image = { workspace = true }
resvg = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "time",
    "sync",
    "signal",
    "net",
    "process",
    "io-util",
] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
bmux_cli_schema = { workspace = true }
bmux_plugin     = { workspace = true }
clap            = { workspace = true }

[features]
default          = []
fail-on-warnings = []
static-bundled   = []
