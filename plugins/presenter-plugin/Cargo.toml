[package]
authors     = { workspace = true }
categories  = ["command-line-utilities"]
description = "Plugin-owned native presentation CLI and managed hosting"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "presentation", "terminal"]
license     = { workspace = true }
name        = "bmux_presenter_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
anyhow = { workspace = true }
bmux_broadcast_plugin_api = { workspace = true }
bmux_client = { workspace = true }
bmux_config = { workspace = true }
bmux_fonts = { workspace = true, features = ["bundled-nerd-fonts"] }
bmux_image = { workspace = true }
bmux_keyboard = { workspace = true }
bmux_mermaid_render = { workspace = true }
bmux_playbook = { workspace = true }
bmux_playbook_plugin_api = { workspace = true }
bmux_plugin = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk = { workspace = true }
bmux_presenter = { workspace = true }
bmux_presenter_plugin_api = { workspace = true }
bmux_presenter_runtime = { workspace = true }
bmux_syntax_render = { workspace = true }
bmux_terminal = { workspace = true }
bmux_text_edit = { workspace = true, features = ["serde"] }
bmux_tui = { workspace = true }
bmux_tui_components = { workspace = true, features = [
    "button",
    "checkbox",
    "breadcrumbs",
    "radio-group",
    "select-dropdown",
    "selectable-list",
    "tab-bar",
    "tree-view",
    "table",
    "dialog",
    "bar-chart",
    "sparkline",
    "progress-bar",
    "badge",
    "toast-stack",
    "canvas",
    "chart",
    "source-viewer",
    "diff-viewer",
    "terminal-viewer",
    "scroll-view",
    "form",
    "text-input-box",
    "virtual-list",
] }
bmux_tui_runtime = { workspace = true, features = [
    "terminal-io",
    "images",
    "all-protocols",
] }
bmux_unicode_segmentation = { workspace = true }
bmux_web_host = { workspace = true, features = ["presentation"] }
bmux_web_renderer = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "bmp"] }
libc = { workspace = true }
resvg = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "time",
    "sync",
    "signal",
    "net",
    "process",
    "io-util",
] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# Paused-time capture tests must also compile outside workspace feature unification.
bmux_cli_schema = { workspace = true }
bmux_ipc        = { workspace = true }
clap            = { workspace = true }
tokio           = { workspace = true, features = ["test-util"] }
ttf-parser      = { workspace = true }

[features]
# Package this crate as a dynamic library for one component. Only the
# plugin packager enables these, together with `--cfg bmux_plugin_dylib`.
default = []
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = [
    "bmux_broadcast_plugin_api/fail-on-warnings",
    "bmux_client/fail-on-warnings",
    "bmux_config/fail-on-warnings",
    "bmux_image/fail-on-warnings",
    "bmux_keyboard/fail-on-warnings",
    "bmux_mermaid_render/fail-on-warnings",
    "bmux_playbook/fail-on-warnings",
    "bmux_playbook_plugin_api/fail-on-warnings",
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_presenter/fail-on-warnings",
    "bmux_presenter_plugin_api/fail-on-warnings",
    "bmux_presenter_runtime/fail-on-warnings",
    "bmux_syntax_render/fail-on-warnings",
    "bmux_text_edit/fail-on-warnings",
    "bmux_tui/fail-on-warnings",
    "bmux_tui_components/fail-on-warnings",
    "bmux_tui_runtime/fail-on-warnings",
    "bmux_web_host/fail-on-warnings",
    "bmux_web_renderer/fail-on-warnings",
]
