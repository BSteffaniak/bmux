[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shipped contexts plugin for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "contexts"]
license     = { workspace = true }
name        = "bmux_contexts_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_clients_plugin_api   = { workspace = true }
bmux_context_state        = { workspace = true }
bmux_contexts_plugin_api  = { workspace = true }
bmux_plugin               = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk           = { workspace = true }
bmux_session_models       = { workspace = true, features = ["serde"] }
bmux_sessions_plugin_api  = { workspace = true }
bmux_snapshot_runtime     = { workspace = true }
serde                     = { workspace = true, features = ["derive", "std"] }
serde_json                = { workspace = true }
tracing                   = { workspace = true, features = ["attributes"] }
uuid                      = { workspace = true, features = ["serde", "std"] }

[dev-dependencies]
bmux_ipc            = { workspace = true }
bmux_plugin_runtime = { workspace = true }
tokio               = { workspace = true, features = ["macros", "rt"] }

[features]
# Package this crate as a dynamic library for one component. Only the
# plugin packager enables these, together with `--cfg bmux_plugin_dylib`.
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = [
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_clients_plugin_api/fail-on-warnings",
    "bmux_context_state/fail-on-warnings",
    "bmux_contexts_plugin_api/fail-on-warnings",
    "bmux_session_models/fail-on-warnings",
    "bmux_sessions_plugin_api/fail-on-warnings",
    "bmux_snapshot_runtime/fail-on-warnings",
]
