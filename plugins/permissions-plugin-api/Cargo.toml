[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Typed public API of the bmux permissions plugin (BPDL-generated bindings)"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "api", "permissions"]
license     = { workspace = true }
name        = "bmux_permissions_plugin_api"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_ipc                  = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk           = { workspace = true }
serde                     = { workspace = true, features = ["derive", "std"] }
uuid                      = { workspace = true, features = ["serde", "std"] }

[package.metadata.cargo-machete]
# `serde` is consumed by code generated from the BPDL schema via the
# `bmux_plugin_schema_macros::schema!` proc macro; cargo-machete cannot
# see into proc-macro-generated source.
# `bmux_plugin_sdk` / `bmux_ipc` / `uuid` are referenced by generated code for
# typed identifier constants, generated transport clients, and UUID fields.
ignored = ["serde", "bmux_plugin_sdk", "bmux_ipc", "uuid"]

[features]
default = []
fail-on-warnings = [
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
