[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Named workspace metadata and switching for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "workspaces"]
license     = { workspace = true }
name        = "bmux_workspaces_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bmux_clients_plugin_api    = { workspace = true }
bmux_contexts_plugin_api   = { workspace = true }
bmux_plugin                = { workspace = true }
bmux_plugin_sdk            = { workspace = true }
bmux_workspaces_plugin_api = { workspace = true }
serde                      = { workspace = true, features = ["derive", "std"] }
serde_json                 = { workspace = true }
uuid                       = { workspace = true, features = ["serde", "std", "v4"] }

[features]
fail-on-warnings = [
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
static-bundled = []
