[package]
authors     = { workspace = true }
categories  = ["command-line-utilities"]
description = "Persistent plugin-owned output-only live broadcast publisher"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "broadcast", "terminal"]
license     = { workspace = true }
name        = "bmux_broadcast_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bmux_broadcast_plugin_api = { workspace = true }
bmux_client = { workspace = true }
bmux_config = { workspace = true }
bmux_keyboard = { workspace = true }
bmux_pane_runtime_plugin_api = { workspace = true }
bmux_plugin = { workspace = true }
bmux_plugin_sdk = { workspace = true }
bmux_presentation_state = { workspace = true }
bmux_sessions_plugin_api = { workspace = true }
bmux_text_edit = { workspace = true }
bmux_tui = { workspace = true }
bmux_tui_components = { workspace = true, features = [
    "selectable-list",
    "text-input",
    "key-hint-bar",
] }
bmux_tui_runtime = { workspace = true, features = ["crossterm"] }
bmux_web_renderer = { workspace = true }
crossterm = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
libc = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "io-util",
    "process",
] }
tokio-tungstenite = { workspace = true, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
bmux_codec = { workspace = true }

[features]
default = []
fail-on-warnings = [
    "bmux_broadcast_plugin_api/fail-on-warnings",
    "bmux_client/fail-on-warnings",
    "bmux_config/fail-on-warnings",
    "bmux_pane_runtime_plugin_api/fail-on-warnings",
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_presentation_state/fail-on-warnings",
    "bmux_sessions_plugin_api/fail-on-warnings",
    "bmux_web_renderer/fail-on-warnings",
]
static-bundled = []
