execution_class = "native_standard"
id = "bmux.connections"
name = "bmux Connections"
owns_namespaces = [
    "remote",
    "remote-enable",
    "remote-disable",
    "remote-pair-request",
    "remote-approve",
    "remote-pair",
    "remote-list",
    "remote-status",
    "remote-revoke",
    "remote-rename",
    "remote-forget",
]
owns_paths = [["connect"]]
provided_capabilities = [
    "bmux.connections.read",
    "bmux.connections.invoke",
    "bmux.connections.pairing",
]
provided_features = ["bmux.connections"]
required_capabilities = [
    "bmux.clients.read",
    "bmux.commands",
    "bmux.permissions.write",
]
version = "0.0.1-alpha.0"

[[services]]
capability   = "bmux.connections.read"
interface_id = "connections-state"
kind         = "query"

[[services]]
capability   = "bmux.connections.invoke"
interface_id = "connections-commands"
kind         = "command"

[[services]]
capability   = "bmux.connections.pairing"
interface_id = "pairing-commands"
kind         = "command"

[[services]]
capability   = "bmux.connections.pairing"
interface_id = "pairing-state"
kind         = "query"

[[services]]
capability   = "bmux.connections.pairing"
interface_id = "admission-provider-state"
kind         = "query"

[[services]]
capability   = "bmux.connections.pairing"
interface_id = "admission-provider-commands"
kind         = "command"

[[commands]]
aliases       = [["remote", "enable"]]
expose_in_cli = true
name          = "remote-enable"
path          = ["remote-enable"]
summary       = "Remote enable"

[[commands.arguments]]
kind     = "boolean"
long     = "yes"
name     = "yes"
required = false

[[commands]]
aliases       = [["remote", "disable"]]
expose_in_cli = true
name          = "remote-disable"
path          = ["remote-disable"]
summary       = "Remote disable"

[[commands]]
aliases       = [["remote", "pair-request"]]
expose_in_cli = true
name          = "remote-pair-request"
path          = ["remote-pair-request"]
summary       = "Remote pair-request"

[[commands]]
aliases       = [["remote", "approve"]]
expose_in_cli = true
name          = "remote-approve"
path          = ["remote-approve"]
summary       = "Remote approve"

[[commands.arguments]]
kind     = "string"
name     = "value"
position = 0
required = false

[[commands.arguments]]
kind     = "string"
long     = "name"
name     = "name"
required = false

[[commands.arguments]]
kind     = "string"
long     = "file"
name     = "file"
required = false

[[commands.arguments]]
kind     = "boolean"
long     = "stdin"
name     = "stdin"
required = false

[[commands.arguments]]
kind     = "boolean"
long     = "yes"
name     = "yes"
required = false

[[commands]]
aliases       = [["remote", "pair"]]
expose_in_cli = true
name          = "remote-pair"
path          = ["remote-pair"]
summary       = "Remote pair"

[[commands.arguments]]
kind     = "string"
name     = "value"
position = 0
required = false

[[commands.arguments]]
kind     = "string"
long     = "name"
name     = "name"
required = false

[[commands.arguments]]
kind     = "string"
long     = "file"
name     = "file"
required = false

[[commands.arguments]]
kind     = "boolean"
long     = "stdin"
name     = "stdin"
required = false

[[commands]]
aliases       = [["remote", "list"]]
expose_in_cli = true
name          = "remote-list"
path          = ["remote-list"]
summary       = "Remote list"

[[commands]]
aliases       = [["remote", "status"]]
expose_in_cli = true
name          = "remote-status"
path          = ["remote-status"]
summary       = "Remote status"

[[commands.arguments]]
kind     = "string"
name     = "value"
position = 0
required = false

[[commands]]
aliases       = [["remote", "revoke"]]
expose_in_cli = true
name          = "remote-revoke"
path          = ["remote-revoke"]
summary       = "Remote revoke"

[[commands.arguments]]
kind     = "string"
name     = "value"
position = 0
required = false

[[services]]
capability   = "bmux.connections.pairing"
interface_id = "pairing-session-commands"
kind         = "command"

[[services]]
capability   = "bmux.connections.pairing"
interface_id = "pairing-session-state"
kind         = "query"

[[commands]]
expose_in_cli = true
name          = "connect"
path          = ["connect"]
summary       = "Connect to a host, or pair this device interactively"

[[commands.arguments]]
kind     = "string"
name     = "target"
position = 0
required = false

[[commands.arguments]]
kind     = "string"
name     = "session"
position = 1
required = false

[[commands.arguments]]
kind     = "string"
long     = "follow"
name     = "follow"
required = false

[[commands.arguments]]
kind     = "boolean"
long     = "global"
name     = "global"
required = false

[[commands.arguments]]
kind     = "boolean"
long     = "reconnect-forever"
name     = "reconnect-forever"
required = false

[[commands.arguments]]
kind     = "boolean"
long     = "pair"
name     = "pair"
required = false

[[commands.arguments]]
kind     = "string"
long     = "name"
name     = "name"
required = false

[[commands.arguments]]
kind     = "string"
long     = "device-name"
name     = "device-name"
required = false

[[commands]]
aliases       = [["remote", "rename"]]
expose_in_cli = true
name          = "remote-rename"
path          = ["remote-rename"]
summary       = "Rename a saved host on this client only"

[[commands.arguments]]
kind     = "string"
name     = "old"
position = 0
required = true

[[commands.arguments]]
kind     = "string"
name     = "new"
position = 1
required = true

[[commands]]
aliases       = [["remote", "forget"]]
expose_in_cli = true
name          = "remote-forget"
path          = ["remote-forget"]
summary       = "Forget a saved host on this client; does not revoke host authorization"

[[commands.arguments]]
kind     = "string"
name     = "name"
position = 0
required = true
