bundled_only = "uses host sockets, child processes, block_in_place, Tokio tasks and timers directly instead of plug-rt"
component_roles = ["backend", "frontend"]
execution_class = "native_standard"
id = "bmux.connections"
name = "bmux Connections"
owns_namespaces = [
    "remote",
    "access",
    "kiosk",
    "auth",
    "remote-enable",
    "remote-disable",
    "remote-pair-request",
    "remote-approve",
    "remote-pair",
    "remote-list",
    "remote-status",
    "remote-revoke",
    "remote-rename",
    "remote-forget",
]
owns_paths = [
    [
        "connect",
    ],
    [
        "share",
    ],
    [
        "unshare",
    ],
    [
        "setup",
    ],
    [
        "host",
    ],
    [
        "hosts",
    ],
    [
        "join",
    ],
    [
        "auth",
    ],
]
provided_features = ["bmux.connections"]
version = "0.0.1-alpha.0"

[[commands]]
aliases       = [["remote", "enable"]]
expose_in_cli = true
