bundled_only = "uses Iroh (QUIC over host sockets; its endpoints spawn Tokio tasks) and Tokio tasks and timers directly instead of plug-rt"
component_roles = ["backend", "frontend"]
execution_class = "native_standard"
id = "bmux.connections"
name = "bmux Connections"
owns_namespaces = ["remote", "kiosk"]
owns_paths = [["connect"]]
provided_features = ["bmux.connections"]
version = "0.0.1-alpha.0"

[[commands]]
expose_in_cli = true
name          = "connect"
path          = ["connect"]
summary       = "Attach to a saved host, or pair this device with a host"

[[commands.arguments]]
kind       = "string"
name       = "host"
position   = 0
required   = false
summary    = "Saved host (see `bmux remote hosts`)"
value_name = "HOST"

[[commands.arguments]]
kind       = "string"
name       = "session"
position   = 1
required   = false
summary    = "Session to attach to"
value_name = "SESSION"

[[commands.arguments]]
kind     = "boolean"
long     = "pair"
name     = "pair"
required = false
summary  = "Pair with a host using the link from `bmux remote pair` (prompted, hidden)"

[[commands.arguments]]
kind       = "string"
long       = "name"
name       = "name"
required   = false
summary    = "Name to save the host as (with --pair)"
value_name = "ALIAS"

[[commands.arguments]]
kind       = "string"
long       = "device-name"
name       = "device-name"
required   = false
summary    = "Name this device shows to the host owner (with --pair)"
value_name = "NAME"

[[commands]]
expose_in_cli = true
name          = "remote-enable"
path          = ["remote", "enable"]
summary       = "Let paired devices reach this machine (host)"

[[commands.arguments]]
kind     = "boolean"
long     = "yes"
name     = "yes"
required = false
summary  = "Do not ask for confirmation"

[[commands]]
expose_in_cli = true
name          = "remote-disable"
path          = ["remote", "disable"]
summary       = "Stop remote access and close remote connections (host)"

[[commands]]
expose_in_cli = true
name          = "remote-pair"
path          = ["remote", "pair"]
summary       = "Print a one-time pairing link and approve a device (host)"

[[commands.arguments]]
choice_values = ["full", "view-only"]
kind          = "string"
long          = "role"
name          = "role"
required      = false
summary       = "Role the device gets (default full)"
value_name    = "ROLE"

[[commands.arguments]]
kind       = "string"
long       = "name"
name       = "name"
required   = false
summary    = "Name for the device (default: the name it sends)"
value_name = "NAME"

[[commands]]
expose_in_cli = true
name          = "remote-list"
path          = ["remote", "list"]
summary       = "List paired devices (host)"

[[commands]]
expose_in_cli = true
name          = "remote-revoke"
path          = ["remote", "revoke"]
summary       = "Revoke a paired device and close its connections (host)"

[[commands.arguments]]
kind       = "string"
name       = "device"
position   = 0
required   = true
summary    = "Device name, principal, or key prefix"
value_name = "DEVICE"

[[commands]]
expose_in_cli = true
name          = "remote-role"
path          = ["remote", "role"]
summary       = "Change a paired device's role (host)"

[[commands.arguments]]
kind       = "string"
name       = "device"
position   = 0
required   = true
summary    = "Device name, principal, or key prefix"
value_name = "DEVICE"

[[commands.arguments]]
choice_values = ["full", "view-only"]
kind          = "string"
name          = "role"
position      = 1
required      = true
summary       = "full or view-only"
value_name    = "ROLE"

[[commands]]
expose_in_cli = true
name          = "remote-status"
path          = ["remote", "status"]
summary       = "Show remote access, paired devices, live connections and saved hosts"

[[commands.arguments]]
kind     = "boolean"
long     = "json"
name     = "json"
required = false
summary  = "Print output as JSON"

[[commands]]
expose_in_cli = true
name          = "remote-log"
path          = ["remote", "log"]
summary       = "Show the remote access audit log: pairings, revocations, connections (host)"

[[commands.arguments]]
kind       = "integer"
long       = "limit"
name       = "limit"
required   = false
summary    = "Newest events to show (default 50, at most 1000)"
value_name = "N"

[[commands.arguments]]
kind     = "boolean"
long     = "json"
name     = "json"
required = false
summary  = "Print output as JSON"

[[commands]]
expose_in_cli = true
name          = "remote-doctor"
path          = ["remote", "doctor"]
summary       = "Diagnose the connection to a saved host step by step"

[[commands.arguments]]
kind       = "string"
name       = "host"
position   = 0
required   = true
summary    = "Saved host (see `bmux remote hosts`)"
value_name = "HOST"

[[commands.arguments]]
kind       = "integer"
long       = "timeout"
name       = "timeout"
required   = false
summary    = "Seconds to wait for the host (default 10)"
value_name = "SECS"

[[commands.arguments]]
kind     = "boolean"
long     = "json"
name     = "json"
required = false
summary  = "Print output as JSON"

[[commands]]
expose_in_cli = true
name          = "remote-hosts"
path          = ["remote", "hosts"]
summary       = "List hosts saved on this device"

[[commands]]
expose_in_cli = true
name          = "remote-rename"
path          = ["remote", "rename"]
summary       = "Rename a saved host on this device"

[[commands.arguments]]
kind       = "string"
name       = "old"
position   = 0
required   = true
value_name = "OLD"

[[commands.arguments]]
kind       = "string"
name       = "new"
position   = 1
required   = true
value_name = "NEW"

[[commands]]
expose_in_cli = true
name          = "remote-forget"
path          = ["remote", "forget"]
summary       = "Forget a saved host on this device (does not revoke it on the host)"

[[commands.arguments]]
kind       = "string"
name       = "host"
position   = 0
required   = true
value_name = "HOST"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "kiosk-status"
path          = ["kiosk", "status"]
summary       = "Show kiosk profile status and effective defaults"

[[commands.arguments]]
kind    = "boolean"
long    = "json"
name    = "json"
summary = "Print output as JSON"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "kiosk-init"
path          = ["kiosk", "init"]
summary       = "Initialize/update kiosk bootstrap files from config"

[[commands.arguments]]
conflicts_with = ["all-profiles"]
kind           = "string"
long           = "profile"
multiple       = true
name           = "profile"
summary        = "Kiosk profile to reconcile (repeatable)"
value_name     = "PROFILE"

[[commands.arguments]]
conflicts_with = ["profile"]
kind           = "boolean"
long           = "all-profiles"
name           = "all-profiles"
summary        = "Reconcile all configured profiles"

[[commands.arguments]]
kind    = "boolean"
long    = "dry-run"
name    = "dry-run"
summary = "Preview actions without writing files"

[[commands.arguments]]
kind    = "boolean"
long    = "yes"
name    = "yes"
summary = "Skip confirmation prompts"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "kiosk-issue-token"
path          = ["kiosk", "issue-token"]
summary       = "Issue a kiosk token scoped to a profile"

[[commands.arguments]]
kind       = "string"
name       = "profile"
position   = 0
required   = true
summary    = "Kiosk profile name"
value_name = "PROFILE"

[[commands.arguments]]
kind       = "string"
long       = "session"
name       = "session"
summary    = "Optional session override stored in token"
value_name = "SESSION"

[[commands.arguments]]
kind       = "integer"
long       = "ttl-secs"
name       = "ttl-secs"
summary    = "Optional token TTL in seconds (defaults to profile/default TTL)"
value_name = "TTL_SECS"

[[commands.arguments]]
conflicts_with = ["multi-use"]
kind           = "boolean"
long           = "one-shot"
name           = "one-shot"
summary        = "Mark token as one-shot (defaults to profile/default one_shot)"

[[commands.arguments]]
conflicts_with = ["one-shot"]
kind           = "boolean"
long           = "multi-use"
name           = "multi-use"
summary        = "Mark token as reusable until expiry"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "kiosk-revoke-token"
path          = ["kiosk", "revoke-token"]
summary       = "Revoke one issued kiosk token by id"

[[commands.arguments]]
kind       = "string"
name       = "token-id"
position   = 0
required   = true
summary    = "Token id to revoke"
value_name = "TOKEN_ID"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "kiosk-attach"
path          = ["kiosk", "attach"]
summary       = "Attach using a kiosk token (intended for forced SSH command)"

[[commands.arguments]]
kind       = "string"
name       = "profile"
position   = 0
required   = true
summary    = "Kiosk profile name"
value_name = "PROFILE"

[[commands.arguments]]
kind       = "string"
long       = "token"
name       = "token"
required   = true
summary    = "Raw kiosk token"
value_name = "TOKEN"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "kiosk-ssh-print-config"
path          = ["kiosk", "ssh-print-config"]
summary       = "Print generated sshd include text without writing files"

[[commands.arguments]]
conflicts_with = ["all-profiles"]
kind           = "string"
long           = "profile"
multiple       = true
name           = "profile"
summary        = "Kiosk profile to print (repeatable)"
value_name     = "PROFILE"

[[commands.arguments]]
conflicts_with = ["profile"]
kind           = "boolean"
long           = "all-profiles"
name           = "all-profiles"
summary        = "Print all configured profiles"

[cli_help]
"connect"                = { order = 126 }
"kiosk"                  = { summary = "SSH kiosk profiles and token management", order = 6 }
"kiosk attach"           = { order = 4 }
"kiosk init"             = { order = 1 }
"kiosk issue-token"      = { order = 2 }
"kiosk revoke-token"     = { order = 3 }
"kiosk ssh-print-config" = { order = 5 }
"kiosk status"           = { order = 0 }
"remote"                 = { summary = "Remote access: pairing, devices and saved hosts", order = 19 }
"remote disable"         = { order = 1 }
"remote doctor"          = { order = 12 }
"remote enable"          = { order = 0 }
"remote forget"          = { order = 10 }
"remote hosts"           = { order = 8 }
"remote list"            = { order = 3 }
"remote log"             = { order = 11 }
"remote pair"            = { order = 2 }
"remote rename"          = { order = 9 }
"remote revoke"          = { order = 5 }
"remote role"            = { order = 6 }
"remote status"          = { order = 7 }
