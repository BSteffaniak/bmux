[package]
authors     = { workspace = true }
categories  = ["network-programming", "development-tools"]
description = "Bundled remote access plugin for bmux: pairing, Iroh transport and saved hosts"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "connections", "remote", "iroh"]
license     = { workspace = true }
name        = "bmux_connections_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
anyhow = { workspace = true, features = ["std"] }
bmux_client = { workspace = true }
bmux_config = { workspace = true }
bmux_connections_admin = { workspace = true }
bmux_connections_plugin_api = { workspace = true }
bmux_ipc = { workspace = true }
bmux_permissions_plugin_api = { workspace = true }
bmux_plugin = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk = { workspace = true }
clap = { workspace = true, features = ["derive", "std", "help", "usage"] }
getrandom = { workspace = true }
iroh = { workspace = true }
libc = { workspace = true }
qrcode = { workspace = true }
redb = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["std", "v4"] }

[features]
# Package this crate as a dynamic library for one component. Only the
# plugin packager enables these, together with `--cfg bmux_plugin_dylib`.
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = [
    "bmux_client/fail-on-warnings",
    "bmux_config/fail-on-warnings",
    "bmux_connections_plugin_api/fail-on-warnings",
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["macros", "rt-multi-thread"] }
