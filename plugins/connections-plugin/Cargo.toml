[package]
authors     = { workspace = true }
categories  = ["network-programming", "development-tools"]
description = "Bundled endpoint resolution and remote typed-service plugin for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "connections", "ssh", "tls"]
license     = { workspace = true }
name        = "bmux_connections_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true, features = ["std"] }
bmux_attach_layout_protocol = { workspace = true }
bmux_client = { workspace = true }
bmux_clients_plugin_api = { workspace = true }
bmux_config = { workspace = true }
bmux_connections_plugin_api = { workspace = true }
bmux_ipc = { workspace = true, features = ["compression-zstd"] }
bmux_keyboard = { workspace = true }
bmux_pane_runtime_plugin_api = { workspace = true }
bmux_permissions_plugin_api = { workspace = true }
bmux_plugin = { workspace = true }
bmux_plugin_sdk = { workspace = true }
bmux_terminal_grid = { workspace = true }
iroh = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "time",
] }
tokio-rustls = { workspace = true }
toml = { workspace = true }
url = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["std", "v4"] }

[features]
fail-on-warnings = [
    "bmux_client/fail-on-warnings",
    "bmux_config/fail-on-warnings",
    "bmux_connections_plugin_api/fail-on-warnings",
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
static-bundled = []

[dev-dependencies]
bmux_pane_runtime_plugin = { workspace = true, features = ["static-bundled"] }
bmux_permissions_plugin  = { workspace = true, features = ["static-bundled"] }
bmux_server              = { workspace = true }
bmux_sessions_plugin     = { workspace = true, features = ["static-bundled"] }
tempfile                 = { workspace = true }
