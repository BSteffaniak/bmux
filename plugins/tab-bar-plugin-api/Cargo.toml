[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Typed public API of the bmux tab-bar plugin (BPDL-generated bindings)"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "api", "tab-bar"]
license     = { workspace = true }
name        = "bmux_tab_bar_plugin_api"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_ipc                   = { workspace = true }
bmux_plugin_schema_macros  = { workspace = true }
bmux_plugin_sdk            = { workspace = true }
bmux_workspaces_plugin_api = { workspace = true }
serde                      = { workspace = true, features = ["derive", "std"] }
uuid                       = { workspace = true, features = ["serde", "std"] }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.cargo-machete]
# These crates are referenced by BPDL-generated code (transport clients,
# typed identifiers, serde derives, and the imported
# `workspaces.workspace-summary` type), which cargo-machete cannot inspect
# through the schema proc macro.
ignored = ["serde", "bmux_plugin_sdk", "bmux_ipc", "bmux_workspaces_plugin_api"]

[features]
default = []
fail-on-warnings = [
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_workspaces_plugin_api/fail-on-warnings",
]
