[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shipped performance plugin for bmux (owns PerformanceCaptureSettings + rate limiter)"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "performance"]
license     = { workspace = true }
name        = "bmux_performance_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_pane_runtime_state     = { workspace = true }
bmux_performance_plugin_api = { workspace = true }
bmux_performance_state      = { workspace = true }
bmux_plugin                 = { workspace = true }
bmux_plugin_schema_macros   = { workspace = true }
bmux_plugin_sdk             = { workspace = true }
bmux_presentation_state     = { workspace = true }
serde                       = { workspace = true, features = ["derive", "std"] }
serde_json                  = { workspace = true }
sysinfo                     = { workspace = true }
tracing                     = { workspace = true }
uuid                        = { workspace = true, features = ["std"] }

[features]
# Package this crate as a dynamic library for one component. Only the
# plugin packager enables these, together with `--cfg bmux_plugin_dylib`.
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = [
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_presentation_state/fail-on-warnings",
    "bmux_pane_runtime_state/fail-on-warnings",
    "bmux_performance_plugin_api/fail-on-warnings",
    "bmux_performance_state/fail-on-warnings",
]
