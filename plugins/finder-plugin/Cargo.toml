[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Cross-workspace tab finder for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "finder"]
license     = { workspace = true }
name        = "bmux_finder_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bmux_plugin                = { workspace = true }
bmux_plugin_sdk            = { workspace = true }
bmux_windows_plugin_api    = { workspace = true }
bmux_workspaces_plugin_api = { workspace = true }
tokio                      = { workspace = true }
toml                       = { workspace = true }
tracing                    = { workspace = true }
uuid                       = { workspace = true, features = ["std"] }

[features]
fail-on-warnings = ["bmux_plugin_sdk/fail-on-warnings"]
static-bundled   = []
