bundled_only    = "uses Tokio tasks and timers directly instead of plug-rt"
component_roles = ["frontend"]
execution_class = "native_fast"
id              = "bmux.finder"
name            = "bmux Finder"
owns_namespaces = ["finder"]
version         = "0.0.1-alpha.0"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "show"
path          = ["finder", "show"]
summary       = "Search tabs across workspaces"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "add-to-view"
path          = ["finder", "add-to-view"]
summary       = "Add a tab from any workspace to this attachment's tab view"

[[commands]]
execution     = "caller_process"
expose_in_cli = true
name          = "views"
path          = ["finder", "views"]
summary       = "Switch this attachment to another of your tab views, or create one"

[keybindings.runtime]
"shift+f" = "plugin:bmux.finder:show"
"shift+v" = "plugin:bmux.finder:views"
