[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shipped permissions plugin for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "permissions", "plugin"]
license     = { workspace = true }
name        = "bmux_permissions_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bmux_clients_plugin_api      = { workspace = true }
bmux_contexts_plugin_api     = { workspace = true }
bmux_ipc                     = { workspace = true }
bmux_pane_runtime_plugin_api = { workspace = true }
bmux_permissions_plugin_api  = { workspace = true }
bmux_plugin                  = { workspace = true }
bmux_plugin_sdk              = { workspace = true }
bmux_sessions_plugin_api     = { workspace = true }
serde                        = { workspace = true, features = ["derive", "std"] }
serde_json                   = { workspace = true }
uuid                         = { workspace = true, features = ["std"] }

[features]
fail-on-warnings = [
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_permissions_plugin_api/fail-on-warnings",
    "bmux_pane_runtime_plugin_api/fail-on-warnings",
]
static-bundled = []
