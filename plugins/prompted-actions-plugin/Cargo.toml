[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shipped prompted-actions plugin for bmux — config-driven prompted action sequences"
edition     = { workspace = true }
keywords    = ["bmux", "prompt", "plugin"]
license     = { workspace = true }
name        = "bmux_prompted_actions_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_plugin               = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk           = { workspace = true }
serde                     = { workspace = true, features = ["derive", "std"] }
tokio                     = { workspace = true }
toml                      = { workspace = true, features = ["parse"] }
tracing                   = { workspace = true }

[dev-dependencies]
bmux_plugin_runtime = { workspace = true }

[features]
# Package this crate as a dynamic library for one component. Only the
# plugin packager enables these, together with `--cfg bmux_plugin_dylib`.
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = [
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_plugin/fail-on-warnings",
]
