[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Application resurrection host adapter"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "resurrection"]
license     = { workspace = true }
name        = "bmux_application_resurrection_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_application_resurrection_plugin_api = { workspace = true }
bmux_plugin_schema_macros                = { workspace = true }
bmux_plugin_sdk                          = { workspace = true }
libc                                     = { workspace = true }
serde                                    = { workspace = true, features = ["derive", "std"] }
serde_json                               = { workspace = true }
tempfile                                 = { workspace = true }
tracing                                  = { workspace = true }
uuid                                     = { workspace = true, features = ["serde", "v4"] }

[features]
# Package this crate as a dynamic library for one component. Only the
# plugin packager enables these, together with `--cfg bmux_plugin_dylib`.
default = []
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = [
    "bmux_application_resurrection_plugin_api/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
