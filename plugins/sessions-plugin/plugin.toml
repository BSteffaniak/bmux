execution_class = "native_fast"
id = "bmux.sessions"
name = "bmux Sessions"
optional_capabilities = ["bmux.pane_runtime.spawn.v1"]
owns_namespaces = ["new-session"]
provided_capabilities = [
    "bmux.sessions.read",
    "bmux.sessions.write",
    "bmux.sessions.spawn.v1",
]
provided_features = ["bmux.sessions"]
required_capabilities = [
    "bmux.attach_runtime.write",
    "bmux.clients.read",
    "bmux.contexts.write",
    "bmux.pane_runtime.write",
]
version = "0.0.1-alpha.0"

[[services]]
capability   = "bmux.sessions.read"
interface_id = "sessions-state"
kind         = "query"

[[services]]
capability   = "bmux.sessions.write"
interface_id = "sessions-commands"
kind         = "command"

[[services]]
capability   = "bmux.sessions.read"
interface_id = "sessions-events"
kind         = "event"

[[services]]
capability   = "bmux.sessions.spawn.v1"
interface_id = "sessions-spawn-v1"
kind         = "command"

[[event_publications]]
delivery                     = "broadcast"
forward_to_streaming_clients = true
kind                         = "bmux.sessions/sessions-events"

# CLI / keybinding surface. Each of these maps to the corresponding
# typed service handler (`new-session`, etc.) so attach keybindings
# and shell CLIs can invoke sessions-plugin behavior via
# `plugin:bmux.sessions:<cmd>`.
[[commands]]
expose_in_cli = true
name          = "new-session"
path          = ["new-session"]
summary       = "Create a new session"

[[commands.arguments]]
kind       = "string"
long       = "name"
name       = "name"
short      = "n"
value_name = "NAME"
