[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Typed public API of the bmux cluster plugin (BPDL-generated bindings)"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "api", "cluster", "federation"]
license     = { workspace = true }
name        = "bmux_cluster_plugin_api"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_ipc                  = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk           = { workspace = true }
serde                     = { workspace = true, features = ["derive", "std"] }
uuid                      = { workspace = true, features = ["serde", "std"] }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.cargo-machete]
# These dependencies are referenced by BPDL-generated code, which
# cargo-machete cannot inspect through the schema proc macro.
ignored = ["bmux_ipc", "bmux_plugin_sdk", "serde", "uuid"]

[features]
default = []
fail-on-warnings = [
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
