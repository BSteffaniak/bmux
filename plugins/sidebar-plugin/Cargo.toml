[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Bundled vertical tab presentation plugin for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "sidebar"]
license     = { workspace = true }
name        = "bmux_sidebar_plugin"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_cell_geometry        = { workspace = true }
bmux_plugin               = { workspace = true, features = ["tui"] }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk           = { workspace = true }
bmux_presentation_scene   = { workspace = true }
bmux_presentation_state   = { workspace = true }
bmux_tabs_plugin_api      = { workspace = true }
bmux_tui                  = { workspace = true }
bmux_tui_components       = { workspace = true, features = ["scroll-view", "virtual-list"] }
bmux_unicode_segmentation = { workspace = true }
tokio                     = { workspace = true, features = ["rt", "sync", "time"] }
toml                      = { workspace = true }
tracing                   = { workspace = true }
uuid                      = { workspace = true, features = ["std"] }

[features]
# Package this crate as a dynamic library for one component. Only the
# plugin packager enables these, together with `--cfg bmux_plugin_dylib`.
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = [
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_presentation_scene/fail-on-warnings",
    "bmux_presentation_state/fail-on-warnings",
    "bmux_tabs_plugin_api/fail-on-warnings",
    "bmux_tui/fail-on-warnings",
    "bmux_tui_components/fail-on-warnings",
]
