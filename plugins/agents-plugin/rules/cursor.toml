aliases            = ["cursor-agent"]
id                 = "cursor"
min_engine_version = 1
updated_at         = "2026-11-24T00:00:00Z"
version            = "2026.11.24.1"

[[rules]]
any = [
    { contains = [
        "reject & propose changes",
    ] },
    { contains = [
        "esc or n or p",
    ] },
    { contains = [
        "add write(",
    ] },
]
contains = ["write to this file?", "proceed (y)"]
id = "write_file_approval"
priority = 320
region = "bottom_non_empty_lines(8)"
state = "blocked"
visible_blocker = true

[[rules]]
any = [
    { contains = [
        "waiting for approval",
        "run this command?",
    ], any = [
        { contains = [
            "run (once) (y)",
        ] },
        { contains = [
            "skip (esc or n)",
        ] },
    ] },
    { contains = [
        "(y) (enter)",
    ] },
    { line_regex = [
        '(?i)^\s*allow .*\(y\)',
    ] },
    { contains = [
        "keep (n)",
    ] },
    { contains = [
        "skip (esc or n)",
    ] },
    { line_regex = [
        '(?i)^\s*(?:→\s*)?run .*\(y\)',
    ] },
]
id = "approval_prompt"
priority = 300
region = "whole_recent"
state = "blocked"
visible_blocker = true

[[rules]]
contains        = ["ctrl+c to stop"]
id              = "stop_hint_working"
priority        = 100
region          = "bottom_non_empty_lines(6)"
state           = "working"
visible_working = true

[[rules]]
background_working = true
id                 = "background_task_status_working"
# bmux: only a status row counts, with the count as its own segment (at the
# start, after a glyph, or after a `·`/`|` separator) and nothing but
# "running"/"active" after it, so prose like "kicked off 2 background tasks"
# near the prompt is not background work.
line_regex = [
    '(?i)^\s*(?:.*\s[·•|]\s+|[^\p{Alphabetic}\p{N}\s]+\s+)?[1-9][0-9]*\s+background\s+tasks?(?:\s+(?:running|active|in\s+progress))?\s*(?:[·•|]\s.*)?$',
]
priority = 95
region = "bottom_non_empty_lines(5)"
state = "working"
visible_working = true

[[rules]]
id              = "spinner_working"
line_regex      = ['^\s*(⬡|⬢|[\u2800-\u28FF]+)\s+\p{Alphabetic}+\w*ing\b']
priority        = 90
region          = "bottom_non_empty_lines(8)"
state           = "working"
visible_working = true
