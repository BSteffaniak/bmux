aliases            = ["claude-code"]
id                 = "claude"
min_engine_version = 2
updated_at         = "2026-10-11T00:00:00Z"
version            = "2026.10.11.1"

[[rules]]
id              = "osc_title_working"
priority        = 1100
region          = "osc_title"
state           = "working"
visible_working = true
# Braille covers <= 2.1.227; half-circles are the 2.1.228 busy spinner.
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] ']

[[rules]]
any = [
    { line_regex = [
        '^\s*[⏸⏵].*esc to interrupt(?:\s|·|$)',
    ] },
    { line_regex = [
        '^\s*[\x{002A}\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}]\s+\S.*…(?:\s+\(\d+[smh](?:\s|·)|\s*$)',
    ] },
]
id = "live_turn_working"
priority = 970
region = "bottom_non_empty_lines(12)"
state = "working"
visible_working = true

[[rules]]
background_working = true
id = "background_agents_working"
line_regex = [
    '^\s*[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}]\s+Waiting for [1-9]\d* background agents? to finish\s*$',
]
priority = 965
region = "last_non_empty_above_prompt_box"
state = "working"
visible_working = true

[[rules]]
background_working = true
id                 = "background_mcp_task_working"
priority           = 965
region             = "bottom_non_empty_lines(12)"
state              = "working"
visible_working    = true
# Claude renders activity summaries at column zero; wrapped continuations are indented.
# Keeping that shape prevents user prompt text from impersonating this signal.
not = [
    { contains = [
        "do you want to proceed?",
    ] },
    { contains = [
        "esc to cancel",
    ] },
    { contains = [
        "waiting for permission",
    ] },
    { contains = [
        "do you want to allow this connection?",
    ] },
    { contains = [
        "tab to amend",
    ] },
    { contains = [
        "ctrl+e to explain",
    ] },
]
regex = [
    '(?m)^[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}][ \t]+\S[^\n]*?(?:\n[ \t]+[^\n]*?){0,3}·(?:[ \t]+|\n[ \t]*)[1-9]\d*(?:[ \t]+|\n[ \t]*)MCP(?:[ \t]+|\n[ \t]*)tasks?(?:[ \t]+|\n[ \t]*)still(?:[ \t]+|\n[ \t]*)running[ \t]*$',
]

[[rules]]
id              = "btw_overlay_working"
line_regex      = ['^\s*/btw(?:\s|$)', '(?i)esc to close\s*$']
priority        = 975
region          = "bottom_non_empty_lines(5)"
state           = "working"
visible_working = true

[[rules]]
any = [
    { contains = [
        "ctrl+o",
        "to toggle",
    ] },
    { contains = [
        "ctrl+e",
        "show all",
    ] },
    { contains = [
        "ctrl+e",
        "collapse",
    ] },
    { contains = [
        "↑↓ scroll",
    ] },
    { contains = [
        "? for shortcuts",
    ] },
]
contains = ["showing detailed transcript"]
id = "transcript_viewer"
priority = 1000
region = "bottom_non_empty_lines(3)"
skip_state_update = true
state = "unknown"

[[rules]]
any = [
    { contains = [
        "enter to confirm",
    ] },
    { contains = [
        "enter to select",
    ], any = [
        { contains = [
            "tab/arrow keys to navigate",
        ] },
        { contains = [
            "arrow keys to navigate",
        ] },
        { contains = [
            "arrows to navigate",
        ] },
        { contains = [
            "↑/↓ to navigate",
        ] },
        { contains = [
            "↑↓ to navigate",
        ] },
    ] },
]
contains = ["esc to cancel"]
id = "live_blocked_form"
priority = 980
region = "after_last_horizontal_rule"
state = "blocked"
visible_blocker = true

[[rules]]
id              = "live_blocked_form_named_session"
priority        = 980
region          = "whole_recent"
state           = "blocked"
visible_blocker = true

# Bind every control to the same footer, allowing wrapping between words.
# After the name divider, accept only a counted task panel with marked rows
# and optional pending overflow. Free-form activity can be newer output (#4573).
regex = [
    '(?i)(?:^|\n)[ \t]*enter\s+to\s+(?:confirm|select\s+·\s+(?:(?:tab/arrow|arrow)\s+keys|arrows|↑/↓|↑↓)\s+to\s+navigate)\s+·\s+esc\s+to\s+cancel[ \t]*\n(?:[ \t]*\n)*[ \t]*─{3,}[^\n]*(?:\n(?:[ \t]*\n)*[ \t]+\d+ tasks? \(\d+ done, (?:\d+ in progress, )?\d+ open\)(?:\n[ \t]+[◻◼✔][ \t]+[^\n]+)+(?:\n[ \t]+…[ \t]+\+\d+[ \t]+pending)?)?(?:\n[ \t]*)*\z',
]

[[rules]]
contains        = ["run a dynamic workflow?", "esc to cancel"]
id              = "dynamic_workflow_prompt"
priority        = 980
region          = "whole_recent"
state           = "blocked"
visible_blocker = true

[[rules]]
id              = "mcp_elicitation_prompt"
priority        = 980
region          = "whole_recent"
state           = "blocked"
visible_blocker = true
# MCP elicitation dialogs (elicitation/create) show Accept/Decline controls
# with an "Esc to cancel" footer but no Enter hint, so live_blocked_form
# cannot see them (issue #3283). Gate on the invariant header line, the
# Accept/Decline control line, and the cancel footer.
all = [
    { any = [
        { line_regex = [
            '^\s*\x{276F}?\s*Accept\b',
        ] },
        { line_regex = [
            '^\s*\x{276F}?\s*Decline\b',
        ] },
    ] },
]
contains = ["esc to cancel"]
line_regex = [
    '(?i)^\s*MCP server ["\x{201C}].+["\x{201D}] requests your input\s*$',
]

[[rules]]
id = "live_prompt_box"
line_regex = ['^\s*❯']
not = [
    { contains = [
        "enter to select",
    ] },
    { contains = [
        "esc to cancel",
    ] },
    { contains = [
        "tab/arrow keys",
    ] },
    { contains = [
        "arrow keys to navigate",
    ] },
    { contains = [
        "↑/↓ to navigate",
    ] },
]
priority = 950
region = "prompt_box_body"
state = "idle"
visible_idle = true

[[rules]]
contains = ["select model", "enter to set as default", "esc to cancel"]
id = "model_picker_menu"
not = [
    { contains = [
        "do you want to proceed?",
    ] },
    { contains = [
        "enter to select",
    ] },
]
priority = 900
region = "whole_recent"
skip_state_update = true
state = "unknown"

[[rules]]
any = [
    { contains = [
        "bash command",
    ] },
    { contains = [
        "bash(",
    ] },
    { contains = [
        "contains expansion",
    ] },
    { contains = [
        "tab to amend",
    ] },
    { contains = [
        "ctrl+e to explain",
    ] },
]
contains = ["do you want to proceed?"]
id = "bash_permission_prompt"
priority = 850
region = "whole_recent"
state = "blocked"
visible_blocker = true
# Claude marks the selected option with "❯", so every option branch has to allow
# that prefix. Numbered branches that omit it only match options the cursor has
# moved away from, which left the resting layout below unmatched here (#2650):
#   ❯ 1. Yes / 2. Yes, and don't ask again for: <cmd> / 3. No
# Cover both the two-option and "don't ask again" three-option shapes so this
# rule, not the narrower generic_permission_prompt, claims Bash approvals.
all = [
    { any = [
        { line_regex = [
            '(?i)^\s*❯?\s*yes\b',
        ] },
        { line_regex = [
            '(?i)^\s*❯?\s*1\.\s*yes\b',
        ] },
        { line_regex = [
            '(?i)^\s*❯?\s*2\.\s*yes\b',
        ] },
        { line_regex = [
            '(?i)^\s*❯?\s*2\.\s*no\b',
        ] },
        { line_regex = [
            '(?i)^\s*❯?\s*3\.\s*no\b',
        ] },
    ] },
]

[[rules]]
all = [
    { any = [
        { line_regex = [
            '(?i)^\s*❯?\s*1\.\s*yes\b',
        ] },
        { line_regex = [
            '(?i)^\s*2\.\s*yes\b',
        ] },
        { line_regex = [
            '(?i)^\s*2\.\s*no\b',
        ] },
        { line_regex = [
            '(?i)^\s*3\.\s*no\b',
        ] },
    ] },
]
contains = ["do you want to proceed?", "esc to cancel"]
id = "generic_permission_prompt"
priority = 840
region = "after_last_horizontal_rule"
state = "blocked"
visible_blocker = true

[[rules]]
any = [
    { contains = [
        "do you want to",
    ], any = [
        { contains = [
            "yes",
        ] },
        { contains = [
            "❯",
        ] },
    ] },
    { contains = [
        "would you like to",
    ], any = [
        { contains = [
            "yes",
        ] },
        { contains = [
            "❯",
        ] },
    ] },
    { contains = [
        "waiting for permission",
    ] },
    { contains = [
        "do you want to allow this connection?",
    ] },
    { contains = [
        "tab to amend",
    ] },
    { contains = [
        "ctrl+e to explain",
    ] },
    { contains = [
        "do you want to proceed?",
        "esc to cancel",
    ] },
    { contains = [
        "review your answers",
    ] },
    { contains = [
        "skip interview and plan immediately",
    ] },
]
id = "legacy_no_prompt_blocker"
not = [{ regex = ['(?m)^\s*❯\s*$'] }]
priority = 300
region = "whole_recent"
state = "blocked"

[[rules]]
id           = "osc_title_idle"
priority     = 250
regex        = ['^\x{2733} ']
region       = "osc_title"
state        = "idle"
visible_idle = true

[[rules]]
id       = "osc_progress_idle"
priority = 250
regex    = ['^4;0']
region   = "osc_progress"
state    = "idle"
