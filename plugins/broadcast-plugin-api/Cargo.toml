[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Typed output-only live broadcast contracts"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "broadcast", "api"]
license     = { workspace = true }
name        = "bmux_broadcast_plugin_api"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
anyhow                    = { workspace = true }
bmux_codec                = { workspace = true }
bmux_ipc                  = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk           = { workspace = true }
serde                     = { workspace = true, features = ["derive"] }
serde_json                = { workspace = true }

[package.metadata.cargo-machete]
# BPDL-generated transport references these dependencies.
ignored = [
    "anyhow",
    "bmux_codec",
    "bmux_ipc",
    "bmux_plugin_sdk",
    "serde",
    "serde_json",
]

[features]
default = []
fail-on-warnings = [
    "bmux_codec/fail-on-warnings",
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
