[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shipped server clusters plugin for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "cluster"]
license     = { workspace = true }
name        = "bmux_cluster_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow                       = { workspace = true, features = ["std"] }
bmux_clients_plugin_api      = { workspace = true }
bmux_cluster_plugin_api      = { workspace = true }
bmux_config                  = { workspace = true }
bmux_connections_plugin_api  = { workspace = true }
bmux_pane_runtime_plugin_api = { workspace = true }
bmux_plugin                  = { workspace = true }
bmux_plugin_sdk              = { workspace = true }
bmux_sessions_plugin_api     = { workspace = true }
serde                        = { workspace = true, features = ["derive", "std"] }
serde_json                   = { workspace = true }
tokio                        = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
toml                         = { workspace = true }
tracing                      = { workspace = true, features = ["std"] }
uuid                         = { workspace = true, features = ["std"] }

[features]
fail-on-warnings = [
    "bmux_cluster_plugin_api/fail-on-warnings",
    "bmux_connections_plugin_api/fail-on-warnings",
    "bmux_config/fail-on-warnings",
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
static-bundled = []

[dev-dependencies]
serial_test = { workspace = true }
tempfile    = { workspace = true }
uuid        = { workspace = true }
