execution_class = "native_fast"
id = "bmux.cluster"
name = "bmux Server Clusters"
owns_namespaces = [
    "cluster",
    "cluster-init",
    "cluster-enrollment-token-create",
    "cluster-enrollment-list",
    "cluster-enrollment-revoke",
    "cluster-credential-rotate",
    "cluster-member-revoke",
    "cluster-join",
    "cluster-leave",
    "cluster-members",
    "cluster-up",
    "cluster-status",
    "cluster-doctor",
    "cluster-hosts",
    "cluster-events",
    "cluster-pane-new",
    "cluster-pane-move",
    "cluster-pane-retry",
    "cluster-gateway-status",
    "cluster-gateway-explain",
    "cluster-gateway-doctor",
    "cluster-gateway-history",
    "cluster-gateway-history-export",
    "cluster-gateway-history-clear",
    "cluster-gateway-why",
    "cluster-gateway-reset",
]
provided_capabilities = [
    "bmux.server_clusters.read",
    "bmux.server_clusters.write",
    "bmux.server_clusters.auth",
]
provided_features = ["bmux.server_clusters"]
required_capabilities = [
    "bmux.attach_runtime.write",
    "bmux.clients.read",
    "bmux.commands",
    "bmux.connections.invoke",
    "bmux.contexts.read",
    "bmux.contexts.write",
    "bmux.pane_runtime.read",
    "bmux.pane_runtime.write",
    "bmux.panes.write",
    "bmux.sessions.read",
    "bmux.sessions.write",
    "bmux.storage",
]
version = "0.0.1-alpha.0"

[[services]]
capability   = "bmux.server_clusters.read"
interface_id = "cluster-query/v1"
