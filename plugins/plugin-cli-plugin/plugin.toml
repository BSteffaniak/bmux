component_roles = ["frontend"]
execution_class = "native_fast"
id = "bmux.plugin_cli"
name = "bmux Plugin CLI"
owns_namespaces = ["plugin"]
owns_paths = [
    [
        "diagnostics",
        "watch",
    ],
    [
        "diagnostics",
        "view",
    ],
    [
        "logs",
        "path",
    ],
    [
        "logs",
        "level",
    ],
    [
        "logs",
        "tail",
    ],
    [
        "logs",
        "watch",
    ],
    [
        "logs",
        "profiles",
        "list",
    ],
    [
        "logs",
        "profiles",
        "show",
    ],
    [
        "logs",
        "profiles",
        "delete",
    ],
    [
        "logs",
        "profiles",
        "rename",
    ],
    [
        "keymap",
        "doctor",
    ],
    [
        "terminal",
        "doctor",
    ],
    [
        "terminal",
        "install-terminfo",
    ],
]
version = "0.0.1-alpha.0"

[[commands]]
expose_in_cli = true
name          = "list"
path          = ["plugin", "list"]
summary       = "List discovered plugins"

[[commands.arguments]]
kind  = "boolean"
long  = "json"
name  = "json"
short = "j"

[[commands.arguments]]
kind    = "boolean"
long    = "compact"
name    = "compact"
summary = "Print one concise line per plugin"

[[commands.arguments]]
kind    = "boolean"
long    = "enabled-only"
name    = "enabled-only"
summary = "List only enabled plugins"

[[commands.arguments]]
kind    = "string"
long    = "capability"
name    = "capability"
summary = "Filter by required or provided capability"

[[commands]]
expose_in_cli = true
name          = "run"
path          = ["plugin", "run"]
summary       = "Run a declared plugin command"

[[commands.arguments]]
kind       = "string"
name       = "plugin"
position   = 0
required   = true
value_name = "PLUGIN"

[[commands.arguments]]
kind       = "string"
name       = "command"
position   = 1
required   = true
value_name = "COMMAND"

[[commands.arguments]]
allow_hyphen_values = true
kind                = "string"
multiple            = true
name                = "args"
position            = 2
trailing_var_arg    = true
value_name          = "ARGS"

[[commands]]
expose_in_cli = true
name          = "rebuild"
path          = ["plugin", "rebuild"]
summary       = "Rebuild bundled plugin crates"

[[commands.arguments]]
kind = "boolean"
long = "release"
name = "release"

[[commands.arguments]]
kind = "boolean"
long = "list"
name = "list"

[[commands.arguments]]
kind = "boolean"
long = "json"
name = "json"

[[commands.arguments]]
kind = "boolean"
long = "changed"
name = "changed"

[[commands.arguments]]
kind = "boolean"
long = "merge-base"
name = "merge-base"

[[commands.arguments]]
kind = "boolean"
long = "dry-run"
name = "dry-run"

[[commands.arguments]]
kind = "boolean"
long = "against-master"
name = "against-master"

[[commands.arguments]]
kind       = "string"
long       = "base"
name       = "base"
value_name = "REF"

[[commands.arguments]]
kind = "boolean"
long = "all-workspace-plugins"
name = "all-workspace-plugins"

[[commands.arguments]]
allow_hyphen_values = true
kind                = "string"
multiple            = true
name                = "selectors"
position            = 0
value_name          = "SELECTOR"

[[commands]]
expose_in_cli = true
name          = "doctor"
path          = ["plugin", "doctor"]
summary       = "Validate plugin configuration and readiness"

[[commands.arguments]]
kind  = "boolean"
long  = "json"
name  = "json"
short = "j"

[[commands.arguments]]
kind = "boolean"
long = "strict"
name = "strict"

[[commands.arguments]]
kind    = "boolean"
long    = "summary-only"
name    = "summary-only"
summary = "Print the summary without individual findings"

[[commands.arguments]]
kind    = "string"
long    = "severity"
name    = "severity"
summary = "Filter findings by error, warning, or info"

[[commands.arguments]]
kind    = "string"
long    = "code"
name    = "code"
summary = "Filter findings by diagnostic code substring"

[[commands]]
expose_in_cli = true
name          = "logs-path"
path          = ["logs", "path"]
summary       = "Print effective log file path"

[[commands.arguments]]
kind    = "boolean"
long    = "json"
name    = "json"
summary = "Print output as JSON"

[[commands]]
expose_in_cli = true
name          = "logs-level"
path          = ["logs", "level"]
summary       = "Core logs level command proxy"

[[commands.arguments]]
kind    = "boolean"
long    = "json"
name    = "json"
summary = "Print output as JSON"

[[commands]]
expose_in_cli = true
name          = "logs-tail"
path          = ["logs", "tail"]
summary       = "Print recent log lines and optionally follow updates"

[[commands.arguments]]
default_value = "50"
kind          = "string"
long          = "lines"
name          = "lines"
summary       = "Number of recent lines to show before follow"
value_name    = "LINES"

[[commands.arguments]]
kind       = "string"
long       = "since"
name       = "since"
summary    = "Show entries newer than a relative duration (e.g. 30s, 10m, 2h, 1d)"
value_name = "SINCE"

[[commands.arguments]]
kind    = "boolean"
long    = "no-follow"
name    = "no-follow"
summary = "Print recent lines only (disable follow)"

[[commands]]
expose_in_cli = true
name          = "logs-watch"
path          = ["logs", "watch"]
summary       = "Interactive live log viewer with dynamic filters"

[[commands.arguments]]
kind       = "string"
long       = "lines"
name       = "lines"
summary    = "Number of recent lines to preload (defaults to saved profile value or 200)"
value_name = "LINES"

[[commands.arguments]]
kind       = "string"
long       = "since"
name       = "since"
summary    = "Show entries newer than a relative duration (e.g. 30s, 10m, 2h, 1d)"
value_name = "SINCE"

[[commands.arguments]]
kind       = "string"
long       = "profile"
name       = "profile"
summary    = "State profile for saved watch filters (default: global `default`)"
value_name = "PROFILE"

[[commands.arguments]]
kind       = "string"
long       = "include"
multiple   = true
name       = "include"
summary    = "Include regex filter (case-sensitive, repeatable)"
value_name = "INCLUDE"

[[commands.arguments]]
kind       = "string"
long       = "include-i"
multiple   = true
name       = "include-i"
summary    = "Include regex filter (case-insensitive, repeatable)"
value_name = "INCLUDE_I"

[[commands.arguments]]
kind       = "string"
long       = "exclude"
multiple   = true
name       = "exclude"
summary    = "Exclude regex filter (case-sensitive, repeatable)"
value_name = "EXCLUDE"

[[commands.arguments]]
kind       = "string"
long       = "exclude-i"
multiple   = true
name       = "exclude-i"
summary    = "Exclude regex filter (case-insensitive, repeatable)"
value_name = "EXCLUDE_I"

[[commands]]
expose_in_cli = true
name          = "logs-profiles-list"
path          = ["logs", "profiles", "list"]
summary       = "List saved watch profiles"

[[commands.arguments]]
kind    = "boolean"
long    = "json"
name    = "json"
summary = "Print output as JSON"

[[commands]]
expose_in_cli = true
name          = "logs-profiles-show"
path          = ["logs", "profiles", "show"]
summary       = "Show details for one profile"

[[commands.arguments]]
kind       = "string"
name       = "profile"
position   = 0
summary    = "Profile name (default: global profile `default`)"
value_name = "PROFILE"

[[commands.arguments]]
kind    = "boolean"
long    = "json"
name    = "json"
summary = "Print output as JSON"

[[commands]]
expose_in_cli = true
name          = "logs-profiles-delete"
path          = ["logs", "profiles", "delete"]
summary       = "Delete a saved profile"

[[commands.arguments]]
kind       = "string"
name       = "profile"
position   = 0
required   = true
summary    = "Profile name to delete"
value_name = "PROFILE"

[[commands]]
expose_in_cli = true
name          = "logs-profiles-rename"
path          = ["logs", "profiles", "rename"]
summary       = "Rename a saved profile"

[[commands.arguments]]
kind       = "string"
name       = "from"
position   = 0
required   = true
summary    = "Existing profile name"
value_name = "FROM"

[[commands.arguments]]
kind       = "string"
name       = "to"
position   = 1
required   = true
summary    = "New profile name"
value_name = "TO"

[[commands]]
expose_in_cli = true
name          = "keymap-doctor"
path          = ["keymap", "doctor"]
summary       = "Core keymap doctor command proxy"

[[commands.arguments]]
allow_hyphen_values = true
kind                = "string"
multiple            = true
name                = "args"
position            = 0
trailing_var_arg    = true
value_name          = "ARGS"

[[commands]]
expose_in_cli = true
name          = "terminal-doctor"
path          = ["terminal", "doctor"]
summary       = "Core terminal doctor command proxy"

[[commands.arguments]]
allow_hyphen_values = true
kind                = "string"
multiple            = true
name                = "args"
position            = 0
trailing_var_arg    = true
value_name          = "ARGS"

[[commands]]
expose_in_cli = true
name          = "terminal-install-terminfo"
path          = ["terminal", "install-terminfo"]
summary       = "Core terminal install-terminfo command proxy"

[[commands.arguments]]
allow_hyphen_values = true
kind                = "string"
multiple            = true
name                = "args"
position            = 0
trailing_var_arg    = true
value_name          = "ARGS"


[[commands]]
aliases       = [["diagnostics", "view"]]
expose_in_cli = true
name          = "diagnostics-watch"
path          = ["diagnostics", "watch"]
summary       = "Interactive structured diagnostics event viewer with dynamic filters"

[[commands.arguments]]
kind       = "string"
long       = "lines"
name       = "lines"
summary    = "Number of recent events to preload (defaults to saved profile value or 200)"
value_name = "LINES"

[[commands.arguments]]
kind       = "string"
long       = "since"
name       = "since"
summary    = "Show entries newer than a relative duration (e.g. 30s, 10m, 2h, 1d)"
value_name = "SINCE"

[[commands.arguments]]
kind       = "string"
long       = "profile"
name       = "profile"
summary    = "State profile for saved watch filters (default: global `default`)"
value_name = "PROFILE"

[[commands.arguments]]
kind       = "string"
long       = "include"
multiple   = true
name       = "include"
summary    = "Include regex filter (case-sensitive, repeatable)"
value_name = "INCLUDE"

[[commands.arguments]]
kind       = "string"
long       = "include-i"
multiple   = true
name       = "include-i"
summary    = "Include regex filter (case-insensitive, repeatable)"
value_name = "INCLUDE_I"

[[commands.arguments]]
kind       = "string"
long       = "exclude"
multiple   = true
name       = "exclude"
summary    = "Exclude regex filter (case-sensitive, repeatable)"
value_name = "EXCLUDE"

[[commands.arguments]]
kind       = "string"
long       = "exclude-i"
multiple   = true
name       = "exclude-i"
summary    = "Exclude regex filter (case-insensitive, repeatable)"
value_name = "EXCLUDE_I"

[cli_help]
"diagnostics"               = { summary = "Structured diagnostics event viewer", order = 22 }
"diagnostics view"          = { summary = "Alias for watch", order = 1 }
"diagnostics watch"         = { order = 0 }
"keymap doctor"             = { order = 1 }
"logs level"                = { order = 1000 }
"logs path"                 = { order = 1001 }
"logs profiles"             = { summary = "Manage saved log watch profiles", order = 0 }
"logs profiles delete"      = { order = 0 }
"logs profiles list"        = { order = 1000 }
"logs profiles rename"      = { order = 1001 }
"logs profiles show"        = { order = 1002 }
"logs tail"                 = { order = 1002 }
"logs watch"                = { order = 1003 }
"terminal doctor"           = { order = 0 }
"terminal install-terminfo" = { order = 1000 }
