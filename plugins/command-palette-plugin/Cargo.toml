[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shipped command palette plugin for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "command-palette", "plugin"]
license     = { workspace = true }
name        = "bmux_command_palette_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bmux_keybind    = { workspace = true }
bmux_plugin     = { workspace = true }
bmux_plugin_sdk = { workspace = true }
tokio           = { workspace = true }
tracing         = { workspace = true }

[features]
fail-on-warnings = [
    "bmux_keybind/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
static-bundled = []
