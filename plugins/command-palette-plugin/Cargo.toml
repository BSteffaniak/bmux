[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shipped command palette plugin for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "command-palette", "plugin"]
license     = { workspace = true }
name        = "bmux_command_palette_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_keybind              = { workspace = true }
bmux_plugin               = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk           = { workspace = true }
tokio                     = { workspace = true }
tracing                   = { workspace = true }

[dev-dependencies]
bmux_plugin_runtime = { workspace = true }

[features]
# Package this crate as a dynamic library for one component. Only the
# plugin packager enables these, together with `--cfg bmux_plugin_dylib`.
dynamic-backend = []
dynamic-frontend = []
fail-on-warnings = [
    "bmux_keybind/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_plugin/fail-on-warnings",
]
