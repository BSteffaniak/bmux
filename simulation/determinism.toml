# What `cargo sim NAME --check` (switchy_cargo) holds every simulation to, beyond its own rules.
# Each crate a simulation links says what of it runs in simulations in its manifest's
# [package.metadata.switchy.simulation]; see AGENTS.md.

# Forbidden in every crate a simulation runs, on top of switchy_cargo's list.
forbid = [
    # This process's executable goes through the pane runtime's platform layer.
    "bmux_plugin::retain_executable",
    "bmux_plugin::executable_sha256",
]

# Every crate the simulations link from a registry or git repository, as with `cargo vet`: a
# crate (or version) not covered here fails the check until it is audited.
#
# Verdicts: `controlled` (the simulators), `pure` (deterministic in itself), `restricted` (its
# non-deterministic entry points are forbidden by the rules; the reason names them), and
# `unaudited` (accepted as it was on the baseline's date, pinned to that version).

[[audit]]
name = "adler2"
version = "^2"
verdict = "pure"
reason = "Adler-32."

