[package]
description = "Deterministic simulation testing for the pane runtime"
edition     = { workspace = true }
license     = { workspace = true }
name        = "pane-runtime"
publish     = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_pane_runtime_plugin = { workspace = true, features = ["simulator"] }
simvar                   = { workspace = true, features = ["random", "thread", "time"] }
switchy_async            = { workspace = true, features = ["thread-simulator", "time"] }
switchy_pty              = { workspace = true, features = ["simulator"] }
switchy_simulation       = { workspace = true }
switchy_thread           = { workspace = true, features = ["simulator"] }
switchy_time             = { workspace = true, features = ["simulator"] }

[features]
default = []

fail-on-warnings = []
