[package]
description = "Deterministic simulation testing for the pane runtime"
edition     = { workspace = true }
license     = { workspace = true }
name        = "pane-runtime"
publish     = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_pane_runtime_plugin = { workspace = true, features = ["simulator"] }
bmux_simvar_tui          = { workspace = true }
bmux_tui                 = { workspace = true }
sim_support              = { workspace = true }
simvar                   = { workspace = true, features = ["random", "thread", "time"] }
switchy_async            = { workspace = true, features = ["thread-simulator", "time"] }
switchy_env              = { workspace = true, features = ["simulator"] }
switchy_fs               = { workspace = true, features = ["simulator", "sync"] }
switchy_pty              = { workspace = true, features = ["simulator"] }
switchy_simulation       = { workspace = true }
switchy_thread           = { workspace = true, features = ["simulator"] }
switchy_time             = { workspace = true, features = ["simulator"] }
tokio                    = { workspace = true, features = ["sync"] }

[features]
default = []

fail-on-warnings = []

# What simulations run of this crate (see switchy_cargo; `cargo sim NAME --check`).
[package.metadata.switchy.simulation]
# The harness around runs: switches read before any run (main.rs), the explorer (which starts
# and compares processes), the guide (which steers a fleet across runs by design: each run's
# profile is in its replay command) and dashboard telemetry (which never changes a run).
exempt = ["main.rs", "explore.rs", "guide.rs", "telemetry.rs"]
