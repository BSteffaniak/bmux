# Setup scripts provide the per-run test TMPDIR below.
experimental = ["setup-scripts"]

[profile.default]
# Flag a test as slow after a minute and terminate it after 15 minutes.
# Deliberately generous: integration fixtures boot real servers and can be
# slow under concurrent load, but a hung test must fail on its own instead of
# stalling every test queued behind it.
slow-timeout = { period = "60s", terminate-after = 15, grace-period = "10s" }

# Recorded-process tests launch isolated servers and rasterize animated evidence.
# Bound their aggregate host load without relaxing per-command deadlines.
[test-groups.recorded-processes]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(recording_process_integration) | binary(interactive_recording_integration)'
test-group = 'recorded-processes'
# Each test owns a server and a font-rasterization workload; reserve the
# scheduler's CPU budget rather than competing with the rest of the suite.
threads-required = "num-cpus"

# Pane-runtime PTY fixtures also spawn real controlling-terminal owners with
# bounded startup deadlines; do not flood the host with concurrent helpers.
[[profile.default.overrides]]
filter = 'package(bmux_pane_runtime_plugin)'
threads-required = "num-cpus"

# Playbook fixtures also boot isolated plugin-loaded servers. Reserve host
# capacity so parallel sandbox startups do not exhaust their fixed deadlines.
[[profile.default.overrides]]
filter = 'binary(playbook_integration)'
threads-required = "num-cpus"

# Application-resurrection fixtures boot a full plugin-loaded server, restart
# it, and drive nested shells through it. Run concurrently, their servers miss
# fixed readiness deadlines, so reserve host capacity like the fixtures above.
[[profile.default.overrides]]
filter = 'binary(application_resurrection_integration)'
threads-required = "num-cpus"

# Mutual-authentication fixtures run multiple real servers and Raft voters.
# Reserve host capacity just as for PTY fixtures; libtest serializes these in
# the integration binary, while nextest runs each test in a separate process.
[[profile.default.overrides]]
filter = 'binary(cluster_peer_auth_transport_integration)'
threads-required = "num-cpus"

# Every test sees a short, canonical, private TMPDIR, independent of the
# host's temporary directory (symlinked on macOS, long under `nix develop`).
# See scripts/nextest-test-tmpdir.sh.
[scripts.setup.test-tmpdir]
command = { command-line = "scripts/nextest-test-tmpdir.sh", relative-to = "workspace-root" }

[[profile.default.scripts]]
platform = 'cfg(unix)'
filter = 'all()'
setup = 'test-tmpdir'
