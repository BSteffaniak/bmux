[package]
authors     = { workspace = true }
categories  = ["development-tools::testing"]
description = "TestHost: run a bmux plugin bundled and as a real dynamic library under the same assertions"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "testing"]
license     = { workspace = true }
name        = "bmux_plugin_test"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_plugin         = { workspace = true }
bmux_plugin_runtime = { workspace = true }
bmux_plugin_sdk     = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true, features = ["std"] }
tokio               = { workspace = true, features = ["rt-multi-thread"] }

[features]
default = []
fail-on-warnings = [
    "bmux_plugin/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
