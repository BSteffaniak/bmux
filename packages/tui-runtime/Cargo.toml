[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "gui"]
description = "Bounded scheduling and presentation runtime for bmux terminal UIs"
edition     = { workspace = true }
keywords    = ["bmux", "terminal", "tui", "runtime"]
license     = { workspace = true }
name        = "bmux_tui_runtime"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[[example]]
name              = "image_runtime"
required-features = ["images"]

[[example]]
name              = "image_sixel"
required-features = ["image-sixel"]

[[example]]
name              = "image_iterm2"
required-features = ["image-iterm2"]

[[example]]
name              = "image_protocols"
required-features = ["image-kitty", "image-sixel", "image-iterm2", "terminal-io"]

[[example]]
name              = "pointer_controls"
required-features = ["terminal-io"]

[dev-dependencies]
bmux_text_edit = { workspace = true }
bmux_tui_components = { workspace = true, features = [
    "button",
    "text-input",
    "modal-frame",
] }
tokio = { workspace = true, features = ["test-util"] }

[dependencies]
bmux_image             = { workspace = true, optional = true }
bmux_keyboard          = { workspace = true }
bmux_terminal_protocol = { workspace = true }
bmux_tui               = { workspace = true }
futures-util           = { workspace = true, features = ["std"] }
tokio                  = { workspace = true, features = ["macros", "rt", "sync", "time"] }
zeroize                = { workspace = true }

[features]
# Image protocol bundle, independent of the terminal input/lifecycle backend.
all-protocols = ["image-kitty", "image-sixel", "image-iterm2"]
default = ["all-protocols", "terminal-io"]
fail-on-warnings = [
    "bmux_image?/fail-on-warnings",
    "bmux_keyboard/fail-on-warnings",
    "bmux_tui/fail-on-warnings",
]
image-iterm2 = ["images", "bmux_image/iterm2"]
image-kitty = ["images", "bmux_image/kitty"]
image-sixel = ["images", "bmux_image/sixel"]
images = ["dep:bmux_image"]
terminal-io = ["bmux_tui/terminal-io"]
# Deterministic `testing::ProgramHarness` for downstream test builds. Not for production.
testing = ["tokio/test-util"]
