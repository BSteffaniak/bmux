[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Server component for bmux terminal multiplexer"
edition     = { workspace = true }
keywords    = ["bmux", "multiplexer", "server", "terminal"]
license     = { workspace = true }
name        = "bmux_server"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
# Internal bmux packages
bmux_attach_image_protocol = { workspace = true }
bmux_attach_token_state    = { workspace = true }
bmux_attach_view_protocol  = { workspace = true }
bmux_client_state          = { workspace = true }
bmux_config                = { workspace = true }
bmux_context_state         = { workspace = true }
bmux_ipc                   = { workspace = true }
bmux_pane_runtime_state    = { workspace = true }
bmux_perf_telemetry        = { workspace = true }
bmux_performance_state     = { workspace = true }
bmux_plugin                = { workspace = true }
bmux_plugin_sdk            = { workspace = true }
bmux_recording_protocol    = { workspace = true }
bmux_recording_runtime     = { workspace = true }
bmux_session_models        = { workspace = true, features = ["serde"] }
bmux_session_state         = { workspace = true }
bmux_snapshot_runtime      = { workspace = true }

# External dependencies
anyhow = { workspace = true, features = ["std"] }
bmux_codec = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["std", "v4"] }


[features]
# Default features
default = []

# Development features
fail-on-warnings = [
    "bmux_attach_image_protocol/fail-on-warnings",
    "bmux_codec/fail-on-warnings",
    "bmux_config/fail-on-warnings",
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin/fail-on-warnings",
    "bmux_session_models/fail-on-warnings",
]

# IPC compression support
compression = ["bmux_ipc/compression"]

# Serialization features
serde = ["bmux_session_models/serde"]
