[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Cross-platform IPC protocol models for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "ipc", "multiplexer", "protocol", "terminal"]
license     = { workspace = true }
name        = "bmux_ipc"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_attach_image_protocol = { workspace = true }
bmux_codec = { workspace = true }
lz4_flex = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
] }
uuid = { workspace = true, features = ["serde", "std", "v4"] }
zstd = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
# Default features
default = []

# Development features
fail-on-warnings = [
    "bmux_attach_image_protocol/fail-on-warnings",
    "bmux_codec/fail-on-warnings",
]

# Compression support (optional, feature-gated)
compression      = ["compression-zstd", "compression-lz4", "bmux_codec/compression"]
compression-lz4  = ["dep:lz4_flex", "bmux_codec/compression-lz4"]
compression-zstd = ["dep:zstd", "bmux_codec/compression-zstd"]

[dev-dependencies]
bmux_performance_state  = { workspace = true }
bmux_recording_protocol = { workspace = true }
proptest                = { workspace = true }
tokio                   = { workspace = true, features = ["time"] }

# What simulations run of this crate (see switchy_cargo; `cargo sim NAME --check`).
[package.metadata.switchy.simulation]
# Linked by code the simulations run, but not exercised by them yet: before a simulation runs
# it, remove this table so the check scans it.
runs = false
reason = "IPC protocol models; the simulations call the pane runtime in-process, without IPC: no line of it ran in 800 instrumented pane runtime runs, standard and guided (2026-11-22)."
