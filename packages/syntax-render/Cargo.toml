[package]
authors     = { workspace = true }
categories  = ["development-tools", "rendering", "text-processing"]
description = "Syntax-highlighted terminal line rendering for terminal surfaces"
edition     = { workspace = true }
keywords    = ["terminal", "syntax", "tui"]
license     = { workspace = true }
name        = "bmux_syntax_render"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_tui = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
syntect  = { workspace = true, features = ["regex-onig"] }
two-face = { workspace = true, features = ["syntect-onig"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
syntect  = { workspace = true, features = ["regex-fancy"] }
two-face = { workspace = true, features = ["syntect-fancy"] }

[features]
default          = []
fail-on-warnings = ["bmux_tui/fail-on-warnings"]
