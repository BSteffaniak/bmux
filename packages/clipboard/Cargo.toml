[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Clipboard integration for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "clipboard", "terminal"]
license     = { workspace = true }
name        = "bmux_clipboard"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
image     = { workspace = true, features = ["png", "jpeg", "gif", "bmp"] }
thiserror = { workspace = true }
tracing   = { workspace = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "emscripten"))))'.dependencies]
libc                  = { workspace = true }
wayland-client        = { workspace = true }
wayland-protocols     = { workspace = true, features = ["client", "staging"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
x11rb                 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default          = []
fail-on-warnings = []
# Retained for downstream manifests; the native backend is always compiled.
native-clipboard = []
