[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Clipboard integration for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "clipboard", "terminal"]
license     = { workspace = true }
name        = "bmux_clipboard"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
arboard   = { workspace = true }
image     = { workspace = true }
libc      = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "emscripten"))))'.dependencies]
wayland-client = { version = "0.31.15", default-features = false, optional = true }
wayland-protocols = { version = "0.32.13", default-features = false, features = [
    "client",
    "staging",
], optional = true }
wayland-protocols-wlr = { version = "0.3.12", default-features = false, features = [
    "client",
], optional = true }
x11rb = { version = "0.13.2", default-features = false, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
# Staged native implementation; the reference remains the default until all
# platform interoperability gates have passed.
fail-on-warnings = []
native-clipboard = [
    "dep:libc",
    "dep:x11rb",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-protocols-wlr",
]
