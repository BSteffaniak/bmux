[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Clipboard integration for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "clipboard", "terminal"]
license     = { workspace = true }
name        = "bmux_clipboard"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
arboard    = { workspace = true }
image      = { workspace = true }
libc       = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
# Staged native implementation; the reference remains the default until all
# platform interoperability gates have passed.
fail-on-warnings = []
native-clipboard = ["dep:libc", "dep:libloading"]
