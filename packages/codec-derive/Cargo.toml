[package]
authors     = { workspace = true }
categories  = ["development-tools", "encoding"]
description = "Derive macro for flattening nested enums into one serde variant space"
edition     = { workspace = true }
keywords    = ["bmux", "codec", "derive", "enum", "serde"]
license     = { workspace = true }
name        = "bmux_codec_derive"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
proc-macro = true

[features]
default          = []
fail-on-warnings = []

[dependencies]
proc-macro2 = { workspace = true, features = ["proc-macro"] }
quote = { workspace = true, features = ["proc-macro"] }
syn = { workspace = true, features = [
    "clone-impls",
    "derive",
    "extra-traits",
    "full",
    "parsing",
    "printing",
    "proc-macro",
] }

[dev-dependencies]
bmux_codec = { workspace = true }
serde      = { workspace = true, features = ["derive", "std"] }
