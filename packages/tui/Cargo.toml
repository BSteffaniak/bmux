[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "gui"]
description = "Native terminal UI primitives for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "terminal", "tui", "ui"]
license     = { workspace = true }
name        = "bmux_tui"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_keyboard        = { workspace = true }
bmux_text_edit       = { workspace = true, features = ["keyboard"] }
crossterm            = { workspace = true, optional = true }
futures-util         = { workspace = true, optional = true, features = ["std"] }
serde                = { workspace = true, optional = true, features = ["derive"] }
unicode-segmentation = { workspace = true }
unicode-width        = { workspace = true }
zeroize              = { workspace = true, features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[features]
crossterm = [
    "bmux_keyboard/crossterm",
    "dep:crossterm",
    "dep:futures-util",
    "crossterm/bracketed-paste",
    "crossterm/event-stream",
    "crossterm/events",
]
default = []
fail-on-warnings = []
serde = ["dep:serde"]
