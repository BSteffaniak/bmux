[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "gui"]
description = "Native terminal UI primitives for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "terminal", "tui", "ui"]
license     = { workspace = true }
name        = "bmux_tui"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_keyboard        = { workspace = true }
bmux_text_edit       = { workspace = true, features = ["keyboard"] }
crossterm            = { workspace = true, optional = true }
unicode-segmentation = { workspace = true }
unicode-width        = { workspace = true }

[features]
crossterm        = ["dep:crossterm", "crossterm/bracketed-paste", "crossterm/events"]
default          = []
diff             = []
fail-on-warnings = []
