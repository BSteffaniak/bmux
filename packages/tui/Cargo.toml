[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "gui"]
description = "Native terminal UI primitives for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "terminal", "tui", "ui"]
license     = { workspace = true }
name        = "bmux_tui"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_color             = { workspace = true }
bmux_keyboard          = { workspace = true, features = ["csi-u"] }
bmux_terminal_protocol = { workspace = true }
bmux_text_edit         = { workspace = true, features = ["keyboard"] }
bmux_terminal          = { workspace = true, optional = true }
futures-util           = { workspace = true, optional = true, features = ["std"] }
image                  = { workspace = true, features = ["png", "jpeg", "gif", "bmp"] }
serde                  = { workspace = true, optional = true, features = ["derive"] }
unicode-segmentation   = { workspace = true }
unicode-width          = { workspace = true }
zeroize                = { workspace = true, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { workspace = true }

[features]
default = []
fail-on-warnings = [
    "bmux_color/fail-on-warnings",
    "bmux_keyboard/fail-on-warnings",
    "bmux_terminal?/fail-on-warnings",
    "bmux_text_edit/fail-on-warnings",
]
serde = ["dep:serde", "bmux_keyboard/serde", "bmux_text_edit/serde"]
terminal-io = ["dep:bmux_terminal", "dep:futures-util"]
