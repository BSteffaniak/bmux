[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "BMUX-owned portable terminal benchmark library"
edition     = { workspace = true }
keywords    = ["bmux", "terminal", "benchmark"]
license     = { workspace = true }
name        = "bmux_bench"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_terminal_grid = { workspace = true, optional = true }
bmux_tui           = { workspace = true, optional = true }
rustc-demangle     = { workspace = true }
serde              = { workspace = true, features = ["derive"] }
serde_json         = { workspace = true }
sha2               = { workspace = true }
toml               = { workspace = true, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }

[[bin]]
name = "bmux-bench-work"
path = "src/bin/work.rs"

[features]
default = []
fail-on-warnings = [
    "bmux_terminal_grid?/fail-on-warnings",
    "bmux_tui?/fail-on-warnings",
]
internal = ["dep:bmux_terminal_grid", "dep:bmux_tui"]

# What simulations run of this crate (see switchy_cargo; `cargo sim NAME --check`).
[package.metadata.switchy.simulation]
runs = false
reason = "Benchmark support, used only by the pane runtime's ingest benchmark, which only tests build."
