[package]
authors     = { workspace = true }
categories  = ["network-programming"]
description = "Bounded domain-neutral loopback browser snapshot and viewport hosting"
edition     = { workspace = true }
keywords    = ["bmux", "browser", "loopback", "snapshot"]
license     = { workspace = true }
name        = "bmux_web_host"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
getrandom = "0.3.4"
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "net",
    "rt",
    "sync",
    "time",
    "macros",
] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default          = []
fail-on-warnings = []
