[package]
authors     = { workspace = true }
categories  = ["network-programming"]
description = "Bounded domain-neutral loopback browser snapshot and viewport hosting"
edition     = { workspace = true }
keywords    = ["bmux", "browser", "loopback", "snapshot"]
license     = { workspace = true }
name        = "bmux_web_host"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[[example]]
name              = "live-publication-performance"
required-features = ["presentation"]

[dependencies]
anyhow = { workspace = true, optional = true }
bmux_tui = { workspace = true, optional = true }
bmux_web_renderer = { workspace = true, optional = true }
flate2 = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "net",
    "rt",
    "sync",
    "time",
    "macros",
] }
toml = { workspace = true, features = ["parse"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[build-dependencies]
sha2 = { workspace = true }
toml = { workspace = true, features = ["parse"] }

[features]
default = []
fail-on-warnings = [
    "bmux_tui?/fail-on-warnings",
    "bmux_web_renderer?/fail-on-warnings",
]
presentation = ["dep:anyhow", "dep:bmux_tui", "dep:bmux_web_renderer"]
