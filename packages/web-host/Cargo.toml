[package]
authors     = { workspace = true }
categories  = ["network-programming"]
description = "Bounded domain-neutral loopback browser snapshot and viewport hosting"
edition     = { workspace = true }
keywords    = ["bmux", "browser", "loopback", "snapshot"]
license     = { workspace = true }
name        = "bmux_web_host"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
anyhow = { workspace = true, optional = true }
bmux_tui = { workspace = true, optional = true }
bmux_web_renderer = { workspace = true, optional = true }
getrandom = "0.3.4"
libc = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "net",
    "rt",
    "sync",
    "time",
    "macros",
] }
toml = { workspace = true, features = ["parse"] }

[build-dependencies]
sha2 = { workspace = true }
toml = { workspace = true, features = ["parse"] }

[features]
default          = []
fail-on-warnings = []
presentation     = ["dep:anyhow", "dep:bmux_tui", "dep:bmux_web_renderer"]
