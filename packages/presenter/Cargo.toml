[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "rendering", "text-processing"]
description = "Portable presentation decks and canonical BMUX component composition"
edition     = { workspace = true }
keywords    = ["bmux", "presentation", "markdown", "terminal", "tui"]
license     = { workspace = true }
name        = "bmux_presenter"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bmux_markdown       = { workspace = true }
bmux_tui            = { workspace = true, features = ["serde"] }
bmux_tui_components = { workspace = true, features = ["scroll-view", "button"] }
bmux_web_renderer   = { workspace = true }
image               = { version = "0.25.10", default-features = false, features = ["png"] }
pulldown-cmark      = { workspace = true }
serde               = { workspace = true, features = ["derive"] }
serde_json          = { workspace = true }
serde_yaml          = { workspace = true }
sha2                = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.126", optional = true }

[features]
default          = []
fail-on-warnings = []
wasm             = ["dep:wasm-bindgen"]
