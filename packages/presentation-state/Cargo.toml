[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Neutral bounded semantic presentation fact primitives and retained registry"
edition     = { workspace = true }
keywords    = ["bmux", "presentation", "state", "primitive"]
license     = { workspace = true }
name        = "bmux_presentation_state"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_codec = { workspace = true }
serde      = { workspace = true, features = ["derive", "std"] }
tokio      = { workspace = true, features = ["sync"] }

[features]
default          = []
fail-on-warnings = ["bmux_codec/fail-on-warnings"]

# What simulations run of this crate (see switchy_cargo; `cargo sim NAME --check`).
[package.metadata.switchy.simulation]
# Linked by code the simulations run, but not exercised by them yet: before a simulation runs
# it, remove this table so the check scans it.
runs = false
reason = "Presentation facts the runtime publishes to attached clients, which the simulations do not have: no line of it ran in 800 instrumented pane runtime runs, standard and guided (2026-11-22)."
