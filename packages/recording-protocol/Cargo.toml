[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Neutral recording protocol DTOs for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "recording", "protocol"]
license     = { workspace = true }
name        = "bmux_recording_protocol"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_attach_image_protocol = { workspace = true }
bmux_codec                 = { workspace = true }
serde                      = { workspace = true, features = ["derive", "std"] }
uuid                       = { workspace = true, features = ["serde", "std"] }

[features]
default = []
fail-on-warnings = [
    "bmux_attach_image_protocol/fail-on-warnings",
    "bmux_codec/fail-on-warnings",
]
