[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Native GPU rendering of BMUX retained presentation"
edition     = { workspace = true }
keywords    = ["bmux", "terminal", "native"]
license     = { workspace = true }
name        = "bmux_native_renderer"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_fonts           = { workspace = true, features = ["bundled-nerd-fonts"] }
bmux_native_platform = { workspace = true, features = ["renderer-adapter"] }
bmux_tui             = { workspace = true }
bytemuck             = { workspace = true, features = ["derive"] }
fontdb               = { workspace = true }
image                = { workspace = true }
pollster             = { workspace = true }
swash                = { workspace = true }
thiserror            = { workspace = true }
wgpu                 = { workspace = true }

[features]
default          = []
fail-on-warnings = []
