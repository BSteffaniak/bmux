[package]
description = "Deterministic simulation testing for bmux_pty"
edition     = "2024"
license     = "MPL-2.0"
name        = "bmux_pty_simulator"
publish     = false
repository  = "https://github.com/BSteffaniak/bmux"
version     = "0.0.0"

# Its own workspace: the `simulator` features below must never be unified into a build of
# bmux's main workspace, where bmux_pty runs on the real system.
[workspace]

[workspace.dependencies]
bmux_pty           = { path = "..", default-features = false }
bmux_simvar_tui    = { path = "../../simvar-tui", default-features = false }
bmux_tui           = { path = "../../tui", default-features = false }
simvar             = { git = "https://github.com/MoosicBox/MoosicBox", branch = "master", default-features = false }
switchy_pty        = { git = "https://github.com/MoosicBox/MoosicBox", branch = "master", default-features = false }
switchy_simulation = { git = "https://github.com/MoosicBox/MoosicBox", branch = "master", default-features = false }
switchy_thread     = { git = "https://github.com/MoosicBox/MoosicBox", branch = "master", default-features = false }
switchy_time       = { git = "https://github.com/MoosicBox/MoosicBox", branch = "master", default-features = false }

[dependencies]
bmux_pty           = { workspace = true, features = ["simulator"] }
bmux_simvar_tui    = { workspace = true }
bmux_tui           = { workspace = true }
simvar             = { workspace = true, features = ["random", "thread", "time"] }
switchy_pty        = { workspace = true, features = ["simulator"] }
switchy_simulation = { workspace = true }
switchy_thread     = { workspace = true, features = ["simulator"] }
switchy_time       = { workspace = true, features = ["simulator"] }

[features]
default = []

fail-on-warnings = []
