[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "os"]
description = "Run a command in a pseudo-terminal and stream its output for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "terminal", "pty", "process"]
license     = { workspace = true }
name        = "bmux_pty"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
switchy_pty    = { workspace = true }
switchy_thread = { workspace = true }
switchy_time   = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[features]
default = ["native"]

fail-on-warnings = [
    "switchy_pty/fail-on-warnings",
    "switchy_thread/fail-on-warnings",
    "switchy_time/fail-on-warnings",
]

# Real pseudo-terminals, threads and time.
native = ["switchy_pty/native", "switchy_thread/std", "switchy_time/std"]
# Simulated terminals, processes, threads and time, for deterministic simulation (any host;
# it replaces the native backends, ConPTY included).
simulator = [
    "switchy_pty/simulator",
    "switchy_thread/simulator",
    "switchy_time/simulator",
]

# What simulations run of this crate (see switchy_cargo; `cargo sim NAME --check`).
[package.metadata.switchy.simulation]
# This crate is a platform layer: it chooses each system's backend.
os-named-in = ["lib.rs"]
# Stricter here than the shared rules: no std threads, std sync groups or std instants at all.
forbid = ["std::thread::", "std::sync::{", "Instant::now"]
