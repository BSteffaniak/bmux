[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "os"]
description = "Run a command in a pseudo-terminal and stream its output for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "terminal", "pty", "process"]
license     = { workspace = true }
name        = "bmux_pty"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
switchy_pty    = { workspace = true }
switchy_thread = { workspace = true }
switchy_time   = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[features]
default = ["native"]

fail-on-warnings = [
    "switchy_pty/fail-on-warnings",
    "switchy_thread/fail-on-warnings",
    "switchy_time/fail-on-warnings",
]

# Real pseudo-terminals, threads and time.
native = ["switchy_pty/native", "switchy_thread/std", "switchy_time/std"]
