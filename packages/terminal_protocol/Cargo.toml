[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shared terminal query/reply protocol engine for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "compatibility", "protocol", "terminal"]
license     = { workspace = true }
name        = "bmux_terminal_protocol"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
serde = { workspace = true, features = ["derive", "std"] }
# The clock a simulation controls (std's natively).
switchy_time = { workspace = true, features = ["std"] }

[features]
default          = ["kitty-keyboard"]
fail-on-warnings = []
kitty-keyboard   = []

# What simulations run of this crate (see switchy_cargo; `cargo sim NAME --check`).
[package.metadata.switchy.simulation]
# Output to the user's own terminal (pointer shapes; the bell and notifications, detected from
# the client's environment): client side, never in a pane runtime.
exempt = ["notification_output.rs", "pointer_output.rs"]
