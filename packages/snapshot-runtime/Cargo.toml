[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Neutral primitive crate: snapshot-orchestration traits + registry + dirty flag for the bmux.snapshot plugin surface"
edition     = { workspace = true }
keywords    = ["bmux", "snapshot", "runtime", "primitive"]
license     = { workspace = true }
name        = "bmux_snapshot_runtime"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_plugin_sdk        = { workspace = true }
bmux_snapshot_protocol = { workspace = true }
# Atomics and the clock a simulation controls (std's natively).
switchy_thread = { workspace = true, features = ["std"] }
switchy_time   = { workspace = true, features = ["std"] }
thiserror      = { workspace = true }

[dev-dependencies]
bmux_sim_primitives_check = { workspace = true }
tokio                     = { workspace = true, features = ["macros", "rt"] }

[features]
default = []
fail-on-warnings = [
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_snapshot_protocol/fail-on-warnings",
]
