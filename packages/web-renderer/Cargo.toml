[package]
authors     = { workspace = true }
categories  = ["gui", "wasm"]
description = "Backend-neutral browser presentation of retained bmux TUI output"
edition     = { workspace = true }
keywords    = ["bmux", "tui", "canvas", "wasm"]
license     = { workspace = true }
name        = "bmux_web_renderer"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bmux_codec    = { workspace = true }
bmux_tui      = { workspace = true, features = ["serde"] }
serde         = { workspace = true, features = ["derive"] }
serde_json    = { workspace = true, features = ["std"] }
sha2          = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.103", optional = true }
wasm-bindgen = { version = "0.2.126", optional = true }
wasm-bindgen-futures = { version = "0.4.76", optional = true }
web-sys = { version = "0.3.103", optional = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "ImageBitmap",
    "Blob",
    "BlobPropertyBag",
] }

[features]
default = []
fail-on-warnings = []
wasm = [
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
