[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Runtime performance telemetry helpers for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "perf", "telemetry"]
license     = { workspace = true }
name        = "bmux_perf_telemetry"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }

[features]
default          = []
fail-on-warnings = []

# What simulations run of this crate (see switchy_cargo; `cargo sim NAME --check`).
[package.metadata.switchy.simulation]
# Linked by code the simulations run, but not exercised by them yet: before a simulation runs
# it, remove this table so the check scans it.
runs = false
reason = "Performance telemetry the runtime records only when its environment asks: no line of it ran in 800 instrumented pane runtime runs, standard and guided (2026-11-22)."
