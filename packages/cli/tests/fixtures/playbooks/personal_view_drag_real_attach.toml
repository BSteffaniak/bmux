[plugins.settings."bmux.tab_bar"]
tab_template = "<{active}:{name}>"

[keybindings]
initial_mode = "normal"

[keybindings.global]
"alt+a" = "plugin:bmux.tabs:new-tab --name=alpha"
"alt+b" = "plugin:bmux.tabs:new-tab --name=beta"
"alt+c" = "plugin:bmux.tabs:new-tab --name=gamma"
"alt+v" = "plugin:bmux.finder:views"

[keybindings.modes.normal]
label       = "NORMAL"
passthrough = true
