[plugins.settings."bmux.tab_bar"]
tab_template = "<{active}:{name}>"

[keybindings]
initial_mode = "normal"

[keybindings.global]
"alt+a" = "plugin:bmux.tabs:new-tab --name=alpha"
"alt+b" = "plugin:bmux.tabs:new-tab --name=beta"
"alt+u" = "plugin:bmux.tabs:undo-remove-from-view"
"alt+x" = "plugin:bmux.tabs:remove-from-view"

[keybindings.modes.normal]
label       = "NORMAL"
passthrough = true
