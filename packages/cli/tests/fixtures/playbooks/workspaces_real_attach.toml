[plugins.settings."bmux.tab_bar"]
tab_template = "<{name}>"

[keybindings]
initial_mode = "normal"

[keybindings.global]
"alt+1" = "plugin:bmux.tabs:goto-tab 1"
"alt+2" = "plugin:bmux.tabs:goto-tab 2"
"alt+c" = "plugin:bmux.sessions:new-session"
"alt+f" = "plugin:bmux.finder:show"
"alt+h" = "plugin:bmux.tabs:prev-tab"
"alt+j" = "plugin:bmux.tabs:next-tab"
"alt+k" = "plugin:bmux.tabs:last-tab"
"alt+l" = "plugin:bmux.workspaces:last-workspace"
"alt+w" = "plugin:bmux.workspaces:new-workspace"

[keybindings.modes.normal]
label       = "NORMAL"
passthrough = true

[keybindings.modes.normal.bindings]
"c"       = "plugin:bmux.tabs:new-tab"
"g"       = "plugin:bmux.tabs:goto-tab 1"
"l"       = "plugin:bmux.tabs:last-tab"
"n"       = "plugin:bmux.tabs:next-tab"
"p"       = "plugin:bmux.tabs:prev-tab"
"shift+1" = "plugin:bmux.tabs:goto-tab 1"
