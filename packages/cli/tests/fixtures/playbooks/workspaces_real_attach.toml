[status_bar]
tab_template = "<{name}>"

[keybindings]
initial_mode = "normal"

[keybindings.global]
"alt+1" = "plugin:bmux.windows:goto-window 1"
"alt+2" = "plugin:bmux.windows:goto-window 2"
"alt+c" = "plugin:bmux.sessions:new-session"
"alt+f" = "plugin:bmux.finder:show"
"alt+h" = "plugin:bmux.windows:prev-window"
"alt+j" = "plugin:bmux.windows:next-window"
"alt+k" = "plugin:bmux.windows:last-window"
"alt+l" = "plugin:bmux.workspaces:last-workspace"
"alt+w" = "plugin:bmux.workspaces:new-workspace"

[keybindings.modes.normal]
label       = "NORMAL"
passthrough = true

[keybindings.modes.normal.bindings]
"c"       = "plugin:bmux.windows:new-window"
"g"       = "plugin:bmux.windows:goto-window 1"
"l"       = "plugin:bmux.windows:last-window"
"n"       = "plugin:bmux.windows:next-window"
"p"       = "plugin:bmux.windows:prev-window"
"shift+1" = "plugin:bmux.windows:goto-window 1"
