[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Extension points the BMUX host program declares, generated from BPDL"
edition     = { workspace = true }
keywords    = ["bmux", "plugin", "extension"]
license     = { workspace = true }
name        = "bmux_extpoints"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_codec                = { workspace = true }
bmux_ipc                  = { workspace = true }
bmux_plugin_schema_macros = { workspace = true }
bmux_plugin_sdk           = { workspace = true }
serde                     = { workspace = true, features = ["derive"] }

[package.metadata.cargo-machete]
# Referenced by BPDL-generated code, not handwritten source.
ignored = ["bmux_codec", "bmux_ipc", "bmux_plugin_sdk", "serde"]

[features]
default = []
fail-on-warnings = [
    "bmux_codec/fail-on-warnings",
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin_schema_macros/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
]
