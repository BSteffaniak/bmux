[package]
authors     = { workspace = true }
categories  = ["development-tools", "rendering"]
description = "Bounded Mermaid diagram rendering for BMUX"
edition     = { workspace = true }
keywords    = ["terminal", "diagram", "mermaid"]
license     = { workspace = true }
name        = "bmux_mermaid_render"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
roxmltree = { workspace = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio    = { workspace = true, features = ["rt", "sync", "time"] }
wasmtime = { workspace = true }

[build-dependencies]
# Enable only the destination Cranelift backends needed for renderer AOT artifacts.
cranelift-codegen = { workspace = true }
wasmtime          = { workspace = true }

[dev-dependencies]
# The benchmark hashes output; match Cranelift's digest generation.
sha2_010 = { workspace = true }
tempfile = { workspace = true }
# Exercise destination AOT generation with the same backends as the build script.
cranelift-codegen = { workspace = true }
wat               = { workspace = true }

[features]
default          = []
fail-on-warnings = []
