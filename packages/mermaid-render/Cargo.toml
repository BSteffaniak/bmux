[package]
authors     = { workspace = true }
categories  = ["development-tools", "rendering"]
description = "Bounded Mermaid diagram rendering for BMUX"
edition     = { workspace = true }
keywords    = ["terminal", "diagram", "mermaid"]
license     = { workspace = true }
name        = "bmux_mermaid_render"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
sha2 = { workspace = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio    = { workspace = true, features = ["rt", "sync", "time"] }
wasmtime = { workspace = true }

[build-dependencies]
# Enable destination backends directly: Wasmtime's all-arch feature resolves an
# unpublished winch-codegen 38.0.4, though this renderer only uses Cranelift.
cranelift-codegen = { workspace = true }
wasmtime          = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Exercise destination AOT generation with the same backends as the build script.
cranelift-codegen = { workspace = true }
wat               = { workspace = true }

[features]
default          = []
fail-on-warnings = []
