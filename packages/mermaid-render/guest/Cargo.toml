[package]
edition = "2024"
name    = "bmux-mermaid-guest"
publish = false
version = "0.1.0"

# Intentionally independent: no host runtime dependencies or outer workspace locks.
[workspace]

[lib]
crate-type = ["cdylib"]

[workspace.dependencies]
# Follow the portable fork branch; Cargo.lock retains the exact resolved commit.
mermaid-rs-renderer = { git = "https://github.com/BSteffaniak/mermaid-rs-renderer", branch = "wasm-portability", default-features = false }

[dependencies]
mermaid-rs-renderer = { workspace = true }

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = "debuginfo"
