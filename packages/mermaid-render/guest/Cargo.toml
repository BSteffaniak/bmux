[package]
edition = "2024"
name    = "bmux-mermaid-guest"
publish = false
version = "0.1.0"

# Intentionally independent: no host runtime dependencies or outer workspace locks.
[workspace]
# Third-party library stays outside the guest's first-party lint/test targets.
exclude = ["vendor/mermaid-rs-renderer"]

[lib]
crate-type = ["cdylib"]

[workspace.dependencies]
# Guest-local portability changes; never patch the native workspace renderer.
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer", version = "=0.3.1", default-features = false }

[dependencies]
mermaid-rs-renderer = { workspace = true }

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = "debuginfo"
