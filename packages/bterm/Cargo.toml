[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Bterm native terminal window powered by BMUX"
edition     = { workspace = true }
keywords    = ["bterm", "bmux", "terminal", "native"]
license     = { workspace = true }
name        = "bterm"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[[bin]]
name = "bterm"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
bmux_attach_pipeline = { workspace = true }
bmux_cli = { workspace = true, features = ["kitty-keyboard"] }
bmux_client = { workspace = true }
bmux_config = { workspace = true }
bmux_frontend_runtime = { workspace = true }
bmux_ipc = { workspace = true }
bmux_pane_runtime_plugin_api = { workspace = true }
bmux_plugin_sdk = { workspace = true }
bmux_terminal_protocol = { workspace = true }
bterm_native_platform = { workspace = true }
bterm_native_renderer = { workspace = true }
clap = { workspace = true, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
] }
toml = { workspace = true }

[dev-dependencies]
bmux_tui = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default          = []
fail-on-warnings = []
