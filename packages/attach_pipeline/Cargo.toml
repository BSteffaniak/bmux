[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shared attach pipeline runtime for bmux"
edition     = { workspace = true }
keywords    = ["attach", "bmux", "pipeline", "render", "terminal"]
license     = { workspace = true }
name        = "bmux_attach_pipeline"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_appearance             = { workspace = true }
bmux_attach_layout_protocol = { workspace = true }
bmux_attach_pipeline_models = { workspace = true }
bmux_attach_view_protocol   = { workspace = true }
bmux_client                 = { workspace = true }
bmux_plugin                 = { workspace = true }
bmux_scene_protocol         = { workspace = true }
bmux_scene_protocol_render  = { workspace = true }
bmux_terminal_grid          = { workspace = true }

anyhow        = { workspace = true, features = ["std"] }
crossterm     = { workspace = true }
tracing       = { workspace = true, features = ["std"] }
unicode-width = { workspace = true }
uuid          = { workspace = true, features = ["std"] }
vt100         = { workspace = true }

[features]
default = []

fail-on-warnings = [
    "bmux_attach_layout_protocol/fail-on-warnings",
    "bmux_attach_pipeline_models/fail-on-warnings",
    "bmux_attach_view_protocol/fail-on-warnings",
    "bmux_appearance/fail-on-warnings",
    "bmux_client/fail-on-warnings",
    "bmux_plugin/fail-on-warnings",
    "bmux_scene_protocol/fail-on-warnings",
    "bmux_scene_protocol_render/fail-on-warnings",
    "bmux_terminal_grid/fail-on-warnings",
]
