[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Shared attach pipeline runtime for bmux"
edition     = { workspace = true }
keywords    = ["attach", "bmux", "pipeline", "render", "terminal"]
license     = { workspace = true }
name        = "bmux_attach_pipeline"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_appearance             = { workspace = true }
bmux_attach_image_protocol  = { workspace = true }
bmux_attach_layout_protocol = { workspace = true }
bmux_attach_pipeline_models = { workspace = true }
bmux_attach_view_protocol   = { workspace = true }
bmux_client                 = { workspace = true }
bmux_image                  = { workspace = true, optional = true }
bmux_plugin                 = { workspace = true, features = ["tui"] }
bmux_raster                 = { workspace = true }
bmux_scene_protocol_render  = { workspace = true }
bmux_terminal               = { workspace = true }
bmux_terminal_grid          = { workspace = true }
bmux_terminal_protocol      = { workspace = true }
bmux_tui                    = { workspace = true, features = ["terminal-io"] }

anyhow             = { workspace = true, features = ["std"] }
bmux_cell_geometry = { workspace = true }
futures-util       = { workspace = true, features = ["std"] }
tokio              = { workspace = true, features = ["sync", "time"] }
tracing            = { workspace = true, features = ["std"] }
uuid               = { workspace = true, features = ["std"] }

[dev-dependencies]
bmux_bench = { workspace = true }
bmux_ipc   = { workspace = true }

[features]
default = []

image-iterm2 = ["dep:bmux_image", "bmux_image/iterm2"]
image-kitty  = ["dep:bmux_image", "bmux_image/kitty"]
image-sixel  = ["dep:bmux_image", "bmux_image/sixel"]

fail-on-warnings = [
    "bmux_attach_layout_protocol/fail-on-warnings",
    "bmux_attach_pipeline_models/fail-on-warnings",
    "bmux_attach_view_protocol/fail-on-warnings",
    "bmux_appearance/fail-on-warnings",
    "bmux_client/fail-on-warnings",
    "bmux_image?/fail-on-warnings",
    "bmux_plugin/fail-on-warnings",
    "bmux_scene_protocol_render/fail-on-warnings",
    "bmux_terminal_grid/fail-on-warnings",
    "bmux_attach_image_protocol/fail-on-warnings",
    "bmux_tui/fail-on-warnings",
]
