[package]
authors.workspace    = true
description          = "Kiosk token administration shared by bmux connections hosts"
edition.workspace    = true
license.workspace    = true
name                 = "bmux_connections_admin"
repository.workspace = true
version.workspace    = true

categories = ["command-line-utilities"]
keywords   = ["bmux", "connections"]
readme     = "README.md"

[dependencies]
anyhow      = { workspace = true, features = ["std"] }
bmux_config = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
sha2        = { workspace = true }
uuid        = { workspace = true, features = ["std", "v4"] }

[features]
fail-on-warnings = ["bmux_config/fail-on-warnings"]
