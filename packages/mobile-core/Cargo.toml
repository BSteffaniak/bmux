[package]
authors     = { workspace = true }
categories  = ["network-programming", "development-tools"]
description = "Shared mobile domain core for bmux clients"
edition     = { workspace = true }
keywords    = ["bmux", "mobile", "connection", "ffi"]
license     = { workspace = true }
name        = "bmux_mobile_core"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_attach_layout_protocol = { workspace = true }
bmux_attach_pipeline = { workspace = true }
bmux_attach_token_state = { workspace = true }
bmux_attach_view_protocol = { workspace = true }
bmux_client = { workspace = true }
bmux_codec = { workspace = true }
bmux_ipc = { workspace = true, features = ["compression-zstd"] }
bmux_pane_runtime_plugin_api = { workspace = true }
bmux_plugin_sdk = { workspace = true }
bmux_session_models = { workspace = true, features = ["serde"] }
bmux_sessions_plugin_api = { workspace = true }
bmux_tabs_plugin_api = { workspace = true }
bmux_terminal_grid = { workspace = true }
bmux_terminal_protocol = { workspace = true }
iroh = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ssh2 = { workspace = true, features = ["vendored-openssl"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-rustls = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[features]
default = []

fail-on-warnings = [
    "bmux_attach_layout_protocol/fail-on-warnings",
    "bmux_attach_pipeline/fail-on-warnings",
    "bmux_attach_token_state/fail-on-warnings",
    "bmux_attach_view_protocol/fail-on-warnings",
    "bmux_client/fail-on-warnings",
    "bmux_codec/fail-on-warnings",
    "bmux_ipc/fail-on-warnings",
    "bmux_pane_runtime_plugin_api/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_session_models/fail-on-warnings",
    "bmux_sessions_plugin_api/fail-on-warnings",
    "bmux_tabs_plugin_api/fail-on-warnings",
    "bmux_terminal_grid/fail-on-warnings",
]
