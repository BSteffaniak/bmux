[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "gui"]
description = "Reusable terminal UI components for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "terminal", "tui", "components"]
license     = { workspace = true }
name        = "bmux_tui_components"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_keyboard               = { workspace = true }
bmux_text_edit              = { workspace = true, features = ["keyboard"], optional = true }
bmux_tui                    = { workspace = true }
bmux_tui_component_protocol = { workspace = true, optional = true }
unicode-segmentation        = { workspace = true, optional = true }

[features]
default          = []
fail-on-warnings = []
protocol         = ["dep:bmux_tui_component_protocol", "text-input"]
text-input       = ["dep:bmux_text_edit", "dep:unicode-segmentation"]
