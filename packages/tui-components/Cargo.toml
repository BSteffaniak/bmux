[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "gui"]
description = "Reusable terminal UI components for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "terminal", "tui", "components"]
license     = { workspace = true }
name        = "bmux_tui_components"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[[example]]
name              = "virtual_list_benchmark"
required-features = ["virtual-list"]

[[example]]
name              = "virtual_list_chat"
required-features = ["virtual-list"]

[[test]]
name              = "virtual_list_motion"
required-features = ["virtual-list"]

[dependencies]
bmux_color = { workspace = true }
bmux_keyboard = { workspace = true, optional = true }
bmux_terminal_grid = { workspace = true, optional = true }
bmux_text_edit = { workspace = true, features = [
    "keyboard",
    "serde",
], optional = true }
bmux_tui = { workspace = true }
chrono = { workspace = true, features = ["serde"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
unicode-segmentation = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }

[dev-dependencies]
bmux_keyboard = { workspace = true }
# `terminal-io` serves the standalone `virtual_list_chat` example's terminal input.
bmux_tui_runtime = { workspace = true, features = ["terminal-io", "testing"] }
tokio = { workspace = true, features = ["rt", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { workspace = true }

[features]
default = []
fail-on-warnings = [
    "bmux_color/fail-on-warnings",
    "bmux_keyboard?/fail-on-warnings",
    "bmux_terminal_grid?/fail-on-warnings",
    "bmux_text_edit?/fail-on-warnings",
    "bmux_tui/fail-on-warnings",
]

# Individual components. Composed controls enable their implementation prerequisites.
action-row = ["button"]
badge = []
bar-chart = []
breadcrumbs = ["keyboard-input"]
button = ["keyboard-input"]
canvas = []
card = []
chart = ["dep:unicode-segmentation"]
checkbox = ["keyboard-input"]
compact = ["dep:unicode-segmentation", "dep:unicode-width"]
completion = ["text-input", "selectable-list", "picker-frame"]
date-picker = ["keyboard-input", "dep:bmux_text_edit", "dep:chrono"]
dialog = ["action-row", "modal-frame"]
diff-viewer = ["source-viewer", "dep:unicode-segmentation", "dep:unicode-width"]
disclosure = []
empty-state = []
form = ["keyboard-input"]
form-field = []
key-hint-bar = []
labeled-details = []
menu = ["selectable-list"]
modal-frame = []
pane = ["scroll-view"]
panel-group = []
picker-frame = []
progress-bar = []
radio-group = ["keyboard-input"]
resident-window = []
scroll-view = ["keyboard-input", "scrollbar"]
scrollbar = []
select-dropdown = ["selectable-list"]
selectable-list = ["keyboard-input", "scroll-view"]
source-viewer = ["dep:unicode-segmentation", "dep:unicode-width"]
sparkline = []
spinner = []
split-button = ["button", "menu"]
status-bar = []
stepper = []
tab-bar = ["keyboard-input"]
table = ["keyboard-input", "scroll-view"]
terminal-view = ["dep:bmux_terminal_grid", "scroll-view"]
terminal-viewer = ["dep:bmux_terminal_grid"]
text-input = [
    "scroll-view",
    "keyboard-input",
    "dep:bmux_text_edit",
    "dep:unicode-segmentation",
]
text-input-box = ["text-input", "form-field"]
text-view = ["scroll-view"]
toast-stack = ["keyboard-input"]
tree-view = ["keyboard-input"]
uniform-list = ["keyboard-input", "scroll-view"]
virtual-list = ["scroll-view", "resident-window"]

# Private dependency capability shared by keyboard-interactive controls.
keyboard-input = ["dep:bmux_keyboard"]

# Optional ergonomic bundles.
all = [
    "completion",
    "action-row",
    "badge",
    "bar-chart",
    "breadcrumbs",
    "button",
    "canvas",
    "card",
    "chart",
    "compact",
    "checkbox",
    "date-picker",
    "dialog",
    "diff-viewer",
    "disclosure",
    "empty-state",
    "form",
    "form-field",
    "key-hint-bar",
    "labeled-details",
    "menu",
    "modal-frame",
    "pane",
    "panel-group",
    "picker-frame",
    "progress-bar",
    "radio-group",
    "resident-window",
    "scroll-view",
    "scrollbar",
    "select-dropdown",
    "selectable-list",
    "source-viewer",
    "sparkline",
    "spinner",
    "split-button",
    "status-bar",
    "stepper",
    "tab-bar",
    "table",
    "text-input",
    "text-input-box",
    "terminal-view",
    "terminal-viewer",
    "text-view",
    "toast-stack",
    "tree-view",
    "uniform-list",
    "virtual-list",
]
data-display = [
    "badge",
    "bar-chart",
    "canvas",
    "chart",
    "compact",
    "empty-state",
    "labeled-details",
    "progress-bar",
    "sparkline",
    "spinner",
    "status-bar",
    "stepper",
    "table",
    "text-view",
]
forms = [
    "action-row",
    "split-button",
    "checkbox",
    "date-picker",
    "form",
    "form-field",
    "radio-group",
    "select-dropdown",
    "text-input-box",
]
navigation = [
    "breadcrumbs",
    "menu",
    "selectable-list",
    "tab-bar",
    "tree-view",
    "uniform-list",
]
overlays = ["dialog", "modal-frame", "picker-frame", "toast-stack"]
text-editing = ["text-input", "text-input-box", "text-view"]
