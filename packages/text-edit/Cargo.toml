[package]
authors     = { workspace = true }
categories  = ["command-line-interface", "text-editors"]
description = "Unicode-aware terminal text editing primitives for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "terminal", "text", "input"]
license     = { workspace = true }
name        = "bmux_text_edit"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_cell_geometry        = { workspace = true }
bmux_keyboard             = { workspace = true, optional = true }
bmux_unicode_segmentation = { workspace = true }
serde                     = { workspace = true, features = ["derive", "std"], optional = true }
zeroize                   = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default          = []
fail-on-warnings = ["bmux_keyboard?/fail-on-warnings"]
keyboard         = ["dep:bmux_keyboard"]
serde            = ["dep:serde", "bmux_keyboard?/serde"]

# What simulations run of this crate (see switchy_cargo; `cargo sim NAME --check`).
[package.metadata.switchy.simulation]
runs = false
reason = "Text editing for terminal UIs (the dashboard, the client); never inside a run."
