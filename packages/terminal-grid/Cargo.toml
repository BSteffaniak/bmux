[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Neutral structured terminal grid and scrollback reflow primitives for bmux"
edition     = { workspace = true }
keywords    = ["bmux", "terminal", "grid", "scrollback"]
license     = { workspace = true }
name        = "bmux_terminal_grid"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_cell_geometry        = { workspace = true }
bmux_codec                = { workspace = true }
bmux_terminal_protocol    = { workspace = true }
bmux_unicode_segmentation = { workspace = true }
foldhash                  = { workspace = true }
serde                     = { workspace = true, features = ["derive", "std", "rc"] }
thiserror                 = { workspace = true }

[dev-dependencies]
bmux_tui   = { workspace = true }
serde_json = { workspace = true }

[features]
default          = []
fail-on-warnings = []
