[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Plugin system for bmux terminal multiplexer"
edition     = { workspace = true }
keywords    = ["bmux", "extensibility", "plugin", "terminal"]
license     = { workspace = true }
name        = "bmux_plugin"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
# SDK crate (re-exported for backward compatibility)
bmux_plugin_sdk = { workspace = true }

bmux_plugin_runtime = { workspace = true }
# External dependencies (host-side only)
bmux_codec          = { workspace = true }
bmux_ipc            = { workspace = true }
bmux_keyboard       = { workspace = true }
bmux_perf_telemetry = { workspace = true }
bmux_tui            = { workspace = true }
libloading          = { workspace = true }
semver              = { workspace = true }
serde               = { workspace = true, features = ["derive", "std"] }
serde_json          = { workspace = true }
sha2                = { workspace = true }
tempfile            = { workspace = true }
thiserror           = { workspace = true }
tokio               = { workspace = true, features = ["sync"] }
toml                = { workspace = true, features = ["parse"] }
tracing             = { workspace = true, features = ["std"] }
unicode-width       = { workspace = true }
uuid                = { workspace = true, features = ["serde", "std"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
serial_test = { workspace = true }
tokio       = { workspace = true, features = ["sync", "macros", "rt"] }


[features]
# Default features
default = []

# Development features
fail-on-warnings = [
    "bmux_ipc/fail-on-warnings",
    "bmux_plugin_sdk/fail-on-warnings",
    "bmux_tui/fail-on-warnings",
    "bmux_keyboard/fail-on-warnings",
    "bmux_perf_telemetry/fail-on-warnings",
]
