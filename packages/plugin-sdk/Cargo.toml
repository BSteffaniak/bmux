[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Plugin SDK for bmux — the types and traits plugin authors need"
edition     = { workspace = true }
keywords    = ["bmux", "extensibility", "plugin", "sdk"]
license     = { workspace = true }
name        = "bmux_plugin_sdk"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_codec = { workspace = true }
bmux_ipc = { workspace = true }
bmux_perf_telemetry = { workspace = true }
bmux_plugin_runtime = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
switchy = { workspace = true, features = [
    "async",
    "async-tokio",
    "random-rand",
] }
thiserror = { workspace = true }
toml = { workspace = true, features = ["parse"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "std"] }

[build-dependencies]
bmux_plugin_schema = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[package.metadata.cargo-machete]
# Used by build.rs to compile bpdl/cli-bridge.bpdl; machete misses this build dependency.
ignored = ["bmux_plugin_schema"]

[features]
default = []
fail-on-warnings = [
    "bmux_codec/fail-on-warnings",
    "switchy/fail-on-warnings",
    "bmux_ipc/fail-on-warnings",
    "bmux_perf_telemetry/fail-on-warnings",
]
