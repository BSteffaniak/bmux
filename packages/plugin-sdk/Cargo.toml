[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Plugin SDK for bmux — the types and traits plugin authors need"
edition     = { workspace = true }
keywords    = ["bmux", "extensibility", "plugin", "sdk"]
license     = { workspace = true }
name        = "bmux_plugin_sdk"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
bmux_codec          = { workspace = true }
bmux_ipc            = { workspace = true }
bmux_perf_telemetry = { workspace = true }
bmux_plugin_runtime = { workspace = true }
serde               = { workspace = true, features = ["derive", "std"] }
serde_json          = { workspace = true }
switchy             = { workspace = true, features = ["random-rand"] }
thiserror           = { workspace = true }
# Runtime-agnostic primitives only: plugins reach the host runtime through
# plug-rt (`bmux_plugin_runtime::rt`), never a runtime of their own.
tokio   = { workspace = true, features = ["sync"] }
toml    = { workspace = true, features = ["parse"] }
tracing = { workspace = true }
uuid    = { workspace = true, features = ["serde", "std"] }

[build-dependencies]
bmux_plugin_schema = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[package.metadata.cargo-machete]
# Used by build.rs to compile bpdl/cli-bridge.bpdl; machete misses this build dependency.
ignored = ["bmux_plugin_schema"]

[features]
default = []
fail-on-warnings = [
    "bmux_codec/fail-on-warnings",
    "switchy/fail-on-warnings",
    "bmux_ipc/fail-on-warnings",
    "bmux_perf_telemetry/fail-on-warnings",
]

# What simulations run of this crate (see switchy_cargo; `cargo sim NAME --check`).
[package.metadata.switchy.simulation]
# Linked by code the simulations run, but not exercised by them yet: before a simulation runs
# it, remove this table so the check scans it.
runs = false
reason = "Plugin SDK types the pane runtime plugin is written against; the simulations do not exercise its code: no line of it ran in 800 instrumented pane runtime runs, standard and guided (2026-11-22)."
