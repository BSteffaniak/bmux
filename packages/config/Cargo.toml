[package]
authors     = { workspace = true }
categories  = ["config", "development-tools"]
description = "Configuration management for bmux terminal multiplexer"
edition     = { workspace = true }
keywords    = ["bmux", "config", "multiplexer", "terminal"]
license     = { workspace = true }
name        = "bmux_config"
readme      = "README.md"
repository  = { workspace = true }
version     = { workspace = true }

[dependencies]
anyhow = { workspace = true }
# Internal bmux packages
bmux_config_composition = { workspace = true }
bmux_config_doc         = { workspace = true }
bmux_config_doc_derive  = { workspace = true }
bmux_event_models       = { workspace = true, features = ["serde"] }
bmux_ipc                = { workspace = true }
bmux_keybind            = { workspace = true }
bmux_slots              = { workspace = true }

# External dependencies
serde     = { workspace = true, features = ["derive"] }
switchy   = { workspace = true, features = ["fs-native-directories"] }
thiserror = { workspace = true }
toml      = { workspace = true, features = ["display", "parse"] }
tracing   = { workspace = true, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }


[features]
# Default features
default = []

# Development features
fail-on-warnings = [
    "bmux_config_doc_derive/fail-on-warnings",
    "bmux_event_models/fail-on-warnings",
    "bmux_keybind/fail-on-warnings",
    "bmux_ipc/fail-on-warnings",
    "bmux_slots/fail-on-warnings",
    "bmux_config_doc/fail-on-warnings",
]

# What simulations run of this crate (see switchy_cargo; `cargo sim NAME --check`).
[package.metadata.switchy.simulation]
# Linked by code the simulations run, but not exercised by them yet: before a simulation runs
# it, remove this table so the check scans it.
runs = false
reason = "Configuration loading and types; the simulations never load configuration in a run: no line of it ran in 800 instrumented pane runtime runs, standard and guided (2026-11-22)."
