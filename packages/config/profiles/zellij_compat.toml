# Supported equivalents of Zellij's canonical pane, tab, resize, and scroll
# keybindings. Bmux represents Zellij's temporary modes as multi-key chords so
# terminal input remains in the passthrough insert mode between commands.
[keybindings.modes.insert.bindings]
# Pane mode (Ctrl+p)
"ctrl+p down"  = "focus_down_pane"
"ctrl+p f"     = "zoom_pane"
"ctrl+p h"     = "focus_left_pane"
"ctrl+p j"     = "focus_down_pane"
"ctrl+p k"     = "focus_up_pane"
"ctrl+p l"     = "focus_right_pane"
"ctrl+p left"  = "focus_left_pane"
"ctrl+p n"     = "split_focused_horizontal"
"ctrl+p p"     = "focus_next_pane"
"ctrl+p r"     = "split_focused_vertical"
"ctrl+p right" = "focus_right_pane"
"ctrl+p up"    = "focus_up_pane"
"ctrl+p x"     = "plugin:bmux.tabs:close-active-pane"

# Tab mode (Ctrl+t)
"ctrl+t 1"     = "plugin:bmux.tabs:goto-tab 1"
"ctrl+t 2"     = "plugin:bmux.tabs:goto-tab 2"
"ctrl+t 3"     = "plugin:bmux.tabs:goto-tab 3"
"ctrl+t 4"     = "plugin:bmux.tabs:goto-tab 4"
"ctrl+t 5"     = "plugin:bmux.tabs:goto-tab 5"
"ctrl+t 6"     = "plugin:bmux.tabs:goto-tab 6"
"ctrl+t 7"     = "plugin:bmux.tabs:goto-tab 7"
"ctrl+t 8"     = "plugin:bmux.tabs:goto-tab 8"
"ctrl+t 9"     = "plugin:bmux.tabs:goto-tab 9"
"ctrl+t down"  = "plugin:bmux.tabs:next-tab"
"ctrl+t h"     = "plugin:bmux.tabs:prev-tab"
"ctrl+t j"     = "plugin:bmux.tabs:next-tab"
"ctrl+t k"     = "plugin:bmux.tabs:prev-tab"
"ctrl+t l"     = "plugin:bmux.tabs:next-tab"
"ctrl+t left"  = "plugin:bmux.tabs:prev-tab"
"ctrl+t n"     = "plugin:bmux.tabs:new-tab"
"ctrl+t right" = "plugin:bmux.tabs:next-tab"
"ctrl+t tab"   = "plugin:bmux.tabs:last-tab"
"ctrl+t up"    = "plugin:bmux.tabs:prev-tab"
"ctrl+t x"     = "plugin:bmux.tabs:close-current-tab"

# Resize mode (Ctrl+n)
"ctrl+n ="     = "increase_split"
"ctrl+n down"  = "resize_down"
"ctrl+n h"     = "resize_left"
"ctrl+n j"     = "resize_down"
"ctrl+n k"     = "resize_up"
"ctrl+n l"     = "resize_right"
"ctrl+n left"  = "resize_left"
"ctrl+n minus" = "decrease_split"
"ctrl+n plus"  = "increase_split"
"ctrl+n right" = "resize_right"
"ctrl+n up"    = "resize_up"

# Scroll mode (Ctrl+s) is a single global stroke in canonical Zellij.

# Canonical global Zellij bindings with direct bmux equivalents.
[keybindings.global]
"alt+="     = "increase_split"
"alt+down"  = "focus_down_pane"
"alt+h"     = "focus_left_pane"
"alt+j"     = "focus_down_pane"
"alt+k"     = "focus_up_pane"
"alt+l"     = "focus_right_pane"
"alt+left"  = "focus_left_pane"
"alt+minus" = "decrease_split"
"alt+n"     = "split_focused_horizontal"
"alt+plus"  = "increase_split"
"alt+right" = "focus_right_pane"
"alt+up"    = "focus_up_pane"
"ctrl+s"    = "enter_scroll_mode"
