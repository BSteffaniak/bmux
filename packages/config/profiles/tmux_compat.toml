[keybindings]
initial_mode = "insert"
prefix       = "ctrl+b"

[keybindings.modes.insert.bindings]
"ctrl+b" = "enter_mode normal"

[keybindings.modes.normal.bindings]
"%"         = "split_focused_vertical"
"?"         = "show_help"
"\""        = "split_focused_horizontal"
arrow_down  = "focus_down_pane"
arrow_left  = "focus_left_pane"
arrow_right = "focus_right_pane"
arrow_up    = "focus_up_pane"
c           = "plugin:bmux.tabs:new-tab"
d           = "detach"
escape      = "enter_mode insert"
f           = "plugin:bmux.finder:show"
l           = "plugin:bmux.workspaces:last-workspace"
n           = "plugin:bmux.tabs:next-tab"
o           = "focus_next_pane"
p           = "plugin:bmux.tabs:prev-tab"
x           = "plugin:bmux.tabs:close-active-pane"
z           = "zoom_pane"
