    "packages/codec-derive",
    "packages/fonts",
    "packages/cli_output",
    "packages/cli",
    "packages/cli-schema",
    "packages/client",
    "packages/client-state",
    "packages/clipboard",
    "packages/config",
    "packages/config-doc",
    "packages/config-doc-derive",
    "packages/context-state",
    "packages/diagnostic-log",
    "packages/event/models",
    "packages/ipc",
    "packages/keybind",
    "packages/performance-state",
    "packages/perf-telemetry",
    "packages/plugin",
    "packages/plugin-runtime",
    "packages/plugin-schema",
    "packages/plugin-schema-macros",
    "packages/plugin-sdk",
    "packages/perf-tools",
    "packages/pane-runtime-state",
    "packages/recording-protocol",
    "packages/recording-runtime",
    "packages/server",
    "packages/session-state",
    "packages/session/models",
    "packages/snapshot-protocol",
    "packages/snapshot-runtime",
    "packages/sandbox-harness",
    "packages/scene-protocol",
    "packages/scene-protocol-render",
    "packages/slots",
    "packages/bmux-env",
    "packages/terminal_protocol",
    "packages/terminal-grid",
    "packages/keyboard",
    "packages/text-edit",
    "packages/tui",
    "packages/tui-components",
    "packages/tui-runtime",
    "packages/mobile-core",
    "packages/mobile-ffi",
    "packages/image",
    "packages/docs-site",
    "packages/docs-site/ui",
    "plugins/clients-plugin",
    "plugins/clients-plugin-api",
    "plugins/clipboard-plugin",
    "plugins/cluster-plugin",
    "plugins/cluster-plugin-api",
    "plugins/cluster-plugin-client",
    "plugins/connections-plugin",
    "plugins/connections-plugin-api",
    "plugins/command-palette-plugin",
    "plugins/contexts-plugin",
    "plugins/contexts-plugin-api",
    "plugins/control-catalog-plugin",
    "plugins/control-catalog-plugin-api",
    "plugins/decoration-plugin",
    "plugins/decoration-plugin-api",
    "plugins/decoration-plugin-renderer",
    "plugins/pane-runtime-plugin",
    "plugins/pane-runtime-plugin-api",
    "plugins/plugin-cli-plugin",
    "plugins/permissions-plugin-api",
    "plugins/permissions-plugin",
    "plugins/performance-plugin",
    "plugins/performance-plugin-api",
    "plugins/prompted-actions-plugin",
    "plugins/recording-plugin",
    "plugins/recording-plugin-api",
    "plugins/sessions-plugin",
    "plugins/sessions-plugin-api",
    "plugins/snapshot-plugin",
    "plugins/snapshot-plugin-api",
    "plugins/theme-plugin",
    "plugins/visual-adapters-plugin-renderer",
    "plugins/windows-plugin",
    "plugins/windows-plugin-api",
]

resolver = "2"

[workspace.metadata.cargo-machete]
ignored = ["log"]

[profile.release]
codegen-units = 1
lto           = false
opt-level     = 3
strip         = "symbols"

[profile.debug-release]
debug    = true
inherits = "release"
strip    = "none"

[profile.profiling]
debug    = 1
inherits = "release"
strip    = "none"

[profile.release-lto]
inherits = "release"
lto      = "fat"

[profile.release-lto-no-panic]
inherits = "release-lto"
panic    = "abort"

[profile.small]
inherits  = "release-lto-no-panic"
opt-level = "z"

[profile.fast]
inherits  = "dev"
opt-level = 0

[workspace.package]
authors    = ["Braden Steffaniak"]
edition    = "2024"
license    = "MPL-2.0"
repository = "https://github.com/BSteffaniak/bmux"
version    = "0.0.1-alpha.1"

