name: Shared plugin acceptance (integration phase)

# Deliberately manual: initial parallel source authoring forbids validation.
# This is not the static/dynamic packaging matrix; X1 artifact wiring is separate.
on:
  workflow_dispatch:
    inputs:
      source_converged:
        description: "Coordinator confirms source convergence and authorizes integration validation"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  behavior:
    if: ${{ inputs.source_converged }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Clippy before the full nextest suite
        run: nix develop --command cargo clippy --all-targets -- -D warnings
      - name: Full nextest suite including shared plugin acceptance fixtures
        run: nix develop --command cargo nextest run --no-fail-fast
      - name: Unused dependency acceptance
        run: nix develop --command cargo machete --with-metadata
      - name: Artifact harness failure-path fixtures
        run: nix develop --command python3 scripts/test-shared-plugin-artifact-acceptance.py
