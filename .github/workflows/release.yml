name: Release Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [stable, nightly]
        default: stable
      version:
        description: "Base version override"
        type: string
        required: false

permissions:
  contents: write

# Serialize publication so the existing-release gate cannot race another run.
concurrency:
  group: release-distribution
  cancel-in-progress: false

jobs:
  rust-version:
    uses: ./.github/workflows/rust-version.yml

  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable release metadata once
        id: meta
        env:
          RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/resolve-release-metadata.py
      - name: Refuse to replace an existing published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          # A missing release is expected; auth/network failures must not be ignored.
          STATUS="$(curl --silent --show-error --output release-probe.json --write-out '%{http_code}' \
            --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/BSteffaniak/bmux/releases/tags/$RELEASE_TAG")"
          test "$STATUS" = 404 || { echo "Refusing release publication: HTTP $STATUS" >&2; exit 1; }

  build-web-assets:
    needs: [release-metadata]
    runs-on: ubuntu-latest
    env:
      BMUX_WEB_RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
      BMUX_WEB_ASSET_OUTPUT: ${{ github.workspace }}/target/release-web-assets
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build browser WASM once with locked Nix and matching bindgen
        run: nix develop --command bash scripts/build-web-renderer.sh
      - name: Package exact renderer inputs and checksums
        run: nix develop --command python3 scripts/package-web-assets.py --assets "$BMUX_WEB_ASSET_OUTPUT" --output web-release
      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: web-release/*
          if-no-files-found: error

  build-artifacts:
    needs: [rust-version, release-metadata]
    env:
      BMUX_WEB_RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: bmux
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: bmux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin: bmux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: bmux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: bmux.exe
    steps:
      - name: Preserve source bytes for cross-platform renderer identity
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.rust-version.outputs.version }}
          targets: ${{ matrix.target }}, wasm32-unknown-unknown

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p ~/.cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> ~/.cargo/config.toml

      - uses: Swatinem/rust-cache@v2

      - name: Build complete bmux product
        shell: bash
        run: cargo xtask build --profile release --target '${{ matrix.target }}'

      - name: Prepare archive
        shell: bash
        run: |
          VERSION="${{ needs.release-metadata.outputs.version }}"
          cargo xtask auxiliary stage --target '${{ matrix.target }}' --artifact-dir 'target/${{ matrix.target }}/release' --destination dist
          tar -czf "bmux-${VERSION}-${{ matrix.target }}.tar.gz" -C dist .

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: bmux-*.tar.gz

  package-linux:
    name: Build deb/rpm packages
    runs-on: ubuntu-latest
    needs: [rust-version, build-artifacts, release-metadata]
    env:
      BMUX_WEB_RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            rpm_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            rpm_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.rust-version.outputs.version }}
          targets: ${{ matrix.target }}, wasm32-unknown-unknown

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu rpm createrepo-c dpkg-dev apt-utils gnupg

      - name: Configure linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p ~/.cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' >> ~/.cargo/config.toml

      - name: Install nfpm
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_Linux_x86_64.tar.gz | tar -xz
          sudo mv nfpm /usr/local/bin/nfpm

      - name: Build complete bmux product
        run: cargo xtask build --profile release --target '${{ matrix.target }}'

      - name: Stage distribution
        shell: bash
        run: cargo xtask auxiliary stage --target '${{ matrix.target }}' --artifact-dir 'target/${{ matrix.target }}/release' --destination 'dist/${{ matrix.target }}'

      - name: Build deb package
        shell: bash
        run: |
          export VERSION="${{ needs.release-metadata.outputs.version }}"
          export TARGET="${{ matrix.target }}"
          export ARCH="${{ matrix.arch }}"
          CFG="packaging/nfpm/${{ needs.release-metadata.outputs.channel }}.yaml"
          cargo xtask auxiliary nfpm --target "$TARGET" --config "$CFG" --destination /tmp/bmux-deb.yaml
          nfpm package --packager deb --target "out/${{ needs.release-metadata.outputs.channel }}/artifacts" --config /tmp/bmux-deb.yaml

      - name: Build rpm package
        shell: bash
        run: |
          export VERSION="${{ needs.release-metadata.outputs.version }}"
          export TARGET="${{ matrix.target }}"
          export ARCH="${{ matrix.rpm_arch }}"
          CFG="packaging/nfpm/${{ needs.release-metadata.outputs.channel }}.yaml"
          cargo xtask auxiliary nfpm --target "$TARGET" --config "$CFG" --destination /tmp/bmux-rpm.yaml
          nfpm package --packager rpm --target "out/${{ needs.release-metadata.outputs.channel }}/artifacts" --config /tmp/bmux-rpm.yaml

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.target }}
          path: out/${{ needs.release-metadata.outputs.channel }}/artifacts/*

  publish:
    name: Publish release and package indexes
    runs-on: ubuntu-latest
    needs: [rust-version, build-artifacts, package-linux, release-metadata, build-web-assets]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files
          find artifacts -name '*.tar.gz' -type f -exec cp {} release-files/ \;
          find artifacts -name '*.deb' -type f -exec cp {} release-files/ \;
          find artifacts -name '*.rpm' -type f -exec cp {} release-files/ \;
          cp artifacts/web-assets/bmux-web-assets-* release-files/
          (cd release-files && shasum -a 256 * > SHA256SUMS)

      - name: Install repo tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg createrepo-c

      - name: Import repository signing key
        if: ${{ env.GPG_PRIVATE_KEY != '' && env.GPG_KEY_ID != '' }}
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build apt repository metadata
        shell: bash
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p out/${{ needs.release-metadata.outputs.channel }}/artifacts
          cp release-files/*.deb out/${{ needs.release-metadata.outputs.channel }}/artifacts/ || true
          cp release-files/*.rpm out/${{ needs.release-metadata.outputs.channel }}/artifacts/ || true
          chmod +x packaging/repo/build-apt-repo.sh
          ./packaging/repo/build-apt-repo.sh "${{ needs.release-metadata.outputs.channel }}" out

      - name: Build rpm repository metadata
        shell: bash
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          chmod +x packaging/repo/build-rpm-repo.sh
          ./packaging/repo/build-rpm-repo.sh "${{ needs.release-metadata.outputs.channel }}" out

      - name: Write latest channel manifest
        shell: bash
        run: |
          CHANNEL="${{ needs.release-metadata.outputs.channel }}"
          VERSION="${{ needs.release-metadata.outputs.version }}"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p "out/$CHANNEL"
          cat > "out/$CHANNEL/latest.json" <<EOF
          {
            "channel": "$CHANNEL",
            "version": "$VERSION",
            "updated_at": "$NOW",
            "artifacts_base": "https://packages.bmux.dev/$CHANNEL/artifacts/$VERSION",
            "apt_base": "https://packages.bmux.dev/$CHANNEL/apt",
            "rpm_base": "https://packages.bmux.dev/$CHANNEL/rpm"
          }
          EOF

      - name: Export public signing key
        if: ${{ env.GPG_KEY_ID != '' }}
        shell: bash
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          mkdir -p out/keys
          gpg --batch --yes --armor --export "$GPG_KEY_ID" > out/keys/bmux-packages.asc
          gpg --batch --yes --fingerprint "$GPG_KEY_ID" > out/keys/bmux-packages-fingerprint.txt

      - name: Upload release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-metadata.outputs.tag }}
          name: bmux ${{ needs.release-metadata.outputs.version }}
          prerelease: ${{ needs.release-metadata.outputs.prerelease == 'true' }}
          files: |
            release-files/*

      - name: Upload artifacts and repos to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        shell: bash
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_ENDPOINT"
          test -n "$R2_BUCKET"
          python -m pip install --user awscli
          export PATH="$HOME/.local/bin:$PATH"
          CHANNEL="${{ needs.release-metadata.outputs.channel }}"
          VERSION="${{ needs.release-metadata.outputs.version }}"
          aws --endpoint-url "$R2_ENDPOINT" s3 cp release-files "s3://$R2_BUCKET/$CHANNEL/artifacts/$VERSION" --recursive
          aws --endpoint-url "$R2_ENDPOINT" s3 cp out/$CHANNEL/apt "s3://$R2_BUCKET/$CHANNEL/apt" --recursive
          aws --endpoint-url "$R2_ENDPOINT" s3 cp out/$CHANNEL/rpm "s3://$R2_BUCKET/$CHANNEL/rpm" --recursive
          aws --endpoint-url "$R2_ENDPOINT" s3 cp out/$CHANNEL/latest.json "s3://$R2_BUCKET/$CHANNEL/latest.json"
          if [ -d out/keys ]; then
            aws --endpoint-url "$R2_ENDPOINT" s3 cp out/keys "s3://$R2_BUCKET/keys" --recursive
          fi
