name: Live Validation

on:
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.16.0'}
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with: {tofu_version: '1.10.9', tofu_wrapper: false}
      - name: Offline infrastructure and setup validation
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tofu -chdir=infra/live-terraform init -backend=false -input=false -lockfile=readonly
          tofu -chdir=infra/live-terraform fmt -check
          tofu -chdir=infra/live-github init -backend=false -input=false -lockfile=readonly
          tofu -chdir=infra/live-github fmt -check -recursive
          tofu -chdir=infra/live-github validate
          tofu -chdir=infra/live-github test
          tofu -chdir=infra/live-terraform validate
          python3 scripts/test-live-bootstrap.py
          python3 scripts/test-live-github-environments.py
          python3 scripts/test-setup-live.py
          python3 scripts/test-live-state-recovery.py
          python3 scripts/test-live-state-provision.py
          python3 scripts/test-live-imports.py
          python3 scripts/test-live-build-artifact.py
          python3 scripts/test-live-fly.py
          python3 scripts/test-live-plan-policy.py
          python3 scripts/test-live-deploy.py
          python3 scripts/test-live-deploy-diagnostics.py
          python3 scripts/test-live-install.py
          python3 scripts/test-live-state.py
          python3 scripts/test-archive-live-state.py
          python3 scripts/test-live-smoke.py
          python3 scripts/test-live-native-browser-startup.py
          python3 scripts/test-compat-pty.py
          python3 scripts/test-live-guided-setup.py
          python3 scripts/test-live-deployment-boundary.py
          node --test scripts/test-site-cache-headers.mjs
          # Rust relay tests belong to workspace validation, not the retired runtime.
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.16.0'}
      - name: Resolve browser from the repository locked nixpkgs input
        timeout-minutes: 20
        run: |
          set -euo pipefail
          chromium="$(nix build --no-link --print-out-paths --impure --expr '
            let flake = builtins.getFlake (toString ./.);
            in flake.inputs.nixpkgs.legacyPackages.x86_64-linux.chromium
          ')"
          test -x "$chromium/bin/chromium"
          echo "LIVE_ACCEPTANCE_BROWSER=$chromium/bin/chromium" >> "$GITHUB_ENV"
      - name: Check isolated Chromium startup with deep runner paths
        run: python3 scripts/test-live-native-browser-startup.py --browser "$LIVE_ACCEPTANCE_BROWSER"
      - name: Native runtime and live renderer acceptance (no deployment)
        run: |
          bash scripts/dev.sh bash -euo pipefail -c '
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            bash scripts/smoke-pty-runtime.sh
            bash scripts/compat-matrix.sh
            bash scripts/build-site-artifact.sh "$RUNNER_TEMP/acceptance-site"
            test "$(cat "$RUNNER_TEMP/acceptance-site/REVISION")" = "$GITHUB_SHA"
            cargo build --locked -p bmux-live-relay -p bmux_cli
            cargo build --locked -p bmux_web_renderer --example snapshot --example wire_frame
            target_dir="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c "import json,sys; print(json.load(sys.stdin)[\"target_directory\"])")"
            "$target_dir/debug/examples/snapshot" --binary > "$RUNNER_TEMP/native-frame.bmwp"
            version="$(cat "$RUNNER_TEMP/acceptance-site/site/live-assets/current-version")"
            assets="$RUNNER_TEMP/acceptance-site/site/live-assets/$version"
            python3 scripts/smoke-live-local.py --relay "$target_dir/debug/bmux-live-relay" \
              --assets "$assets" --frame "$RUNNER_TEMP/native-frame.bmwp"
            timeout --signal=TERM --kill-after=30s 10m python3 scripts/live-browser-acceptance.py \
              --browser "$LIVE_ACCEPTANCE_BROWSER" --site "$RUNNER_TEMP/acceptance-site/site" \
              --fixture "$RUNNER_TEMP/native-frame.bmwp" --relay "$target_dir/debug/bmux-live-relay" \
              --wire-tool "$target_dir/debug/examples/wire_frame"
            binary_sha256="$(sha256sum "$target_dir/debug/bmux" | cut -d " " -f 1)"
            timeout --signal=TERM --kill-after=30s 15m python3 scripts/live-native-acceptance.py \
              --browser "$LIVE_ACCEPTANCE_BROWSER" --binary "$target_dir/debug/bmux" \
              --sha256 "$binary_sha256" --assets "$assets" --relay "$target_dir/debug/bmux-live-relay" \
              --wire-tool "$target_dir/debug/examples/wire_frame"
          '
