name: Recover live cutover
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preview:
    if: github.ref == 'refs/heads/master' && github.repository == 'BSteffaniak/bmux'
    uses: ./.github/workflows/live-recovery-task.yml
    secrets: inherit
    with:
      apply: false
  approve:
    needs: [preview]
    runs-on: ubuntu-24.04
    environment: production-approval
    steps:
      - run: echo 'Approve missing relay resources in the recovery preview; preserve existing app and state'
  recover:
    needs: [preview, approve]
    uses: ./.github/workflows/live-recovery-task.yml
    secrets: inherit
    with:
      apply: true
      digest: ${{ needs.preview.outputs.digest }}
  site:
    needs: [recover]
    uses: ./.github/workflows/docs-deploy.yml
    secrets: inherit
    with:
      reuse_candidate: true
