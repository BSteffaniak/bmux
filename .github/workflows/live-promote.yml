name: Live production release
on:
  workflow_call:
    inputs:
      configure:
        type: boolean
        default: false
      reviewed_imports:
        type: string
        default: '{}'
      approve_import:
        type: boolean
        default: false
  workflow_dispatch:
  pull_request:
    paths: ['infra/live-**', 'scripts/*live*', '.github/workflows/live-*.yml']
permissions:
  contents: read
  id-token: write
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22.16.0'}
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with: {tofu_version: '1.10.9', tofu_wrapper: false}
      - name: Offline infrastructure validation
        run: |
          tofu -chdir=infra/live-terraform init -backend=false -input=false -lockfile=readonly
          tofu -chdir=infra/live-terraform fmt -check
          tofu -chdir=infra/live-terraform validate
          python3 scripts/test-live-bootstrap.py
          python3 scripts/test-live-state-provision.py
          python3 scripts/test-live-imports.py
          python3 scripts/test-live-plan-policy.py
          python3 scripts/test-live-deploy.py
      - name: Build one immutable candidate without deployment secrets
        run: |
          bash scripts/dev.sh bash scripts/build-live-artifact.sh "$RUNNER_TEMP/live-candidate"
          tar -C "$RUNNER_TEMP/live-candidate" -czf "$RUNNER_TEMP/live-candidate.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum live-candidate.tar.gz > live-candidate.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/live-candidate.tar.gz
            ${{ runner.temp }}/live-candidate.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
  approve:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    environment: production-approval
    steps:
      - run: echo 'Approved immutable BMUX production release'
  production:
    needs: [build, approve]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment: Production
    concurrency:
      group: bmux-production-infrastructure
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIVE_STATE_ROLE_ARN: ${{ secrets.LIVE_STATE_ROLE_ARN }}
      LIVE_STATE_REGION: ${{ secrets.LIVE_STATE_REGION }}
      LIVE_STATE_ACCESS_KEY_ID: ${{ secrets.LIVE_STATE_ACCESS_KEY_ID }}
      LIVE_STATE_SECRET_ACCESS_KEY: ${{ secrets.LIVE_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with: {tofu_version: '1.10.9', tofu_wrapper: false}
      - name: Assume repository-branch-environment scoped state role
        if: env.LIVE_STATE_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.LIVE_STATE_ROLE_ARN }}
          aws-region: ${{ env.LIVE_STATE_REGION }}
          mask-aws-account-id: true
          role-session-name: bmux-live-${{ github.run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: live-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/live-download
      - name: Configure or release the verified immutable candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          LIVE_HOSTNAME: ${{ secrets.LIVE_HOSTNAME }}
          LIVE_PAGES_PROJECT: ${{ secrets.LIVE_PAGES_PROJECT }}
          LIVE_PUBLISHER_KEY_SHA256: ${{ secrets.LIVE_PUBLISHER_KEY_SHA256 }}
          LIVE_STATE_BUCKET: ${{ secrets.LIVE_STATE_BUCKET }}
          LIVE_CONFIGURE: ${{ inputs.configure || false }}
          LIVE_REVIEWED_IMPORTS: ${{ inputs.reviewed_imports || '{}' }}
          LIVE_APPROVE_IMPORT: ${{ inputs.approve_import || false }}
        run: |
          cd "$RUNNER_TEMP/live-download"
          sha256sum -c live-candidate.tar.gz.sha256
          mkdir "$RUNNER_TEMP/live-candidate"
          tar -xzf live-candidate.tar.gz -C "$RUNNER_TEMP/live-candidate"
          test "$(cat "$RUNNER_TEMP/live-candidate/REVISION")" = "$GITHUB_SHA"
          mode=release
          if [[ "$LIVE_CONFIGURE" == true ]]; then mode=configure; fi
          bash "$GITHUB_WORKSPACE/scripts/live-deploy.sh" production "$RUNNER_TEMP/live-candidate" "$mode"
