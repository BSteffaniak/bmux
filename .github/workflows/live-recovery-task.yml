name: Live recovery task
on:
  workflow_call:
    inputs:
      apply:
        type: boolean
        required: true
      digest:
        type: string
        default: ''
    outputs:
      digest:
        value: ${{ jobs.task.outputs.digest }}
permissions:
  contents: read
  actions: read
jobs:
  task:
    if: github.ref == 'refs/heads/master' && github.repository == 'BSteffaniak/bmux'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    concurrency:
      group: bmux-production-infrastructure
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.operation.outputs.recovery_digest }}
    env:
      LIVE_STATE_REGION: auto
      R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
      TOFU_STATE_ENCRYPTION_PASSPHRASE: ${{ secrets.TOFU_STATE_ENCRYPTION_PASSPHRASE }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      LIVE_FLY_APP: ${{ vars.LIVE_FLY_APP }}
      LIVE_FLY_ORG: ${{ vars.LIVE_FLY_ORG }}
      LIVE_FLY_REGION: ${{ vars.LIVE_FLY_REGION }}
      LIVE_METRICS_KEY_SHA256: ${{ secrets.LIVE_METRICS_KEY_SHA256 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      LIVE_HOSTNAME: ${{ secrets.LIVE_HOSTNAME }}
      LIVE_PAGES_PROJECT: ${{ secrets.LIVE_PAGES_PROJECT }}
      LIVE_PUBLISHER_KEY_SHA256: ${{ secrets.LIVE_PUBLISHER_KEY_SHA256 }}
      LIVE_STATE_BUCKET: ${{ secrets.LIVE_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with: {tofu_version: '1.10.9', tofu_wrapper: false}
      - name: Install image transfer tool (apply only)
        if: inputs.apply
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 39048863096
          name: live-candidate-e84e1b69a4f59e8174e5a4ac8aa7af18f207d480
          path: ${{ runner.temp }}/backend-source
      - name: Reuse verified backend with current infrastructure (no compilation)
        run: python3 scripts/reuse-live-backend.py "$RUNNER_TEMP/backend-source" "$RUNNER_TEMP/live-candidate"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.apply
        with:
          github-token: ${{ github.token }}
          run-id: 39048863096
          name: site-candidate-e84e1b69a4f59e8174e5a4ac8aa7af18f207d480
          path: ${{ runner.temp }}/site-source
      - name: Reuse verified site before recovery (no publication)
        if: inputs.apply
        run: |
          python3 scripts/reuse-live-backend.py "$RUNNER_TEMP/site-source" "$RUNNER_TEMP/site-candidate" site
          tar -C "$RUNNER_TEMP/site-candidate" -czf "$RUNNER_TEMP/site-candidate.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum site-candidate.tar.gz > site-candidate.tar.gz.sha256
      - name: Preview or apply explicit partial-cutover recovery
        id: operation
        env:
          APPLY: ${{ inputs.apply }}
          LIVE_RECOVERY_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          mode=preview-recovery
          if [[ "$APPLY" == true ]]; then mode=recover; fi
          bash scripts/live-deploy.sh production "$RUNNER_TEMP/live-candidate" "$mode"
      - name: Read-only state diagnosis after recovery failure
        if: failure()
        env:
          LIVE_ENVIRONMENT: production
        run: python3 -B scripts/inspect-live-migration.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.apply
        with:
          name: site-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/site-candidate.tar.gz
            ${{ runner.temp }}/site-candidate.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
