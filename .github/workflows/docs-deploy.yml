name: Deploy Docs Site
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/docs-deploy.yml'
      - '.github/workflows/live-*.yml'
      - 'packages/docs-site/**'
      - 'packages/web-renderer/**'
      - 'packages/cli-schema/**'
      - 'packages/config/**'
      - 'packages/config-doc/**'
      - 'packages/config-doc-derive/**'
      - 'infra/live-**'
      - 'scripts/*live*'
      - 'scripts/build-web-renderer.sh'
      - 'flake.lock'
      - 'docs/**'
      - 'README.md'
      - 'TESTING.md'
      - 'packages/cli/README.md'
      - 'packages/plugin/README.md'
      - 'examples/native-plugin/README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Single Pages owner: live assets are copied BEFORE docs gen, then the same
  # native/viewer/relay/site artifact goes directly through protected production.
  promote:
    uses: ./.github/workflows/live-promote.yml
    secrets: inherit
