name: Live public smoke

on:
  workflow_dispatch:
    inputs:
      component:
        description: Public component to verify (no build or deployment)
        type: choice
        options: [all, backend, site]
        default: all

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify public production endpoints and immutable assets
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -o pipefail
          python3 scripts/smoke-live-broadcast.py --url https://bmux.dev --component "$COMPONENT" | tee smoke-report.jsonl
      - name: Retain safe smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-public-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-report.jsonl
          if-no-files-found: warn
          retention-days: 14
