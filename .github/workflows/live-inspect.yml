name: Inspect live migration (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/master' && github.repository == 'BSteffaniak/bmux'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: Production
    concurrency:
      group: bmux-production-infrastructure
      cancel-in-progress: false
    env:
      LIVE_ENVIRONMENT: production
      LIVE_STATE_REGION: auto
      LIVE_STATE_BUCKET: ${{ secrets.LIVE_STATE_BUCKET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
      TOFU_STATE_ENCRYPTION_PASSPHRASE: ${{ secrets.TOFU_STATE_ENCRYPTION_PASSPHRASE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with: {tofu_version: '1.10.9', tofu_wrapper: false}
      - name: Read canonical state ownership and migration status (no writes)
        run: python3 -B scripts/inspect-live-migration.py
